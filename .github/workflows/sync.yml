name: Antigravity Knowledge Graph Sync

on:
  repository_dispatch:
    types: [pomera-diary]
  workflow_dispatch:
    inputs:
      force_reanalyze:
        description: '全日記を再分析する'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run Sync and Analysis
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          pip install neo4j --quiet
          python scripts/sync_email.py

      - name: Force Reanalyze All Diaries
        if: ${{ github.event.inputs.force_reanalyze == 'true' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "🔄 全日記の強制再分析を開始..."
          for f in diary/*.txt; do
            echo "📝 分析中: $f"
            python scripts/llm_graph_builder.py "$f" || echo "⚠️ 失敗: $f"
            sleep 5
          done

      - name: Update Finance Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -f finance_context.json ]; then
            echo "💰 家計レポートを更新中..."
            python scripts/finance_analyzer.py --output finance_report.json || echo "⚠️ finance_analyzer.py 失敗（スキップ）"
          else
            echo "💤 finance_context.json がないためスキップします"
          fi

      - name: Update Study Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_STUDY_BLOG_ID: ${{ secrets.HATENA_STUDY_BLOG_ID }}
        run: |
          echo "📚 勉強レポートを更新中..."
          pip install neo4j --quiet
          python scripts/study_analyzer.py || echo "⚠️ study_analyzer.py 失敗（スキップ）"
          echo "📝 study_drafts/ のファイルからブログ記事を生成中..."
          if ls study_drafts/*.txt 2>/dev/null | head -1 | grep -q .; then
            for f in study_drafts/*.txt; do
              echo "  → $f"
              python scripts/study_blog_writer.py "$f" || echo "⚠️ 失敗: $f"
              sleep 5
            done
          else
            echo "💤 study_drafts/ にファイルがありません"
          fi

      - name: HTML の整合性チェック
        run: python3 scripts/validate_html.py graph_data.js

      - name: Generate Node Sprites
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "🎨 日記ノードからキャラクター画像を生成中..."
          pip install google-generativeai --quiet
          python scripts/generate_node_sprites.py || echo "⚠️ generate_node_sprites.py 失敗（スキップ）"

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Antigravity Bot"
          git add diary/*.txt || true
          git add knowledge_graph.jsonld || true
          git add role_definition.txt || true
          git add graph_data.js || true
          git add sprites/characters/nodes/ || true
          git add daily_graph.json || true
          git add daily_report.md || true
          git add story_drafts/ || true
          git add study_drafts/ || true
          git add sync_history.txt || true
          git add finance_report.json || true
          git add finance_context.json || true
          git add study_report.json || true
          git add blog_ready/ || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "変更なし。スキップします。"
          else
            git commit -m "Auto-sync: Antigravity Graph Update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main || {
                echo "⚠️ rebaseコンフリクト発生。自動解決します..."
                git checkout --theirs diary/ knowledge_graph.jsonld graph_data.js daily_graph.json daily_report.md sync_history.txt finance_report.json finance_context.json 2>/dev/null || true
                git add -A
                git rebase --continue || git rebase --skip
              }
              git push && break || {
                echo "⚠️ push失敗（試行 $i/3）。リトライします..."
                sleep 3
              }
            done
          fi
