<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Advisor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-deeper: #0a0f1c;
      --card-bg: rgba(30, 41, 59, 0.7);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --accent-primary: #38bdf8;
      --accent-secondary: #818cf8;
      --accent-success: #34d399;
      --accent-warning: #fbbf24;
      --accent-danger: #f87171;
      --accent-purple: #a78bfa;
      --accent-pink: #f472b6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(16px);
      --gravity-red: #ef4444;
      --gravity-orange: #f97316;
      --gravity-yellow: #eab308;
      --energy-green: #22c55e;
      --energy-teal: #14b8a6;
      --energy-blue: #3b82f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: var(--bg-dark);
      background-image:
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(129, 140, 248, 0.04) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(167, 139, 250, 0.03) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }

    /* --- Sidebar --- */
    aside {
      background: rgba(10, 15, 28, 0.9);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      backdrop-filter: var(--glass-blur);
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 40px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav ul {
      list-style: none;
    }

    nav li {
      margin-bottom: 4px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .nav-link:hover {
      background: var(--glass-bg);
      color: var(--text-main);
    }

    .nav-link.active {
      background: rgba(56, 189, 248, 0.08);
      color: var(--accent-primary);
      border-color: rgba(56, 189, 248, 0.15);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 8px 0;
      border-top: 1px solid var(--border-color);
    }

    /* --- Main Content --- */
    main {
      padding: 32px 40px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .dashboard-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- Header --- */
    .header-section {
      margin-bottom: 32px;
    }

    .header-section h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-section .date-text {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* --- Coach Card --- */
    .coach-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.08), rgba(167, 139, 250, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
    }

    .coach-card::before {
      content: '🚀';
      position: absolute;
      top: -10px;
      right: 20px;
      font-size: 80px;
      opacity: 0.06;
    }

    .coach-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-primary);
      margin-bottom: 12px;
    }

    #coach-comment {
      font-size: 16px;
      line-height: 1.8;
      font-weight: 400;
      color: var(--text-main);
      position: relative;
      z-index: 1;
    }

    /* --- Grid Layout --- */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .dashboard-grid .full-width {
      grid-column: 1 / -1;
    }

    /* --- Cards --- */
    .dash-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: var(--glass-blur);
      transition: border-color 0.2s;
    }

    .dash-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
    }

    .card-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* --- Mind Mirror --- */
    .mind-overview {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: 18px;
      align-items: stretch;
    }

    .mind-lead {
      font-size: 15px;
      line-height: 1.8;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .mind-focus-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .mind-focus-tile {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
      min-width: 0;
    }

    .mind-focus-label {
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .mind-focus-text {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-main);
      overflow-wrap: anywhere;
    }

    .mind-question {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.16);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.7;
    }

    .need-panel {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px;
    }

    .need-row {
      margin-bottom: 13px;
    }

    .need-row:last-child {
      margin-bottom: 0;
    }

    .need-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .need-status {
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .need-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .need-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
    }

    .need-desc {
      color: var(--text-dim);
      font-size: 10px;
      line-height: 1.5;
    }

    .mind-emotions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .emotion-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
    }

    .emotion-chip.positive {
      background: rgba(34, 197, 94, 0.12);
      color: #22c55e;
    }

    .emotion-chip.negative {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }

    .value-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .value-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .value-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .value-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .value-cue {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .value-score {
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }

    .value-bar {
      grid-column: 1 / -1;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
    }

    .value-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      border-radius: 999px;
    }

    .woop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .woop-step {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
    }

    .woop-label {
      color: var(--accent-primary);
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .woop-text {
      color: var(--text-main);
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .value-shift-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .value-shift-item {
      background: rgba(167, 139, 250, 0.08);
      border: 1px solid rgba(167, 139, 250, 0.18);
      border-radius: 12px;
      padding: 14px;
      min-width: 0;
    }

    .value-shift-item.down {
      background: rgba(148, 163, 184, 0.08);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .value-shift-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }

    .value-shift-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      color: #c4b5fd;
      background: rgba(167, 139, 250, 0.16);
      border-radius: 999px;
      padding: 3px 7px;
    }

    .value-shift-item.down .value-shift-badge {
      color: #cbd5e1;
      background: rgba(148, 163, 184, 0.14);
    }

    .value-shift-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      overflow-wrap: anywhere;
    }

    .value-shift-summary {
      font-size: 12px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .value-shift-example {
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dim);
      border-left: 2px solid rgba(167, 139, 250, 0.35);
      padding-left: 8px;
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .value-shift-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      color: var(--text-dim);
      font-size: 10px;
    }

    .value-shift-meta span {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      padding: 2px 6px;
    }

    /* --- Insight Items --- */
    .insight-item {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .insight-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .insight-finding {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .insight-implication {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* --- Emotion Flow --- */
    .emotion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }

    .emotion-item:last-child {
      margin-bottom: 0;
    }

    .emotion-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .emotion-dot.positive {
      background: var(--energy-green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .emotion-dot.negative {
      background: var(--gravity-red);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    .emotion-dot.neutral {
      background: var(--accent-warning);
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    }

    .emotion-info {
      flex: 1;
      min-width: 0;
    }

    .emotion-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .emotion-context {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .emotion-score {
      font-size: 12px;
      font-weight: 700;
      font-family: 'Inter', monospace;
      min-width: 36px;
      text-align: right;
    }

    /* --- 確定予定セクション --- */
    .schedule-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 12px;
      margin-bottom: 8px;
      scrollbar-width: thin;
    }

    .schedule-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      white-space: nowrap;
      font-size: 12px;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }

    .schedule-chip:hover {
      border-color: var(--accent-primary);
    }

    .schedule-chip .chip-cat {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chip-cat-work {
      background: #60a5fa;
    }

    .chip-cat-side {
      background: #a78bfa;
    }

    .chip-cat-family {
      background: #f472b6;
    }

    .chip-cat-personal {
      background: #34d399;
    }

    .schedule-chip .chip-date {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .schedule-chip .chip-title {
      color: var(--text-primary);
    }

    .schedule-none {
      font-size: 12px;
      color: var(--text-dim);
      padding: 6px 0;
    }



    /* --- ブログ素材提案 --- */

    .blog-seed-item {
      padding: 16px;
      margin-bottom: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: border-color 0.2s;
    }

    .blog-seed-item:hover {
      border-color: var(--accent);
    }

    .blog-seed-item:last-child {
      margin-bottom: 0;
    }

    .blog-seed-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .blog-seed-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      flex: 1;
    }

    .blog-seed-theme {
      font-size: 10px;
      color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .blog-seed-sources {
      margin-bottom: 10px;
    }

    .blog-seed-sources-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .blog-seed-source-tag {
      display: inline-block;
      font-size: 11px;
      color: var(--text-secondary);
      background: rgba(148, 163, 184, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      margin: 2px 4px 2px 0;
    }

    .blog-seed-outline {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 10px;
      padding: 10px 12px;
      background: rgba(148, 163, 184, 0.05);
      border-radius: 8px;
      border-left: 3px solid var(--border-color);
    }

    .blog-seed-outline-step {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 3px;
    }

    .blog-seed-outline-step:last-child {
      margin-bottom: 0;
    }

    .blog-seed-step-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      min-width: 16px;
    }

    .blog-seed-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .blog-seed-readiness {
      display: inline-block;
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 600;
    }

    .readiness-high {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .readiness-med {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }

    .readiness-low {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
    }

    .blog-seed-action {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* --- Chat View --- */
    #chat-view {
      display: none;
      height: calc(100vh - 64px);
      flex-direction: column;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-header {
      padding-bottom: 20px;
      flex-shrink: 0;
    }

    .chat-header h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .chat-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .chat-suggestion-btn {
      padding: 8px 14px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 20px;
      color: var(--accent-primary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .chat-suggestion-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      margin-bottom: 16px;
      scroll-behavior: smooth;
    }

    .chat-message {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeInUp 0.3s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message.user {
      flex-direction: row-reverse;
    }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .chat-avatar.ai {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
    }

    .chat-avatar.user {

  <script>
    // ANALYSIS_DATA_START
    const ANALYSIS_DATA = null;
    // ANALYSIS_DATA_END


    // ── ビュー切り替え ──
    const ALL_VIEWS = ['advisor', 'chat'];

    // チャット関連の状態
    const CHAT_CF_URL = 'https://asia-northeast1-pomeradriven.cloudfunctions.net/chat-knowledge';
    let chatHistory = [];
    let chatReady = false;

    function switchView(view) {
      // chat-viewはplaceholderから移動する
      if (view === 'chat' && !chatReady) {
        const placeholder = document.getElementById('chat-view-placeholder');
        const chatEl = document.getElementById('chat-view');
        if (placeholder && chatEl) {
          document.querySelector('main').appendChild(chatEl);
          chatEl.style.display = 'flex';
          chatReady = true;
        }
      }

      ALL_VIEWS.forEach(v => {
        const el = document.getElementById(v + '-view');
        if (el) el.style.display = (v === view) ? (v === 'chat' ? 'flex' : 'block') : 'none';
      });

      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      if (event && event.currentTarget) event.currentTarget.classList.add('active');

      syncMobileNav(view);

      const main = document.querySelector('main');
      if (main) main.scrollTop = 0;
    }

    function mobileSwitch(view) {
      if (view === 'chat' && !chatReady) {
        const chatEl = document.getElementById('chat-view');
        if (chatEl) {
          document.querySelector('main').appendChild(chatEl);
          chatEl.style.display = 'flex';
          chatReady = true;
        }
      }

      ALL_VIEWS.forEach(v => {
        const el = document.getElementById(v + '-view');
        if (el) el.style.display = (v === view) ? (v === 'chat' ? 'flex' : 'block') : 'none';
      });

      syncMobileNav(view);
      syncSidebarNav(view);

      const main = document.querySelector('main');
      if (main) main.scrollTop = 0;
    }

    // ── チャット機能 ──

    function handleChatKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendChatMessage();
      }
    }

    function sendSuggestion(text) {
      document.getElementById('chat-input').value = text;
      sendChatMessage();
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const question = input.value.trim();
      if (!question) return;

      const btn = document.getElementById('chat-send-btn');
      btn.disabled = true;
      input.value = '';
      input.style.height = 'auto';

      // ユーザーメッセージを表示
      appendChatMessage('user', question);

      // タイピングインジケーター
      const typingId = appendTyping();

      try {
        const response = await fetch(CHAT_CF_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: question,
            history: chatHistory
          })
        });

        const data = await response.json();
        removeTyping(typingId);

        if (data.answer) {
          appendChatMessage('ai', data.answer);
          chatHistory.push({ role: 'user', content: question });
          chatHistory.push({ role: 'assistant', content: data.answer });
          // 履歴は最新20往復まで保持
          if (chatHistory.length > 40) chatHistory = chatHistory.slice(-40);
        } else {
          appendChatMessage('ai', '申し訳ありません、エラーが発生しました: ' + (data.error || '不明なエラー'));
        }
      } catch (err) {
        removeTyping(typingId);
        appendChatMessage('ai', 'ネットワークエラーが発生しました。時間をおいて再試行してください。');
      }

      btn.disabled = false;
      input.focus();
    }

    function appendChatMessage(role, text) {
      const messages = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `chat-message ${role}`;
      const avatar = role === 'ai' ? '🧠' : '👤';
      // Markdownをシンプルなテキストに変換（太字を先に処理）
      const formatted = text
        .replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>')
        .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/gs, '<em>$1</em>')
        .replace(/^#{1,3} (.+)$/gm, '<strong>$1</strong>')
        .replace(/^- (.+)$/gm, '• $1')
        .replace(/\n/g, '<br>');
      div.innerHTML = `
        <div class="chat-avatar ${role}">${avatar}</div>
        <div class="chat-bubble ${role}">${formatted}</div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function appendTyping() {
      const messages = document.getElementById('chat-messages');
      const div = document.createElement('div');
      const id = 'typing-' + Date.now();
      div.id = id;
      div.className = 'chat-message';
      div.innerHTML = `
        <div class="chat-avatar ai">🧠</div>
        <div class="chat-bubble ai">
          <div class="chat-typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return id;
    }

    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // テキストエリアの自動リサイズ
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('chat-input');
      if (input) {
        input.addEventListener('input', () => {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
      }
    });

    function syncMobileNav(view) {
      document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
      const viewMap = { 'advisor': 0, 'chat': 1 };
      const idx = viewMap[view];
      if (idx !== undefined) {
        const items = document.querySelectorAll('.mobile-nav-item');
        if (items[idx]) items[idx].classList.add('active');
      }
    }

    function syncSidebarNav(view) {
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      const navLinks = document.querySelectorAll('.nav-link');
      const viewMap = { 'advisor': 0, 'chat': 1 };
      const idx = viewMap[view];

    // ── 分析データの取得 ──
    function getAnalysisData() {
      // 1. 埋め込みデータがあればそれを使う
      if (ANALYSIS_DATA) return ANALYSIS_DATA;

      // 2. GRAPH_DATAの日記ノードから分析結果を取得
      // 日付降順でソートし、同一日付内では analysis_content があるノードを優先する
      const nodes = GRAPH_DATA.nodes || [];
      const diaryNodes = nodes
        .filter(n => n.type === '日記' || n.type === 'diary')
        .sort((a, b) => {
          const dateDiff = (b.date || '').localeCompare(a.date || '');
          if (dateDiff !== 0) return dateDiff;
          // 同じ日付なら analysis_content があるノードを優先
          const aHas = a.analysis_content ? 1 : 0;
          const bHas = b.analysis_content ? 1 : 0;
          return bHas - aHas;
        });

      // analysis_content を持つ最新ノードを探す
      const targetNode = diaryNodes.find(n => n.analysis_content) || diaryNodes[0];

      if (targetNode && targetNode.analysis_content) {
        let raw = targetNode.analysis_content;
        // Neo4j エクスポート時にすでに object として展開されている場合はそのまま返す
        if (typeof raw === 'object' && raw !== null) {
          return raw;
        }
        // 文字列の場合は Markdown コードブロック記法を除去して JSON パース
        raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
        try {
          let parsed = JSON.parse(raw);
          // 1回目のparseで文字列が返ってきた場合（二重エンコード）は再度パース
          if (typeof parsed === 'string') {
            parsed = JSON.parse(parsed);
          }
          return parsed;
        } catch (e) {
          // JSONパースに完全に失敗した場合はそのまま表示しない
          console.warn('analysis_content のパースに失敗しました:', e);
          return null;
        }
      }


      return null;
    }

    function parseValueShiftDate(node) {
      const raw = String(node.date || node.last_seen || node.id || node.label || '');
      const match = raw.match(/(\d{4})[-/]?(\d{2})[-/]?(\d{2})/);
      if (!match) return null;
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatValueShiftDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function valueShiftEntryText(node) {
      return [
        node.label,
        node.detail,
        node.current_state,
        Array.isArray(node.tags) ? node.tags.join(' ') : '',
        node.analysis_content
      ].filter(Boolean).join('。').slice(0, 6000);
    }

    function countValueShiftKeywords(text, keywords) {
      const source = String(text || '').toLowerCase();
      return keywords.reduce((sum, keyword) => {
        const target = String(keyword || '').toLowerCase();
        if (!target) return sum;
        if (/^[a-z0-9][a-z0-9_+-]*$/.test(target)) {
          const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const matches = source.match(new RegExp(`(?<![a-z0-9])${escaped}(?![a-z0-9])`, 'g'));
          return sum + (matches ? matches.length : 0);
        }
        return sum + source.split(target).length - 1;
      }, 0);
    }

    function buildValueShiftTopicsFromGraph(maxTopics = 3) {
      const nodes = (GRAPH_DATA && GRAPH_DATA.nodes) ? GRAPH_DATA.nodes : [];
      const entries = nodes
        .filter(node => node.type === '日記' || node.type === 'diary')
        .map(node => {
          const date = parseValueShiftDate(node);
          const text = valueShiftEntryText(node);
          return date && text.trim() ? {
            date,
            dateStr: formatValueShiftDate(date),
            text
          } : null;
        })
        .filter(Boolean)
        .sort((a, b) => a.date - b.date);

      if (entries.length < 6) return [];

      const referenceDate = entries[entries.length - 1].date;
      const recentDays = 14;
      const baselineDays = 60;
      const oneDayMs = 24 * 60 * 60 * 1000;
      const recentStart = new Date(referenceDate.getTime() - (recentDays - 1) * oneDayMs);
      const baselineStart = new Date(recentStart.getTime() - baselineDays * oneDayMs);

      let recentEntries = entries.filter(entry => entry.date >= recentStart);
      let baselineEntries = entries.filter(entry => entry.date >= baselineStart && entry.date < recentStart);
      let recentLabel = `直近${recentDays}日`;
      let baselineLabel = `比較${baselineDays}日`;

      if (recentEntries.length < 2 || baselineEntries.length < 3) {
        recentEntries = entries.slice(-5);
        baselineEntries = entries.slice(-25, -5);
        if (recentEntries.length < 2 || baselineEntries.length < 3) return [];
        recentLabel = `直近${recentEntries.length}件`;
        baselineLabel = `比較${baselineEntries.length}件`;
      }

      const topics = VALUE_SHIFT_DEFS.map(definition => {
        const recentScores = recentEntries.map(entry => countValueShiftKeywords(entry.text, definition.keywords));
        const baselineScores = baselineEntries.map(entry => countValueShiftKeywords(entry.text, definition.keywords));
        const recentScore = recentScores.reduce((sum, score) => sum + score, 0);
        const baselineScore = baselineScores.reduce((sum, score) => sum + score, 0);
        const recentRate = recentScore / Math.max(1, recentEntries.length);
        const baselineRate = baselineScore / Math.max(1, baselineEntries.length);
        const delta = recentRate - baselineRate;
        const magnitude = Math.abs(delta);

        let direction = '';
        let deltaLabel = '';
        let evidenceSummary = '';
        let activeScore = 0;

        if (delta >= 0.45 && recentScore >= 2) {
          direction = 'up';
          deltaLabel = '以前より前に出ている';
          evidenceSummary = `${recentLabel}では「${definition.label}」に関する手がかりが、比較期間より目立っています。ひとつの傾向として読むのがよさそうです。`;
          activeScore = recentScore;
        } else if (delta <= -0.45 && baselineScore >= 2) {
          direction = 'down';
          deltaLabel = '以前より少し落ち着いている';
          evidenceSummary = `${recentLabel}では「${definition.label}」に関する手がかりが、比較期間より少なめです。関心が消えたというより、いまは他テーマが前に出ている可能性があります。`;
          activeScore = baselineScore;
        } else {
          return null;
        }

        const confidence = magnitude >= 1.2 && activeScore >= 4 ? '高' : magnitude >= 0.7 && activeScore >= 3 ? '中' : '';
        if (!confidence) return null;

        const recentExamples = [];
        recentEntries.forEach((entry, index) => {
          if (recentExamples.length >= 2 || recentScores[index] <= 0) return;
          recentExamples.push({
            date: entry.dateStr,
            summary: `この日の記述で「${definition.label}」に関する手がかりがありました。`
          });
        });
        if (!recentExamples.length && direction === 'down') {
          recentExamples.push({
            date: `${recentEntries[0].dateStr}〜${recentEntries[recentEntries.length - 1].dateStr}`,
            summary: `直近期間では「${definition.label}」に関する具体的な手がかりは控えめでした。`
          });
        }

        return {
          category: definition.label,
          direction,
          delta_label: deltaLabel,
          evidence_summary: evidenceSummary,
          recent_examples: recentExamples,
          confidence,
          comparison_window: {
            recent_days: recentDays,
            baseline_days: baselineDays,
            recent_label: recentLabel,
            baseline_label: baselineLabel
          },
          metrics: {
            delta
          }
        };
      }).filter(Boolean);

      return topics
        .sort((a, b) => Math.abs(b.metrics.delta) - Math.abs(a.metrics.delta))
        .slice(0, maxTopics);
    }

    // ── 停滞目標チェックイン ──
    function getStalledGoals(thresholdDays = 2) {
      const now = new Date();
      const nodes = (GRAPH_DATA && GRAPH_DATA.nodes) ? GRAPH_DATA.nodes : [];
      return nodes
        .filter(n => {
          if (n.type !== '目標') return false;
          if (n.status === '達成') return false;
          const lastSeen = new Date(n.last_seen || n.first_seen);
          if (isNaN(lastSeen)) return false;
          const dayDiff = (now - lastSeen) / (1000 * 60 * 60 * 24);
          return dayDiff >= thresholdDays;
        })
        .sort((a, b) => new Date(a.last_seen) - new Date(b.last_seen));
    }

    const DISPLAY_TEXT_REPLACEMENTS = [
      [new RegExp('know' + 'be', 'gi'), '仕事'],
      [new RegExp('sai' + 'teki', 'gi'), '副業'],
      [new RegExp('ナレッジ' + 'グラフ', 'g'), '日記ログ'],
      [new RegExp('家' + '計', 'g'), '暮らし'],
      [new RegExp('重力' + 'マップ', 'g'), '整理マップ'],
      [new RegExp('重力' + '軽減', 'g'), '軽くする'],
      [new RegExp('異' + '世界', 'g'), '物語']
    ];

    function toDisplayText(value) {
      return DISPLAY_TEXT_REPLACEMENTS.reduce(
        (text, [pattern, replacement]) => text.replace(pattern, replacement),
        String(value || '')
      );
    }

    function sanitizeText(value) {
      return toDisplayText(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function shortenText(value, maxLength = 90) {
      const text = toDisplayText(value).trim();
      return text.length > maxLength ? `${text.slice(0, maxLength)}...` : text;
    }

    function truncateText(value, max = 90) {
      const text = toDisplayText(value).replace(/\s+/g, ' ').trim();
      if (text.length <= max) return text;
      return `${text.slice(0, max - 1)}...`;
    }

    function collectText(value, depth = 0) {
      if (value == null || depth > 5) return '';
      if (typeof value === 'string' || typeof value === 'number') return String(value);
      if (Array.isArray(value)) return value.map(item => collectText(item, depth + 1)).join('。');
      if (typeof value === 'object') return Object.values(value).map(item => collectText(item, depth + 1)).join('。');
      return '';
    }

    function getRecentGraphText() {
      const nodes = (GRAPH_DATA && GRAPH_DATA.nodes) ? GRAPH_DATA.nodes : [];
      return nodes
        .slice()
        .sort((a, b) => String(b.last_seen || b.date || '').localeCompare(String(a.last_seen || a.date || '')))
        .slice(0, 80)
        .map(n => [n.label, n.detail, n.current_state, n.status, n.type].filter(Boolean).join(' '))
        .join('。');
    }

    function countKeywordMatches(text, keywords) {
      const source = String(text || '').toLowerCase();
      return keywords.reduce((sum, keyword) => {
        const target = String(keyword || '').toLowerCase();
        if (!target) return sum;
        const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const boundary = /^[a-z0-9]+$/.test(target) ? `\\b${escaped}\\b` : escaped;
        const matches = source.match(new RegExp(boundary, 'g'));
        return sum + (matches ? matches.length : 0);
      }, 0);
    }

    function findCue(text, keywords, fallback) {
      const sentences = String(text || '')
        .split(/[。\n]/)
        .map(s => s.trim())
        .filter(Boolean);
      const cue = sentences.find(sentence => keywords.some(keyword => sentence.includes(keyword)));
      return truncateText(cue || fallback, 86);
    }

    function getCuratedGravity(items, limit = 3) {
      return (items || [])
        .filter(item => {
          const constraints = item && (item.constraints || item.challenges || []);
          return item && (item.task || item.net_assessment || constraints.length || (item.energy_sources || []).length);
        })
        .sort((a, b) => {
          const severityScore = item => (item.constraints || item.challenges || []).reduce((sum, c) => {
            if (c.severity === '高') return sum + 3;
            if (c.severity === '中') return sum + 2;
            return sum + 1;
          }, 0);
          return severityScore(b) - severityScore(a);
        })
        .slice(0, limit);
    }

    function buildReflectionModel(data) {
      const analysisText = collectText(data);
      const graphText = getRecentGraphText();
      const allText = `${analysisText}。${graphText}`;
      const gravityItems = getCuratedGravity(data.gravity_map || [], 3);
      const focus = gravityItems[0] || {};
      const constraints = focus.constraints || focus.challenges || [];
      const energies = focus.energy_sources || [];
      const action = (data.antigravity_actions || []).find(item => item && item.action) || {};
      const emotions = (data.emotion_flow || [])
        .filter(item => item && item.emotion)
        .sort((a, b) => Math.abs(Number(b.sentiment || 0)) - Math.abs(Number(a.sentiment || 0)))
        .slice(0, 3);

      const valueDefs = [
        { label: '家族・つながり', icon: '🏠', keywords: ['家族', '妻', '父親', '一緒', '相談', '共有', 'チーム', 'メンバー', '感謝'], fallback: '誰かと一緒に進めるほど軽くなるテーマが見えます。' },
        { label: '創作・表現', icon: '✍️', keywords: ['ブログ', 'ポメラ', 'YouTube', '発信', '執筆', '小説', '描く', '描いた', '動画', '書籍', '記事', '表現', '原稿'], fallback: '書く・作る・外に出すことが、前進感につながっています。' },
        { label: '探究・成長', icon: '📚', keywords: ['読書', '学び', '学ぶ', '学習', 'AI', '研究', '知見', 'NotebookLM', '試す', '試した', '試行', '改善', '技術', '分析', '実験'], fallback: '知的な型を得ることで、仕事や創作の不安が軽くなっています。' },
        { label: '自由・選択', icon: '🪽', keywords: ['自由', '選択', '収益', '独立', '転職', '社員化', 'ストックオプション', '主体', '裁量', '自分で選', '自分のため'], fallback: '自分で選べている感覚を取り戻すことが大事そうです。' },
        { label: '安心・整える', icon: '🛟', keywords: ['安心', '不安', '貯金', '支出', '確定申告', '体重', '健康', '整理', '条件', '手取り'], fallback: '数字や条件を見える形にすると、心の負荷が下がりそうです。' }
      ];

      const values = valueDefs
        .map(def => {
          const score = countKeywordMatches(allText, def.keywords);
          return {
            ...def,
            score,
            cue: findCue(analysisText || graphText, def.keywords, def.fallback)
          };
        })
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

      const needDefs = [
        { label: '自律性', desc: '自分で選べている感覚', keywords: ['選択', '自由', '能動', '主体', '裁量', 'やりたい', '提案', '自分のため'] },
        { label: '有能感', desc: 'できている・上達している感覚', keywords: ['できた', '成功', '達成', '増加', '自信', '学び', '作成', '改善', '活用', '突破口'] },
        { label: '関係性', desc: '誰かとつながれている感覚', keywords: ['妻', '家族', '子', '共有', '相談', '社内', 'チーム', '一緒', 'メンバー'] }
      ];

      const needs = needDefs.map(def => {
        const score = countKeywordMatches(allText, def.keywords);
        const percent = Math.max(18, Math.min(100, 26 + score * 12));
        return {
          ...def,
          score,
          percent,
          status: score >= 5 ? '強い手がかり' : score >= 2 ? '手がかりあり' : '観察中'
        };
      });

      const topValueText = values.slice(0, 2).map(v => v.label).join(' / ') || 'まだ観察中';
      const focusName = focus.task || action.target_task || '今日気になっているテーマ';
      const obstacle = (constraints[0] && constraints[0].name) || 'まだ言語化途中の重さ';
      const energy = (energies[0] && energies[0].name) || (values[0] && values[0].label) || '小さな前進';
      const question = `「${truncateText(focusName, 34)}」は、${topValueText}を守る一歩か、それとも義務感で抱えている重さか？`;
      const outcome = `${truncateText(energy, 44)}を使って、前に進む感覚を取り戻す。`;
      const plan = action.action
        ? `もし「${truncateText(obstacle, 30)}」で止まったら、${truncateText(action.action, 72)}`
        : 'もし止まったら、10分だけ状況を書き出して次の一歩に分ける。';

      return {
        values,
        needs,
        emotions,
        focusName,
        obstacle,
        energy,
        question,
        woop: [
          { label: 'WISH', title: '願い', text: focusName },
          { label: 'OUTCOME', title: '望む結果', text: outcome },
          { label: 'OBSTACLE', title: '内側の障害', text: obstacle },
          { label: 'PLAN', title: 'もし〜なら', text: plan }
        ],
        lead: `いま前に出ている価値は「${topValueText}」。一方で「${truncateText(obstacle, 42)}」が心の重さとして出ています。`
      };
    }

    function renderMindMirror(data) {
      const model = buildReflectionModel(data);
      const mindEl = document.getElementById('mind-state-body');
      const valuesEl = document.getElementById('values-compass-list');
      const woopEl = document.getElementById('woop-list');
      const valuesCountEl = document.getElementById('values-count');
      if (!mindEl || !valuesEl || !woopEl) return;

      if (valuesCountEl) valuesCountEl.textContent = `${model.values.length}件`;

      const emotionHtml = model.emotions.length ? `
        <div class="mind-emotions">
          ${model.emotions.map(item => {
            const sentiment = Number(item.sentiment || 0);
            const cls = sentiment > 0.2 ? 'positive' : sentiment < -0.2 ? 'negative' : '';
            const sign = sentiment > 0 ? '+' : '';
            return `<span class="emotion-chip ${cls}">${sanitizeText(item.emotion)} ${sign}${sentiment.toFixed(1)}</span>`;
          }).join('')}
        </div>` : '';

      mindEl.innerHTML = `
        <div class="mind-overview">
          <div>
            <div class="mind-lead">${sanitizeText(model.lead)}</div>
            <div class="mind-focus-grid">
              <div class="mind-focus-tile">
                <div class="mind-focus-label">中心テーマ</div>
                <div class="mind-focus-text">${sanitizeText(truncateText(model.focusName, 62))}</div>
              </div>
              <div class="mind-focus-tile">
                <div class="mind-focus-label">いちばん重いもの</div>
                <div class="mind-focus-text">${sanitizeText(truncateText(model.obstacle, 62))}</div>
              </div>
              <div class="mind-focus-tile">
                <div class="mind-focus-label">使える追い風</div>
                <div class="mind-focus-text">${sanitizeText(truncateText(model.energy, 62))}</div>
              </div>
            </div>
            <div class="mind-question">${sanitizeText(model.question)}</div>
          </div>
          <div class="need-panel">
            ${model.needs.map(need => `
              <div class="need-row">
                <div class="need-head">
                  <span>${sanitizeText(need.label)}</span>
                  <span class="need-status">${sanitizeText(need.status)}</span>
                </div>
                <div class="need-track"><div class="need-fill" style="width:${need.percent}%"></div></div>
                <div class="need-desc">${sanitizeText(need.desc)}</div>
              </div>`).join('')}
            ${emotionHtml}
          </div>
        </div>`;

      valuesEl.innerHTML = model.values.map(value => {
        const width = Math.max(16, Math.min(100, value.score * 14));
        return `
          <div class="value-row">
            <div>
              <div class="value-label">${value.icon} ${sanitizeText(value.label)}</div>
              <div class="value-cue">${sanitizeText(value.cue)}</div>
            </div>
            <div class="value-score">${value.score ? `${value.score}件` : '観察中'}</div>
            <div class="value-bar"><div class="value-bar-fill" style="width:${width}%"></div></div>
          </div>`;
      }).join('');

      woopEl.innerHTML = `
        <div class="woop-grid">
          ${model.woop.map(step => `
            <div class="woop-step">
              <div class="woop-label">${sanitizeText(step.label)} / ${sanitizeText(step.title)}</div>
              <div class="woop-text">${sanitizeText(truncateText(step.text, 118))}</div>
            </div>`).join('')}
        </div>`;
    }

    function renderValueShiftTopics(items) {
      const card = document.getElementById('value-shift-card');
      const list = document.getElementById('value-shift-list');
      const count = document.getElementById('value-shift-count');
      if (!card || !list) return;

      const topics = (items || [])
        .filter(item => item && item.category && item.evidence_summary)
        .slice(0, 3);

      if (!topics.length) {
        card.style.display = 'none';
        list.innerHTML = '';
        if (count) count.textContent = '';
        return;
      }

      card.style.display = '';
      if (count) count.textContent = `${topics.length}件`;

      list.innerHTML = topics.map(item => {
        const direction = item.direction || 'steady';
        const directionClass = direction === 'down' ? 'down' : '';
        const label = item.delta_label || (direction === 'down' ? '少し落ち着いている' : '以前より前に出ている');
        const examples = (item.recent_examples || [])
          .filter(example => example && (example.date || example.summary))
          .slice(0, 2);
        const windowInfo = item.comparison_window || {};
        const confidence = item.confidence ? `根拠: ${item.confidence}` : '根拠: 観察中';
        const period = windowInfo.recent_label && windowInfo.baseline_label
          ? `${windowInfo.recent_label} / ${windowInfo.baseline_label}`
          : windowInfo.recent_days && windowInfo.baseline_days
          ? `直近${windowInfo.recent_days}日 / 比較${windowInfo.baseline_days}日`
          : '';

        return `
          <div class="value-shift-item ${directionClass}">
            <div class="value-shift-top">
              <span class="value-shift-badge">${sanitizeText(label)}</span>
              <span class="value-shift-title">${sanitizeText(item.category)}</span>
            </div>
            <div class="value-shift-summary">${sanitizeText(item.evidence_summary)}</div>
            ${examples.map(example => `
              <div class="value-shift-example">
                ${example.date ? `<strong>${sanitizeText(example.date)}</strong> ` : ''}
                ${sanitizeText(shortenText(example.summary || '', 100))}
              </div>
            `).join('')}
            <div class="value-shift-meta">
              <span>${sanitizeText(confidence)}</span>
              ${period ? `<span>${sanitizeText(period)}</span>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function renderInsights(items) {
      const el = document.getElementById('insights-list');

      if (!items.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💡</div><div class="empty-state-text">知見なし</div></div>';
        return;
      }

      el.innerHTML = items.map(item => `
        <div class="insight-item">
          <div class="insight-finding">🔍 ${sanitizeText(item.finding)}</div>
          ${item.implication ? `<div class="insight-implication">${sanitizeText(item.implication)}</div>` : ''}
        </div>`
      ).join('');
    }

    function renderEmotions(items) {
      const el = document.getElementById('emotion-list');

      if (!items.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💭</div><div class="empty-state-text">感情データなし</div></div>';
        return;
      }

      el.innerHTML = items.map(item => {
        const s = item.sentiment || 0;
        const dotClass = s > 0.2 ? 'positive' : s < -0.2 ? 'negative' : 'neutral';
        const scoreColor = s > 0 ? 'var(--energy-green)' : s < 0 ? 'var(--gravity-red)' : 'var(--accent-warning)';

        return `
          <div class="emotion-item">
            <div class="emotion-dot ${dotClass}"></div>
            <div class="emotion-info">
              <div class="emotion-name">${sanitizeText(item.emotion)}</div>
              ${item.context ? `<div class="emotion-context">${sanitizeText(item.context)}</div>` : ''}
            </div>
            <div class="emotion-score" style="color: ${scoreColor}">${s > 0 ? '+' : ''}${s.toFixed(1)}</div>
          </div>`;
      }).join('');
    }

    // ── 確定予定 ──
    function renderSchedule(items) {
      const el = document.getElementById('schedule-strip');
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const futureItems = items.filter(item => {
        const d = new Date(item.date);
        return d >= today;
      }).sort((a, b) => a.date.localeCompare(b.date));

      if (!futureItems.length) {
        el.innerHTML = '<div class="schedule-none">確定予定なし — のんびりモードです ☕</div>';
        return;
      }

      const catMap = { '本業': 'work', '副業': 'side', '家族': 'family', '個人': 'personal' };

      el.innerHTML = futureItems.map(item => {
        const d = new Date(item.date);
        const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
        const timeStr = item.time && item.time !== 'null' ? ` ${item.time}` : '';
        const catClass = `chip-cat-${catMap[item.category] || 'personal'}`;

        return `
          <div class="schedule-chip">
            <div class="chip-cat ${catClass}"></div>
            <span class="chip-date">${dateStr}${timeStr}</span>
            <span class="chip-title">${sanitizeText(item.title)}</span>
          </div>`;
      }).join('');
    }

    // ブログタブ切り替え
    function switchBlogTab(tab) {
      const ideasList = document.getElementById('blog-ideas-list');
      const seedsList = document.getElementById('blog-seeds-list');
      const tabIdeas = document.getElementById('tab-blog-ideas');
      const tabSeeds = document.getElementById('tab-blog-seeds');
      if (tab === 'ideas') {
        ideasList.style.display = 'block';
        seedsList.style.display = 'none';
        tabIdeas.style.background = 'rgba(251,191,36,0.15)';
        tabIdeas.style.color = '#fbbf24';
        tabIdeas.style.borderColor = 'rgba(251,191,36,0.4)';
        tabSeeds.style.background = 'transparent';
        tabSeeds.style.color = 'var(--muted)';
        tabSeeds.style.borderColor = 'rgba(255,255,255,0.1)';
      } else {
        ideasList.style.display = 'none';
        seedsList.style.display = 'block';
        tabIdeas.style.background = 'transparent';
        tabIdeas.style.color = 'var(--muted)';
        tabIdeas.style.borderColor = 'rgba(255,255,255,0.1)';
        tabSeeds.style.background = 'rgba(251,191,36,0.15)';
        tabSeeds.style.color = '#fbbf24';
        tabSeeds.style.borderColor = 'rgba(251,191,36,0.4)';
      }
    }

    // ブログネタ（ブログアイディア::タグ由来）
    function renderBlogIdeas(items) {
      const el = document.getElementById('blog-ideas-list');
      const countEl = document.getElementById('blog-count');

      // blog_count はネタ数で更新
      countEl.textContent = items.length ? `${items.length}件` : '';

      if (!items.length) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div class="empty-state-text">日記を送信するとブログネタが自動提案されます</div>
          </div>`;
        return;
      }

      const readinessMap = {
        '高': { label: '🔥 すぐ書ける', cls: 'readiness-high' },
        '中': { label: '📝 素材あり', cls: 'readiness-med' },
        '低': { label: '💡 アイディア段階', cls: 'readiness-low' }
      };

      el.innerHTML = items.map(item => {
        const r = readinessMap[item.readiness] || readinessMap['低'];
        const themeHtml = item.theme ? `
          <div style="font-size: 12px; color: var(--muted); margin-bottom: 6px;">
            🏷 ${sanitizeText(item.theme)}
          </div>` : '';
        const hookHtml = item.hook ? `
          <div style="font-size: 13px; color: var(--text-secondary); font-style: italic; border-left: 2px solid rgba(251,191,36,0.4); padding-left: 10px; margin-bottom: 8px; line-height: 1.6;">
            "${sanitizeText(item.hook)}"
          </div>` : '';
        return `
          <div class="blog-seed-item" style="border-left: 3px solid rgba(251,191,36,0.5);">
            <div class="blog-seed-header">
              <div class="blog-seed-title">${sanitizeText(item.title)}</div>
            </div>
            ${themeHtml}
            ${hookHtml}
            <div class="blog-seed-footer">
              <span class="blog-seed-readiness ${r.cls}">${r.label}</span>
              <span class="blog-seed-action">→ 件名「BLOG」で送信して執筆しよう</span>
            </div>
          </div>`;
      }).join('');
    }

    // ── ブログ素材提案 ──
    function renderBlogSeeds(items) {
      const el = document.getElementById('blog-seeds-list');
      document.getElementById('blog-count').textContent = items.length ? `${items.length}件` : '';

      if (!items.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✍️</div><div class="empty-state-text">ブログ素材なし</div></div>';
        return;
      }

      const readinessMap = {
        '高': { label: '🔥 すぐ書ける', cls: 'readiness-high', action: 'ポメラから件名「BLOG」で送信しよう' },
        '中': { label: '📝 素材あり', cls: 'readiness-med', action: 'もう少しエピソードを膨らませよう' },
        '低': { label: '💡 着想段階', cls: 'readiness-low', action: '日々の気づきを貯めていこう' }
      };

      el.innerHTML = items.map(item => {
        const r = readinessMap[item.readiness] || readinessMap['低'];

        // 新形式か旧形式かで分岐
        const isNewFormat = item.story_seed || item.core_message || item.reader_feeling;

        if (isNewFormat) {
          // ジャンル・トーンの表示
          const tagsHtml = `
            <div class="blog-seed-sources">
              ${item.genre ? `<span class="blog-seed-source-tag">${sanitizeText(item.genre)}</span>` : ''}
              ${item.tone ? `<span class="blog-seed-source-tag">${sanitizeText(item.tone)}</span>` : ''}
            </div>`;

          // 物語の種
          const storySeedHtml = item.story_seed ? `
            <div class="blog-seed-outline">
              <div class="blog-seed-outline-step">
                <span class="blog-seed-step-num">📖</span>
                <span>${sanitizeText(item.story_seed)}</span>
              </div>
            </div>` : '';

          // 伝えたいこと
          const messageHtml = item.core_message ? `
            <div class="blog-seed-outline">
              <div class="blog-seed-outline-step">
                <span class="blog-seed-step-num">💬</span>
                <span>${sanitizeText(item.core_message)}</span>
              </div>
            </div>` : '';

          // 読後感
          const feelingHtml = item.reader_feeling ? `
            <div class="blog-seed-outline">
              <div class="blog-seed-outline-step">
                <span class="blog-seed-step-num">🌙</span>
                <span>読後感: ${sanitizeText(item.reader_feeling)}</span>
              </div>
            </div>` : '';

          return `
            <div class="blog-seed-item">
              <div class="blog-seed-header">
                <div class="blog-seed-title">${sanitizeText(item.title)}</div>
              </div>
              ${tagsHtml}
              ${storySeedHtml}
              ${messageHtml}
              ${feelingHtml}
              <div class="blog-seed-footer">
                <span class="blog-seed-readiness ${r.cls}">${r.label}</span>
                <span class="blog-seed-action">→ ${r.action}</span>
              </div>
            </div>`;
        } else {
          // 旧形式との互換性
          const sources = item.source_insights || [];
          const sourcesHtml = sources.length ? `
            <div class="blog-seed-sources">
              <div class="blog-seed-sources-label">📌 きっかけ</div>
              ${sources.map(s => `<span class="blog-seed-source-tag">${sanitizeText(s)}</span>`).join('')}
            </div>` : '';

          let outlineHtml = '';
          if (item.outline) {
            const steps = typeof item.outline === 'string' ? item.outline.split('\n') : item.outline;
            outlineHtml = `
              <div class="blog-seed-outline">
                ${steps.map((step, i) => {
              const cleanStep = step.replace(/^\d+\.\s*/, '');
              return `<div class="blog-seed-outline-step">
                    <span class="blog-seed-step-num">${i + 1}.</span>
                    <span>${sanitizeText(cleanStep)}</span>
                  </div>`;
            }).join('')}
              </div>`;
          }

          return `
            <div class="blog-seed-item">
              <div class="blog-seed-header">
                <div class="blog-seed-title">${sanitizeText(item.title)}</div>
                ${item.theme ? `<span class="blog-seed-theme">${sanitizeText(item.theme)}</span>` : ''}
              </div>
              ${sourcesHtml}
              ${outlineHtml}
              <div class="blog-seed-footer">
                <span class="blog-seed-readiness ${r.cls}">${r.label}</span>
                <span class="blog-seed-action">→ ${r.action}</span>
              </div>
            </div>`;
        }
      }).join('');
    }

    // ── 初期化 ──
    renderDashboard();
  </script>
</body>

</html>
