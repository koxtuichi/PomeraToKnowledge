<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>異世界の自分 | POMERA WORLD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1208;
      overflow: hidden;
      height: 100vh;
      font-family: 'Noto Serif JP', 'Yu Mincho', serif;
    }

    /* ===== HUD ===== */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 38px;
      background: linear-gradient(180deg, #1c1005 0%, #231508 100%);
      border-bottom: 2px solid #7a5020;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(200, 140, 40, 0.15);
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      z-index: 10;
    }

    .hback {
      font-size: 10px;
      color: #c8a050;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      text-decoration: none;
      letter-spacing: 1px;
      border-right: 1px solid #5a3a10;
      background: rgba(80, 40, 5, 0.3);
      transition: background 0.2s;
    }

    .hback:hover {
      background: rgba(120, 70, 15, 0.5);
    }

    .htitle {
      font-size: 13px;
      color: #e8c060;
      letter-spacing: 5px;
      flex: 1;
      text-align: center;
      text-shadow: 0 0 12px rgba(230, 180, 60, 0.5);
      font-weight: 700;
    }

    .hr {
      display: flex;
      align-items: center;
      gap: 0;
      border-left: 1px solid #5a3a10;
      height: 100%;
    }

    .hstat {
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 100%;
      border-right: 1px solid #5a3a10;
      gap: 5px;
    }

    .hwx {
      font-size: 14px;
    }

    .hmood {
      font-size: 10px;
      color: #d4a040;
      letter-spacing: 1px;
    }

    .hclock {
      font-size: 11px;
      color: #b89040;
      letter-spacing: 2px;
      padding: 0 12px;
      font-family: 'Courier New', monospace;
    }

    /* ===== 左ナビ（アイコン+ラベルのみ） ===== */
    #left-nav {
      position: fixed;
      top: 38px;
      left: 0;
      width: 100px;
      bottom: 0;
      background: linear-gradient(180deg, #140c04 0%, #1a1008 100%);
      border-right: 2px solid #7a5020;
      box-shadow: 3px 0 12px rgba(0, 0, 0, 0.6);
      padding: 8px 0;
      overflow-y: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-tab {
      width: 100%;
      padding: 14px 8px;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      color: #806040;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .nav-tab:hover {
      background: rgba(80, 45, 10, 0.4);
      color: #d0a050;
    }

    .nav-tab.active {
      background: rgba(80, 45, 10, 0.6);
      border-left-color: #c08040;
      color: #f0c060;
    }

    .nav-icon {
      font-size: 22px;
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    /* ===== 中央コンテンツエリア ===== */
    #center-content {
      position: fixed;
      top: 38px;
      left: 100px;
      right: 380px;
      bottom: 0;
      overflow-y: auto;
      background: linear-gradient(180deg, #120a04 0%, #1a1008 100%);
      z-index: 5;
    }

    .center-panel {
      padding: 20px 24px;
      min-height: 100%;
    }

    .cp-header {
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(120, 70, 20, 0.35);
    }

    .cp-title {
      font-size: 16px;
      color: #e8c060;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .cp-sub {
      font-size: 11px;
      color: #806040;
    }

    /* 旅人グリッド（2カラム） */
    .traveler-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    /* クエストグリッド */
    .quest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* パーティーグリッド（4スロット横並び） */
    .party-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    /* インベントリグリッド（3カラム） */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }



    .psec {
      margin-bottom: 0;
      border-bottom: 1px solid rgba(120, 80, 20, 0.3);
    }

    .ph {
      font-size: 11px;
      color: #c89040;
      letter-spacing: 2px;
      padding: 10px 14px 8px;
      background: linear-gradient(90deg, rgba(80, 45, 5, 0.6) 0%, transparent 100%);
      border-bottom: 1px solid rgba(120, 80, 20, 0.2);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ph::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #c89040;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .pt {
      font-size: 9px;
      color: #b09060;
      line-height: 1.7;
      padding: 8px 12px;
    }

    .pact {
      font-size: 10px;
      color: #90c860;
      padding: 8px 12px;
      line-height: 1.6;
      background: rgba(30, 60, 10, 0.15);
      border-left: 2px solid rgba(100, 180, 40, 0.3);
      margin: 0;
    }

    /* 感情アイコン表示 */
    #pem {
      padding: 8px 12px 10px;
    }

    /* ===== ゲームコンテナ ===== */
    #game-container {
      position: fixed;
      top: 38px;
      left: 100px;
      right: 0;
      bottom: 64px;
      background: #0c0808;
      /* Elin風マップ外周フォグ */
      box-shadow: inset 0 0 120px 80px #0e0904, inset 0 0 60px 30px rgba(14, 9, 4, 0.7);
    }

    /* ===== ローディング ===== */
    #loading {
      position: fixed;
      inset: 0;
      background: #0e0904;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 999;
      transition: opacity 1.0s;
    }

    #loading.out {
      opacity: 0;
      pointer-events: none;
    }

    .lt {
      font-size: 24px;
      color: #e8c060;
      letter-spacing: 6px;
      text-shadow: 0 0 24px rgba(230, 180, 60, 0.6), 0 0 60px rgba(180, 100, 20, 0.3);
      font-weight: 700;
    }

    .ls {
      font-size: 10px;
      color: #907040;
      letter-spacing: 3px;
    }

    .lbw {
      width: 220px;
      height: 8px;
      background: #0a0604;
      border: 1px solid #7a5020;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(120, 80, 20, 0.4);
    }

    .lb {
      height: 100%;
      background: linear-gradient(90deg, #5a2c08, #c87020, #f0b040);
      width: 0;
      transition: width 0.4s;
    }

    /* ===== ログウィンドウ (Elin風の下部テキストログ) ===== */
    #log-window {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 210px;
      height: 72px;
      background: linear-gradient(180deg, rgba(14, 9, 4, 0.0) 0%, rgba(14, 9, 4, 0.85) 30%, rgba(14, 9, 4, 0.95) 100%);
      border-top: 1px solid rgba(120, 80, 20, 0.3);
      padding: 8px 14px;
      z-index: 9;
      pointer-events: none;
    }

    #log-text {
      font-size: 9px;
      color: #b09060;
      line-height: 1.8;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 1);
    }

    /* ===== スクロールバー ===== */
    #panel::-webkit-scrollbar {
      width: 4px;
    }

    #panel::-webkit-scrollbar-track {
      background: #120a02;
    }

    #panel::-webkit-scrollbar-thumb {
      background: #7a5020;
      border-radius: 2px;
    }

    /* ===== NPCダイアログ ===== */
    #npc-dialog {
      display: none;
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      background: linear-gradient(180deg, #1e1208 0%, #160e04 100%);
      border: 2px solid #8a6030;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(200, 150, 50, 0.15);
      z-index: 100;
      overflow: hidden;
    }

    #npc-dialog::before {
      content: '';
      position: absolute;
      top: 0;
      left: 4px;
      right: 4px;
      height: 100%;
      background: repeating-linear-gradient(180deg,
          transparent 0px, transparent 20px,
          rgba(100, 60, 10, 0.05) 20px, rgba(100, 60, 10, 0.05) 21px);
      pointer-events: none;
    }

    #npc-dialog-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 8px;
      border-bottom: 1px solid rgba(120, 80, 20, 0.4);
      background: linear-gradient(90deg, rgba(80, 45, 5, 0.7) 0%, transparent 100%);
    }

    #npc-dialog-icon {
      font-size: 22px;
      line-height: 1;
    }

    #npc-dialog-name {
      font-size: 11px;
      color: #e8c060;
      letter-spacing: 3px;
      font-weight: 700;
      flex: 1;
    }

    #npc-dialog-role {
      font-size: 9px;
      color: #907040;
      letter-spacing: 2px;
    }

    #npc-dialog-body {
      padding: 14px 16px 16px;
      font-size: 11px;
      color: #c8a870;
      line-height: 2;
      letter-spacing: 0.5px;
      min-height: 60px;
    }

    #npc-dialog-close {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 14px;
      color: #7a5030;
      cursor: pointer;
      background: none;
      border: none;
      padding: 2px 6px;
      transition: color 0.2s;
    }

    #npc-dialog-close:hover {
      color: #e8c060;
    }

    .npc-label {
      position: absolute;
      font-size: 9px;
      color: #e8c060;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 1), 0 0 8px rgba(0, 0, 0, 1);
      pointer-events: none;
      text-align: center;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* ===== CPカウンター ===== */
    .hcp {
      font-size: 11px;
      color: #f0d060;
      letter-spacing: 1px;
      background: rgba(120, 80, 0, 0.35);
      border: 1px solid rgba(200, 160, 40, 0.4);
      border-radius: 4px;
      padding: 3px 8px;
      margin: 0 8px;
      min-width: 60px;
      text-align: center;
      transition: all 0.4s;
    }

    .hcp.gain {
      color: #ffe840;
      text-shadow: 0 0 8px #ffd020, 0 0 20px #ffa000;
    }

    /* ===== タブ ===== */
    .ptabs {
      display: flex;
      gap: 2px;
      padding: 6px 6px 0;
      border-bottom: 1px solid rgba(120, 80, 10, 0.3);
      margin-bottom: 6px;
    }

    .ptab {
      flex: 1;
      font-size: 9px;
      padding: 5px 2px;
      background: rgba(60, 35, 5, 0.4);
      border: 1px solid rgba(120, 80, 10, 0.3);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #907050;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ptab.active {
      background: rgba(100, 60, 10, 0.7);
      color: #e8c060;
      border-color: rgba(180, 130, 30, 0.5);
    }

    .ptab:hover:not(.active) {
      color: #c8a040;
    }

    /* ===== 旅人カード ===== */
    .traveler-card {
      background: rgba(60, 35, 5, 0.5);
      border: 1px solid rgba(120, 80, 10, 0.35);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      position: relative;
      transition: border-color 0.2s;
    }

    .traveler-card:hover {
      border-color: rgba(200, 150, 40, 0.6);
    }

    .traveler-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .traveler-icon {
      font-size: 26px;
    }

    .traveler-name {
      font-size: 14px;
      color: #e8c060;
      font-weight: 700;
      flex: 1;
    }

    .traveler-class {
      font-size: 11px;
      color: #a08050;
      letter-spacing: 1px;
    }

    .traveler-stats {
      display: flex;
      gap: 6px;
      font-size: 10px;
      color: #806040;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .tstat {
      background: rgba(50, 30, 5, 0.6);
      padding: 2px 5px;
      border-radius: 3px;
      color: #c8a060;
      font-size: 10px;
    }

    .traveler-story {
      font-size: 10px;
      color: #806048;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .recruit-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-size: 11px;
      padding: 6px 12px;
      background: rgba(120, 80, 10, 0.7);
      border: 1px solid rgba(200, 150, 30, 0.5);
      border-radius: 4px;
      color: #e8c060;
      cursor: pointer;
      transition: all 0.2s;
    }

    .recruit-btn:hover:not(:disabled):not(.recruited) {
      background: rgba(160, 110, 20, 0.9);
    }

    .recruit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .recruit-btn.recruited {
      background: rgba(30, 80, 30, 0.7);
      border-color: rgba(50, 160, 50, 0.5);
      color: #80d060;
      cursor: default;
    }

    /* ===== クエスト ===== */
    .quest-card {
      background: rgba(60, 35, 5, 0.5);
      border-left: 4px solid #c04020;
      border-radius: 0 6px 6px 0;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .quest-card.done {
      border-left-color: #206080;
      opacity: 0.6;
    }

    .quest-title {
      font-size: 13px;
      color: #d09050;
      margin-bottom: 4px;
    }

    .quest-meta {
      font-size: 11px;
      color: #806040;
    }

    .quest-reward {
      font-size: 11px;
      color: #c0a020;
      margin-top: 5px;
    }

    /* ===== パーティー ===== */
    .party-slot {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 12px 10px 10px;
      background: rgba(24, 14, 3, 0.7);
      border: 1px dashed rgba(100, 70, 20, 0.4);
      border-radius: 10px;
      min-height: 220px;
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .party-slot.filled {
      border-style: solid;
      border-color: rgba(180, 130, 40, 0.6);
      background: rgba(30, 18, 5, 0.8);
      box-shadow: 0 0 16px rgba(180, 120, 20, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.4);
    }

    .party-slot.filled:hover {
      border-color: rgba(220, 170, 60, 0.9);
      box-shadow: 0 0 24px rgba(200, 140, 30, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.3);
    }

    /* ドット絵表示エリア */
    .party-sprite-area {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 80px;
      position: relative;
      margin-bottom: 4px;
    }

    .party-sprite-area canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7));
    }

    /* キャラアイドル浮遊アニメーション */
    @keyframes charIdle {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes charIdleSlow {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes charGlow {

      0%,
      100% {
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 0px rgba(200, 150, 40, 0));
      }

      50% {
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 8px rgba(200, 150, 40, 0.4));
      }
    }

    .party-slot-icon {
      font-size: 36px;
      text-align: center;
      line-height: 1;
      margin-bottom: 4px;
    }

    .party-slot-name {
      font-size: 12px;
      color: #e8c060;
      font-weight: 700;
      text-align: center;
    }

    .party-slot-class {
      font-size: 9px;
      color: #a08050;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .party-remove {
      font-size: 10px;
      color: #804040;
      cursor: pointer;
      padding: 2px 4px;
      background: none;
      border: none;
      transition: color 0.2s;
    }

    .party-remove:hover {
      color: #e06040;
    }

    .dungeon-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 14px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, rgba(80, 20, 20, .9), rgba(120, 40, 10, .9));
      border: 1px solid rgba(200, 80, 40, .5);
      border-radius: 6px;
      color: #f0c060;
      cursor: pointer;
      transition: all 0.3s;
    }

    .dungeon-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(120, 30, 30, .9), rgba(160, 60, 20, .9));
      transform: translateY(-1px);
    }

    .dungeon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ===== 戦闘ログ ===== */

    #battle-log {
      position: fixed;
      right: 0;
      top: 38px;
      bottom: 0;
      width: 380px;
      background: rgba(6, 4, 2, 0.97);
      border-left: 2px solid rgba(120, 70, 10, 0.4);
      overflow: hidden;
      padding: 0;
      font-size: 12px;
      color: #c8a870;
      line-height: 1.9;
      display: flex;
      flex-direction: column;
      z-index: 200;
    }

    #battle-log-actions {
      flex-shrink: 0;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(100, 60, 10, 0.3);
    }

    #battle-log-actions .dungeon-btn {
      width: 100%;
      margin-top: 0;
      padding: 10px 0;
      font-size: 14px;
    }


    /* ===== 戦闘ビジュアル（HPバー） ===== */
    #battle-visual {
      flex-shrink: 0;
      padding: 12px 14px 8px;
      border-bottom: 1px solid rgba(100, 60, 10, 0.3);
      display: none;
    }

    #battle-visual.active {
      display: block;
    }

    .bv-monster-name {
      font-size: 11px;
      color: #e0a060;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bv-monster-hp-wrap {
      height: 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid rgba(200, 60, 20, 0.4);
    }

    .bv-monster-hp-bar {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #8b0000, #ff3030);
      transition: width 0.5s ease-out;
    }

    .bv-member-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .bv-member-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .bv-member-name {
      font-size: 9px;
      color: #a08060;
      width: 60px;
      flex-shrink: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .bv-hp-wrap {
      flex: 1;
      height: 8px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(40, 160, 40, 0.3);
    }

    .bv-hp-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #1a6030, #40c060);
      transition: width 0.5s ease-out;
    }

    .bv-hp-bar.danger {
      background: linear-gradient(90deg, #804010, #e06020);
    }

    .bv-hp-bar.dead {
      background: #333;
    }

    .bv-hp-num {
      font-size: 9px;
      color: #806040;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    /* EXPバー */
    .char-exp-bar-wrap {
      height: 4px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .char-exp-bar {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #4040c0, #8080ff);
      transition: width 0.6s ease-out;
    }

    .char-level-badge {
      display: inline-block;
      background: rgba(60, 40, 100, 0.7);
      border: 1px solid rgba(100, 80, 200, 0.5);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 9px;
      color: #a0a0ff;
      margin-right: 4px;
    }

    /* パーマデス */
    .traveler-card.dead-char {
      opacity: 0.35;
      pointer-events: none;
      border-color: rgba(80, 40, 40, 0.4) !important;
    }

    .traveler-card.dead-char::after {
      content: '💀 戦死';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: rgba(200, 60, 60, 0.8);
      letter-spacing: 4px;
      pointer-events: none;
    }

    /* D&D 装備 */
    .eq-drop-zone {
      border: 1px dashed rgba(100, 70, 20, 0.5);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 9px;
      color: #706040;
      cursor: default;
      transition: all 0.2s;
      min-width: 50px;
      text-align: center;
    }

    .eq-drop-zone.dragover {
      border-color: #f0c020;
      background: rgba(80, 60, 0, 0.3);
      color: #f0c020;
    }

    .eq-drop-zone.has-item {
      border-style: solid;
      border-color: rgba(160, 120, 40, 0.6);
      color: #c0a040;
      cursor: pointer;
    }

    .inv-drag-card {
      cursor: grab;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(40, 25, 5, 0.7);
      border: 1px solid rgba(120, 80, 20, 0.4);
      font-size: 10px;
      transition: all 0.15s;
      user-select: none;
    }

    .inv-drag-card:hover {
      border-color: rgba(200, 150, 40, 0.7);
    }

    .inv-drag-card.dragging {
      opacity: 0.4;
    }

    .party-inv-mini {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(100, 70, 20, 0.3);
    }

    .party-inv-mini-title {
      font-size: 11px;
      color: #c0a060;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .party-inv-mini-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* バトルログのタイトルバー */
    #battle-log-title {
      display: none;
    }

    #battle-log-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }




    .log-line {
      animation: logIn 0.3s ease;
    }

    .log-hit {
      color: #f09050;
    }

    .log-crit {
      color: #ff6020;
      font-weight: bold;
    }

    .log-heal {
      color: #60d060;
    }

    .log-system {
      color: #708090;
      font-style: italic;
    }

    .log-victory {
      color: #f0d020;
      font-weight: bold;
    }

    @keyframes logIn {
      from {
        opacity: 0;
        transform: translateX(-6px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ===== サブタブ ===== */
    .sub-tab {
      flex: 1;
      padding: 8px 6px;
      font-size: 11px;
      font-family: inherit;
      background: rgba(40, 25, 10, .7);
      border: 1px solid rgba(120, 70, 20, .4);
      border-radius: 5px;
      color: #a08050;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .sub-tab.active {
      background: rgba(80, 40, 10, .9);
      border-color: rgba(200, 120, 40, .7);
      color: #f0c060;
    }

    .sub-panel {
      display: block;
    }


    /* ===== インベントリカード ===== */
    .inv-card {
      background: rgba(30, 18, 8, .85);
      border: 1px solid rgba(120, 70, 20, .35);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 7px;
    }

    .inv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .inv-slot {
      font-size: 11px;
      color: #806040;
    }

    .inv-stat {
      font-size: 11px;
      color: #c0d090;
      margin-bottom: 5px;
    }

    .inv-actions {
      display: flex;
      gap: 4px;
    }

    .inv-btn {
      flex: 1;
      padding: 3px 6px;
      font-size: 9px;
      font-family: inherit;
      background: rgba(60, 30, 10, .9);
      border: 1px solid rgba(160, 100, 30, .5);
      border-radius: 4px;
      color: #f0c060;
      cursor: pointer;
      transition: all 0.2s;
    }

    .inv-btn:hover {
      background: rgba(100, 50, 10, .9);
    }

    .inv-discard {
      padding: 3px 6px;
      font-size: 9px;
      font-family: inherit;
      background: rgba(40, 10, 10, .7);
      border: 1px solid rgba(120, 40, 20, .4);
      border-radius: 4px;
      color: #a06040;
      cursor: pointer;
      transition: all 0.2s;
    }

    .inv-discard:hover {
      color: #e06040;
    }

    /* ===== 装備スロット（パーティー編成内） ===== */
    .eq-slots {
      margin-top: 5px;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .eq-slot-item {
      font-size: 8px;
      padding: 2px 5px;
      border-radius: 3px;
      cursor: pointer;
      background: rgba(30, 20, 8, .8);
      border: 1px solid rgba(100, 60, 15, .3);
      color: #906030;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .eq-slot-item.equipped {
      border-color: rgba(160, 100, 30, .6);
      color: #c0a050;
    }

    .eq-slot-item:hover {
      background: rgba(60, 35, 10, .9);
    }

    .eq-unequip-btn {
      font-size: 7px;
      padding: 1px 4px;
      background: rgba(60, 10, 10, .7);
      border: 1px solid rgba(120, 40, 20, .4);
      border-radius: 3px;
      color: #906040;
      cursor: pointer;
      vertical-align: middle;
      margin-left: 2px;
    }

    /* ===== 装備ターゲットリスト（モーダル内） ===== */
    .equip-target-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .equip-target-btn {
      width: 100%;
      padding: 8px 10px;
      font-size: 10px;
      font-family: inherit;
      text-align: left;
      background: rgba(40, 25, 8, .9);
      border: 1px solid rgba(140, 80, 20, .4);
      border-radius: 6px;
      color: #d0b060;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.5;
    }

    .equip-target-btn:hover {
      background: rgba(80, 45, 10, .9);
      border-color: rgba(200, 120, 40, .7);
    }

    /* ===== バトルオーバーレイ ===== */
    #battle-overlay {
      display: none;
      position: fixed;
      top: 38px;
      left: 100px;
      right: 380px;
      bottom: 0;
      background: rgba(6, 3, 1, 0.97);
      z-index: 500;
      flex-direction: column;
      overflow-y: auto;
    }

    #battle-overlay.active {
      display: flex;
    }

    .bo-header {
      flex-shrink: 0;
      padding: 14px 20px 10px;
      border-bottom: 1px solid rgba(140, 80, 10, 0.35);
      background: linear-gradient(90deg, rgba(60, 30, 5, 0.7) 0%, transparent 100%);
    }

    .bo-floor {
      font-size: 10px;
      color: #907040;
      letter-spacing: 3px;
      margin-bottom: 4px;
    }

    .bo-monster-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bo-monster-icon {
      font-size: 32px;
    }

    .bo-monster-info {
      flex: 1;
    }

    .bo-monster-name {
      font-size: 16px;
      color: #e8c060;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hp-bar-wrap {
      height: 10px;
      background: rgba(20, 10, 2, 0.8);
      border: 1px solid rgba(120, 60, 10, 0.4);
      border-radius: 5px;
      overflow: hidden;
    }

    .hp-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    .hp-bar-fill.enemy {
      background: linear-gradient(90deg, #802020, #c04040);
    }

    .hp-bar-fill.party {
      background: linear-gradient(90deg, #208040, #40c060);
    }

    .hp-bar-fill.party.low {
      background: linear-gradient(90deg, #804020, #c06030);
    }

    .hp-bar-fill.party.critical {
      background: linear-gradient(90deg, #802020, #c03030);
    }

    .hp-num {
      font-size: 10px;
      color: #a08050;
      margin-top: 2px;
      text-align: right;
    }

    .bo-party-area {
      flex-shrink: 0;
      padding: 12px 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      border-bottom: 1px solid rgba(100, 60, 10, 0.2);
    }

    .bo-member {
      background: rgba(30, 18, 5, 0.7);
      border: 1px solid rgba(100, 65, 15, 0.3);
      border-radius: 6px;
      padding: 8px 10px;
      transition: border-color 0.3s;
    }

    .bo-member.acting {
      border-color: rgba(220, 160, 40, 0.8);
      box-shadow: 0 0 8px rgba(200, 140, 20, 0.3);
    }

    .bo-member.dead {
      opacity: 0.3;
      filter: grayscale(1);
    }

    .bo-member-icon {
      font-size: 20px;
      text-align: center;
      margin-bottom: 3px;
    }

    .bo-member-name {
      font-size: 10px;
      color: #c0a060;
      text-align: center;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .bo-log-area {
      flex: 1;
      padding: 14px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bo-log-entry {
      font-size: 12px;
      color: #c0a870;
      line-height: 1.7;
      padding: 2px 0;
      border-bottom: 1px solid rgba(80, 50, 10, 0.1);
      animation: logFadeIn 0.3s ease;
    }

    @keyframes logFadeIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .bo-log-entry.log-crit {
      color: #f0c040;
      font-weight: 700;
    }

    .bo-log-entry.log-combo {
      color: #c060f0;
      font-weight: 700;
    }

    .bo-log-entry.log-magic {
      color: #60c0f0;
    }

    .bo-log-entry.log-heal {
      color: #60d080;
    }

    .bo-log-entry.log-enemy {
      color: #d08080;
    }

    .bo-log-entry.log-system {
      color: #807060;
      font-size: 10px;
    }

    .bo-log-entry.log-victory {
      color: #f0e060;
      font-weight: 700;
    }

    .bo-log-entry.log-defeat {
      color: #d04040;
    }

    .bo-log-entry.log-death {
      color: #ff4040;
      font-weight: 700;
      font-size: 13px;
    }

    .bo-log-entry.log-levelup {
      color: #ffe060;
      font-weight: 700;
      font-size: 13px;
    }

    .bo-log-entry.log-damage {
      color: #f07040;
    }

    .dmg-num {
      font-weight: 700;
      color: inherit;
      text-shadow: 0 0 6px currentColor;
    }

    .bo-log-entry.log-enemy .dmg-num {
      color: #ff6060;
    }

    .bo-log-entry.log-crit .dmg-num {
      color: #ffe040;
      font-size: 1.1em;
    }

    .bo-log-entry.log-heal .dmg-num {
      color: #60ff90;
    }

    /* ===== 戦闘エフェクト ===== */
    @keyframes slash-effect {
      0% {
        opacity: 0;
        transform: rotate(-40deg) scaleX(0);
      }

      20% {
        opacity: 1;
        transform: rotate(-40deg) scaleX(1.2);
      }

      50% {
        opacity: 0.8;
        transform: rotate(-40deg) scaleX(1);
      }

      100% {
        opacity: 0;
        transform: rotate(-40deg) scaleX(0.5);
      }
    }

    @keyframes magic-burst {
      0% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      30% {
        opacity: 1;
        transform: scale(1.5) rotate(120deg);
      }

      70% {
        opacity: 0.6;
        transform: scale(1.8) rotate(240deg);
      }

      100% {
        opacity: 0;
        transform: scale(2.5) rotate(360deg);
      }
    }

    @keyframes crit-flash {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      25% {
        opacity: 1;
        transform: scale(1.4);
      }

      60% {
        opacity: 0.9;
        transform: scale(1.1);
      }

      100% {
        opacity: 0;
        transform: scale(1.6);
      }
    }

    @keyframes heal-bloom {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }

      40% {
        opacity: 1;
        transform: translateY(-8px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateY(-20px) scale(0.8);
      }
    }

    @keyframes card-shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-4px) rotate(-1deg);
      }

      40% {
        transform: translateX(4px) rotate(1deg);
      }

      60% {
        transform: translateX(-3px);
      }

      80% {
        transform: translateX(3px);
      }
    }

    @keyframes card-hit {

      0%,
      100% {
        filter: brightness(1);
      }

      30% {
        filter: brightness(2.5) saturate(0.2);
      }

      60% {
        filter: brightness(1.4);
      }
    }

    @keyframes float-dmg {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      40% {
        opacity: 1;
        transform: translateY(-18px) scale(1.3);
      }

      100% {
        opacity: 0;
        transform: translateY(-36px) scale(0.9);
      }
    }

    .battle-effect-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .effect-slash {
      position: absolute;
      width: 110%;
      height: 6px;
      left: -5%;
      top: 40%;
      background: linear-gradient(90deg, transparent 0%, #fff8a0 30%, #ffe060 60%, transparent 100%);
      border-radius: 3px;
      box-shadow: 0 0 12px 4px rgba(255, 220, 80, 0.6);
      animation: slash-effect 0.35s ease-out forwards;
    }

    .effect-magic {
      position: absolute;
      width: 60px;
      height: 60px;
      left: 50%;
      top: 30%;
      margin-left: -30px;
      margin-top: -30px;
      background: radial-gradient(ellipse at center, #e0a0ff 0%, #8040ff 40%, transparent 70%);
      border-radius: 50%;
      box-shadow: 0 0 24px 8px rgba(160, 80, 255, 0.7);
      animation: magic-burst 0.5s ease-out forwards;
    }

    .effect-crit {
      position: absolute;
      width: 80px;
      height: 80px;
      left: 50%;
      top: 20%;
      margin-left: -40px;
      margin-top: -40px;
      background: radial-gradient(ellipse at center, #fff5a0 0%, #ff9000 40%, #ff3000 70%, transparent 90%);
      border-radius: 50%;
      box-shadow: 0 0 32px 12px rgba(255, 140, 0, 0.8);
      animation: crit-flash 0.45s ease-out forwards;
    }

    .effect-heal {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 28px;
      margin-left: -14px;
      margin-top: -14px;
      animation: heal-bloom 0.7s ease-out forwards;
      text-shadow: 0 0 8px #40ff80;
    }

    .float-dmg-num {
      position: absolute;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 2px 4px #000, 0 0 12px currentColor;
      animation: float-dmg 0.9s ease-out forwards;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }

    .bo-hp-card.shaking {
      animation: card-shake 0.35s ease-out;
    }

    .bo-hp-card.hit {
      animation: card-hit 0.35s ease-out;
    }

    .bo-footer {
      flex-shrink: 0;
      padding: 10px 20px;
      border-top: 1px solid rgba(100, 60, 10, 0.3);
      display: flex;
      justify-content: flex-end;
    }

    .bo-close-btn {
      padding: 8px 24px;
      background: rgba(80, 50, 10, 0.7);
      border: 1px solid rgba(160, 110, 30, 0.5);
      border-radius: 6px;
      color: #e8c060;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .bo-close-btn:hover {
      background: rgba(120, 80, 15, 0.9);
    }

    .bo-skill-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .bo-skill-badge.phys {
      background: rgba(180, 80, 20, 0.3);
      color: #e09050;
    }

    .bo-skill-badge.magic {
      background: rgba(60, 80, 200, 0.3);
      color: #80a0f0;
    }

    .bo-skill-badge.combo {
      background: rgba(140, 40, 200, 0.3);
      color: #c080f0;
    }

    .bo-skill-badge.heal {
      background: rgba(20, 140, 60, 0.3);
      color: #60e090;
    }

    /* 死亡エフェクト */
    .death-flash {
      position: fixed;
      inset: 0;
      background: rgba(180, 20, 20, 0.25);
      z-index: 600;
      pointer-events: none;
      animation: deathFlash 0.8s ease forwards;
    }

    @keyframes deathFlash {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* レベルアップエフェクト */
    .levelup-flash {
      position: fixed;
      inset: 0;
      background: rgba(220, 180, 20, 0.2);
      z-index: 600;
      pointer-events: none;
      animation: lvFlash 1.0s ease forwards;
    }

    @keyframes lvFlash {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* === D&D ドラッグ関連 === */
    .inv-item[draggable=true] {
      cursor: grab;
    }

    .inv-item[draggable=true]:active {
      cursor: grabbing;
    }

    .inv-item.dragging {
      opacity: 0.5;
    }

    .eq-slot-drop {
      border: 1px dashed rgba(100, 70, 20, 0.4);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 10px;
      color: #706040;
      cursor: pointer;
      transition: all 0.2s;
    }

    .eq-slot-drop.drag-over {
      border-color: rgba(220, 160, 40, 0.8);
      background: rgba(100, 60, 10, 0.3);
      color: #e8c060;
    }

    /* LVバッジ */
    .lv-badge {
      display: inline-block;
      font-size: 9px;
      background: rgba(60, 40, 5, 0.7);
      border: 1px solid rgba(140, 100, 20, 0.4);
      border-radius: 3px;
      padding: 1px 4px;
      color: #c8a040;
      margin-left: 4px;
    }

    /* XPバー */
    .xp-bar-wrap {
      height: 3px;
      background: rgba(20, 12, 3, 0.8);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #a06010, #f0c030);
      border-radius: 2px;
      transition: width 0.6s ease;
    }
  </style>
</head>

<body>

  <!-- 装備変更モーダル -->
  <div id="equip-modal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9000;align-items:center;justify-content:center;">
    <div
      style="background:#2a1e10;border:2px solid #806040;border-radius:10px;padding:18px;min-width:260px;max-width:340px;position:relative;">
      <button onclick="document.getElementById('equip-modal').style.display='none'"
        style="position:absolute;top:8px;right:10px;background:none;border:none;color:#c08040;font-size:16px;cursor:pointer;">✕</button>
      <div id="equip-modal-content"></div>
    </div>
  </div>

  <!-- スキルツリーモーダル -->
  <div id="skill-tree-modal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9100;align-items:center;justify-content:center;">
    <div
      style="background:#1a1228;border:2px solid #8060c0;border-radius:12px;padding:20px;min-width:300px;max-width:380px;position:relative;">
      <button onclick="document.getElementById('skill-tree-modal').style.display='none'"
        style="position:absolute;top:8px;right:10px;background:none;border:none;color:#a080e0;font-size:18px;cursor:pointer;">✕</button>
      <div id="skill-tree-modal-content"></div>
    </div>
  </div>

  <!-- 旅人会話モーダル -->
  <div id="traveler-talk-modal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9200;align-items:center;justify-content:center;">
    <div

  <script>
    // ===== 定数 =====
    const TW = 64, TH = 64;
    const MAP_W = 18, MAP_H = 18;

    // ===== POMERA WORLD: フェーズ1 ゲームシステム =====

    // ---------- 辞書データ ----------
    const FIRST_NAMES = ['アシュ', 'カイン', 'フェリス', 'ルイン', 'ソラグ', 'ミレア', 'エルヴァ', 'クラウス',
      'シルヴァ', 'テライン', 'ノアム', 'セドラ', 'ヴィレン', 'ガウロ', 'アイリス', 'レムノ',
      'ファリス', 'ロイテル', 'セリア', 'ドルネ', 'カルナ', 'グリモ', 'ライア', 'ヴァン'];
    const ATTR = ['炎', '水', '土', '風', '光', '影', '記憶', '時', '星', '夢'];
    const RACES = ['人間', 'エルフ', 'ドワーフ', 'ノーム', '半竜人', '幽鬼族'];
    const RACE_BONUS = {
      '人間': '全ステ均等', 'エルフ': 'MAG+3', 'ドワーフ': 'DEF+3 ATK+2',
      'ノーム': 'SPD+4', '半竜人': 'ATK+5 DEF-1', '幽鬼族': 'MAG+2 HP-5'
    };
    const CLASSES_BY_TYPE = {
      'タスク': ['戦士', '傭兵', '職人', '鍛冶師'],
      'タスク完了': ['英雄', 'マスター', '師匠'],
      '知見': ['魔法使い', '学者', '賢者', '錬金術師'],
      '出来事': ['冒険者', '吟遊詩人', '斥候'],
      '人物': ['商人', '外交官', '仲介者'],
      '日記': ['語り部', '詩人', '記録者'],
      '暇人': ['暇人', '見習い', '流浪者']
    };
    const CLASS_ICONS = {
      '戦士': '⚔', '傭兵': '🗡', '職人': '🔨', '鍛冶師': '⚒', '英雄': '🌟', 'マスター': '👑', '師匠': '🎓',
      '魔法使い': '🔮', '学者': '📚', '賢者': '📖', '錬金術師': '⚗', '冒険者': '🧭', '吟遊詩人': '🎵', '斥候': '🏹',
      '商人': '💰', '外交官': '🤝', '仲介者': '🔗', '語り部': '📜', '詩人': '🖊', '記録者': '🗒',
      '暇人': '😴', '見習い': '🌱', '流浪者': '🍃'
    };
    const PERSONALITIES = ['誠実', '快活', '寡黙', '好奇心旺盛', '慎重', '大胆', '物静か', '飄々', '陽気', '気難しい'];
    const STORY_TEMPLATES = [
      '記憶の欠片から生まれた者。{attr}の属性を宿し、{personality}な性格で知られる。',
      'かつて{attr}の地に生きた記録が、この姿となって現れた。{personality}な魂の持ち主。',
      '{attr}の思念が凝固した存在。{personality}であり、村の発展を望んでいる。',
      '日記の言葉が人の形を取った。{attr}の気配を纏い、{personality}に微笑む。'
    ];
    const HOBBY_IDLE = ['ぼんやり空を見ている', '道端で昼寝をしている', '誰かに話しかけようとして止まった', '石を並べて遊んでいる'];

    // ---------- シードベース疑似乱数 ----------
    function seededRand(seed, n) {
      const s = Math.abs(Math.sin(seed * 9301 + n * 49297 + 233) * 16807);
      return s - Math.floor(s);
    }
    function hashStr(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    // ---------- キャラクター生成エンジン ----------
    function generateCharacter(node) {
      const seed = hashStr((node.id || '') + (node.detail || '') + (node.label || ''));
      const isIdle = seededRand(seed, 99) < 0.08; // 8%確率で暇人
      const typeKey = isIdle ? '暇人'
        : node.type === 'タスク' && node.status === '完了' ? 'タスク完了'
          : (node.type || '日記');
      const classList = CLASSES_BY_TYPE[typeKey] || CLASSES_BY_TYPE['日記'];
      const cls = classList[Math.floor(seededRand(seed, 1) * classList.length)];
      const race = RACES[Math.floor(seededRand(seed, 2) * RACES.length)];
      const attr = ATTR[Math.floor(seededRand(seed, 3) * ATTR.length)];
      const firstName = FIRST_NAMES[Math.floor(seededRand(seed, 4) * FIRST_NAMES.length)];
      const name = attr + 'の' + firstName;
      const personality = PERSONALITIES[Math.floor(seededRand(seed, 5) * PERSONALITIES.length)];
      const icon = CLASS_ICONS[cls] || '❓';
      const colorHue = Math.floor(seededRand(seed, 9) * 360);

      // ===== Elinスタイルの8基本属性 =====
      const r = (i, min, max) => min + Math.floor(seededRand(seed, i) * (max - min + 1));
      const base = {
        STR: r(10, 7, 20),  // 力
        CON: r(11, 7, 20),  // 耐久
        DEX: r(12, 7, 20),  // 器用
        PER: r(13, 7, 20),  // 知覚
        LER: r(14, 7, 20),  // 学習
        WIL: r(15, 7, 20),  // 意志
        MAG: r(16, 7, 20),  // 魔力
        CHR: r(17, 7, 20),  // 魅力
        LUC: r(18, 5, 18),  // 運
      };
      // 種族ボーナス
      if (race === 'エルフ') { base.MAG += 4; base.DEX += 2; base.CON -= 2; }
      if (race === 'ドワーフ') { base.CON += 4; base.STR += 3; base.CHR -= 2; }
      if (race === 'ノーム') { base.DEX += 3; base.LER += 3; base.STR -= 2; }
      if (race === '半竜人') { base.STR += 5; base.CON += 3; base.CHR -= 3; }
      if (race === '幽鬼族') { base.MAG += 5; base.WIL += 3; base.CON -= 3; }
      // 職業ボーナス
      if (cls === '剣士' || cls === '勇者') { base.STR += 3; base.CON += 2; }
      if (cls === '魔法使い' || cls === '陰陽師') { base.MAG += 4; base.LER += 2; }
      if (cls === '癒し手' || cls === '盾士') { base.WIL += 3; base.CON += 2; }
      if (cls === '筆士' || cls === '詩人') { base.CHR += 4; base.LER += 3; }
      if (cls === '商人') { base.CHR += 3; base.PER += 3; }
      if (isIdle) { // 暇人: 全体が低め + 潜在力
        for (const k of Object.keys(base)) base[k] = Math.max(5, Math.floor(base[k] * 0.7));
        base.POTENTIAL = r(25, 60, 99); // 隠しパラメータ（伸びしろ）
      }
      // 派生ステータス（戦闘用）
      const HP = base.CON * 5 + base.WIL * 2 + r(20, 10, 30);
      const MANA = base.MAG * 3 + base.WIL * 2 + r(24, 5, 20);
      const ATK = base.STR * 2 + Math.floor(base.DEX / 2) + r(21, 0, 10);
      const DEF = base.CON * 2 + Math.floor(base.STR / 3) + r(22, 0, 8);
      const SPD = base.DEX + Math.floor(base.PER / 2) + r(23, 0, 8);
      const stats = { ...base, HP, MANA, ATK, DEF, SPD };

      // フレーバーテキスト
      const tmpl = STORY_TEMPLATES[Math.floor(seededRand(seed, 14) * STORY_TEMPLATES.length)];
      const story = isIdle
        ? '「何もしていない。でも、それでいい気がする。」 ─ ' + HOBBY_IDLE[Math.floor(seededRand(seed, 15) * HOBBY_IDLE.length)]
        : tmpl.replace('{attr}', attr).replace('{personality}', personality);

      // 採用コスト（稀少度スコア）
      const rarityScore = base.STR + base.MAG + base.CHR + base.LER;
      const cost = rarityScore > 70 ? 30 : rarityScore > 50 ? 20 : 10;

      return { id: 'char_' + seed, node, name, cls, race, icon, colorHue, stats, story, cost, isIdle, seed };
    }


    // ---------- CPシステム ----------
    function loadCP() {
      return parseInt(localStorage.getItem('pomera_cp') || '0', 10);
    }
    function saveCP(val) {
      localStorage.setItem('pomera_cp', String(val));
    }
    function gainCP(amount, reason) {
      let cp = loadCP() + amount;
      saveCP(cp);
      refreshCPDisplay(true);
      addBattleLog('📜 +' + amount + ' CP（' + reason + '）', 'log-system');
    }
    function spendCP(amount) {
      let cp = loadCP();
      if (cp < amount) return false;
      saveCP(cp - amount);
      refreshCPDisplay(false);
      return true;
    }
    function refreshCPDisplay(gained) {
      const el = document.getElementById('cpval');
      const wrap = document.getElementById('hcp');
      if (!el) return;
      el.textContent = loadCP();
      if (gained) {
        wrap.classList.add('gain');
        setTimeout(() => wrap.classList.remove('gain'), 800);
      }
    }

    // ---------- デイリーCP補充 ----------
    function checkDailyCP() {
      const now = Date.now();
      const last = parseInt(localStorage.getItem('pomera_last_login') || '0', 10);
      const elapsed = now - last;
      if (elapsed > 24 * 60 * 60 * 1000) {
        localStorage.setItem('pomera_last_login', String(now));
        gainCP(50, '日次補充（冒険の記録が力になった）');
      } else {
        localStorage.setItem('pomera_last_login', String(now));
      }
      // CP30以下: 緊急クエスト自動出現
      if (loadCP() <= 30) {
        ensureEmergencyQuest();
      }
    }

    function ensureEmergencyQuest() {
      const eq = ALL_QUESTS.find(q => q.id === 'emergency_cp');
      if (!eq) {
        ALL_QUESTS.push({
          id: 'emergency_cp',
          title: '困窮の旅',
          desc: '廃坑の奥を調べ、失われた財宝を取り戻せ。',
          icon: '⛏',
          status: '未着手',
          reward: 80,
          isEmergency: true
        });
        addBattleLog('⛏ 緊急クエスト「困窮の旅」が現れた！クエストタブで確認できる。', 'log-system');
        renderQuestBoard();
      }
    }

    // ---------- タブ切り替え ----------
    const ALL_TABS = ['travelers', 'party', 'inventory'];
    function switchTab(tab) {
      ALL_TABS.forEach(t => {
        const el = document.getElementById('tab-' + t);
        if (el) el.style.display = t === tab ? '' : 'none';
        const nav = document.getElementById('nav-' + t);
        if (nav) nav.classList.toggle('active', t === tab);
      });
      // パーティータブに切り替えた場合は描画更新
      if (tab === 'party') renderPartyPanel();
      if (tab === 'inventory') renderInventoryPanel();
    }

    // ---------- 旅人リスト描画 ----------
    let ALL_TRAVELERS = [];   // 全旅人（キャラデータ）
    let RECRUITED = new Set(); // 採用済みID
    let PARTY = [];            // パーティーメンバー（最大4）
    let DEAD_CHARS = new Set();// パーマデス済みID
    let CHAR_XP = {};       // { charId: 累計XP }
    let CHAR_LV = {};       // { charId: レベル }
    let COMBO_USED = new Set();// 合技使用済み（バトル内）
    let INVENTORY = [];        // 装備品インベントリ
    let EQUIPPED = {};         // { charId: { weapon: eq, armor: eq, accessory: eq } }
    let DUNGEON_FLOOR = 1;     // 現在のダンジョンフロア深度


    // ========== 装備品システム ==========

    // --- 辞書 ---
    const EQ_PREFIX = {
      weapon: ['砕石の', '霜の', '炎の', '影の', '記憶の', '嵐の', '黎明の', '虚無の', '深淵の', '煌の'],
      armor: ['鉄壁の', '霜の', '炎の', '影の', '記憶の', '嵐の', '黎明の', '古の', '深淵の', '煌の'],
      accessory: ['記憶の', '輝く', '古の', '霜の', '影の', '炎の', '嵐の', '黎明の', '虚無の', '深淵の']
    };
    const EQ_BASE = {
      weapon: ['剣', '短剣', '斧', '杖', '弓', '槍', 'ナイフ', '大剣', '魔杖', '曲刀'],
      armor: ['鎧', '外套', '盾', '篭手', '兜', '胸当て', '革鎧', '法衣', '重鎧'],
      accessory: ['首飾り', '指輪', '腕輪', '御守', '羽根', '欠片', '勾玉', '紋章石']
    };
    const EQ_SUFFIX = {
      uncommon: ['の加護', 'の古書', 'の試練', 'の詩'],
      rare: ['：古代の守護', '：炎帝のもの', '：深淵より', '：星の意志'],
      legendary: ['〈無限の記憶〉', '〈世界の断片〉', '〈時の彼方〉', '〈忘れられた者〉']
    };
    // ========== スキル定義 ==========
    const SKILLS_PHYS = [
      { id: 'normal', name: '通常攻撃', icon: '⚔', req: {}, dmgMul: 1.0, mpCost: 0, logCls: 'log-hit', desc: 'standard' },
      { id: 'slash', name: '全力斬り', icon: '🗡', req: { STR: 15 }, dmgMul: 2.2, mpCost: 0, logCls: 'log-crit', cooldown: 2, desc: 'heavy' },
      { id: 'double', name: '二連撃', icon: '⚔⚔', req: { DEX: 16 }, dmgMul: 0.7, mpCost: 0, logCls: 'log-hit', hits: 2, desc: 'double' },
      { id: 'guard', name: '防御姿勢', icon: '🛡', req: { CON: 14 }, dmgMul: 0, mpCost: 0, logCls: 'log-heal', defend: true, desc: 'defend' },
      { id: 'pierce', name: '看破', icon: '👁', req: { PER: 15 }, dmgMul: 1.5, mpCost: 0, logCls: 'log-crit', pierce: true, desc: 'pierce' },
    ];
    const SKILLS_MAGIC = [
      { id: 'fire', name: '炎術', icon: '🔥', req: { MAG: 14 }, dmgMul: 2.0, mpCost: 12, logCls: 'log-magic', elem: '炎' },
      { id: 'blizzard', name: '吹雪', icon: '❄', req: { MAG: 16 }, dmgMul: 2.2, mpCost: 15, logCls: 'log-magic', elem: '氷' },
      { id: 'heal', name: '癒しの光', icon: '✨', req: { WIL: 15 }, dmgMul: 0, mpCost: 10, logCls: 'log-heal', heal: true },
      { id: 'curse', name: '呪縛', icon: '💀', req: { MAG: 12 }, dmgMul: 0, mpCost: 8, logCls: 'log-magic', debuff: 'atk', debuffVal: 0.7, duration: 2 },
      { id: 'release', name: '魔力解放', icon: '💥', req: { MAG: 18 }, dmgMul: 3.5, mpCost: 20, logCls: 'log-magic', aoe: true },
    ];
    const SKILLS_COMBO = [
      { id: 'chain', name: '連携斬り', icon: '⚔🔗⚔', reqA: { STR: 14 }, reqB: { STR: 14 }, dmgMul: 1.8, mpCost: 15, logCls: 'log-combo' },
      { id: 'fireedge', name: '炎刃', icon: '🔥⚔', reqA: { STR: 14 }, reqB: { MAG: 14 }, dmgMul: 1.5, mpCost: 18, logCls: 'log-combo', magBonus: 1.5 },
      { id: 'circle', name: '魔法陣展開', icon: '✨💠✨', reqA: { MAG: 14 }, reqB: { MAG: 14 }, dmgMul: 2.0, mpCost: 22, logCls: 'log-combo', aoe: true },
      { id: 'fortress', name: '鉄壁の盟約', icon: '🛡🛡', reqA: { CON: 14 }, reqB: { CON: 14 }, dmgMul: 0, mpCost: 12, logCls: 'log-heal', fortress: true },
      { id: 'storm', name: '嵐の舞', icon: '🌪', reqA: { DEX: 16 }, reqB: { CHR: 16 }, dmgMul: 0.8, mpCost: 16, logCls: 'log-combo', hits: 4 },
    ];

    // キャラが使えるスキルを決定（オート）
    function chooseSkill(char, partyHp, partyMaxHp, monsterHp, comboUsed) {
      const eff = getEffectiveStats(char);
      const mana = getCharMana(char.id);
      const lv = getCharLv(char.id);

      // 魔法技チェック
      const avMagic = SKILLS_MAGIC.filter(sk => {
        if (sk.mpCost > mana) return false;
        return Object.entries(sk.req || {}).every(([k, v]) => eff[k] >= v);
      });
      // 物理技チェック
      const avPhys = SKILLS_PHYS.filter(sk => {
        if (sk.cooldown && (SKILL_COOLDOWN[char.id]?.[sk.id] || 0) > 0) return false;
        return Object.entries(sk.req || {}).every(([k, v]) => eff[k] >= v);
      });

      // 回復優先: HPが30%以下なら癒しの光
      if (partyHp < partyMaxHp * 0.3) {
        const healSkill = avMagic.find(s => s.heal);
        if (healSkill) return { type: 'magic', skill: healSkill };
      }
      // 魔力解放: HP50%以上でMAG高い場合
      if (monsterHp > 50 && partyHp >= partyMaxHp * 0.5) {
        const aoe = avMagic.find(s => s.aoe);
        if (aoe) return { type: 'magic', skill: aoe };
      }
      // 全力斬り: モンスターHP少ない + STR高い
      if (monsterHp < 50) {
        const heavy = avPhys.find(s => s.id === 'slash');
        if (heavy) return { type: 'phys', skill: heavy };
      }
      // 魔法技（炎術など）
      if (avMagic.length > 0 && Math.random() < 0.4) {
        const sk = avMagic[Math.floor(Math.random() * avMagic.length)];
        return { type: 'magic', skill: sk };
      }
      // 物理技
      if (avPhys.length > 1 && Math.random() < 0.35) {
        const available = avPhys.filter(s => s.id !== 'normal');
        if (available.length > 0) return { type: 'phys', skill: available[Math.floor(Math.random() * available.length)] };
      }
      // デフォルト: 通常攻撃
      return { type: 'phys', skill: SKILLS_PHYS[0] };
    }

    // 合技を判定（パーティーの2人組の中からランダムに）
    function chooseCombo(party, comboUsed, monsterHp) {
      if (party.length < 2 || comboUsed.size >= 2) return null;
      if (Math.random() > 0.25) return null; // 25%の確率で発動チャレンジ
      for (const combo of SKILLS_COMBO) {
        for (let i = 0; i < party.length; i++) {
          for (let j = i + 1; j < party.length; j++) {
            if (comboUsed.has(combo.id)) continue;
            const effA = getEffectiveStats(party[i]);
            const effB = getEffectiveStats(party[j]);
            if (Object.entries(combo.reqA).every(([k, v]) => effA[k] >= v) &&
              Object.entries(combo.reqB).every(([k, v]) => effB[k] >= v)) {
              if (getCharMana(party[i].id) >= combo.mpCost / 2 &&
                getCharMana(party[j].id) >= combo.mpCost / 2) {
                return { combo, charA: party[i], charB: party[j] };
              }
            }
          }
        }
      }
      return null;
    }

    // マナ管理
    let CHAR_MANA = {}; // { charId: 現在マナ }
    let SKILL_COOLDOWN = {}; // { charId: { skillId: turns } }
    function initBattleMana() {
      CHAR_MANA = {};
      SKILL_COOLDOWN = {};
      for (const c of PARTY) {
        const eff = getEffectiveStats(c);
        CHAR_MANA[c.id] = eff.MANA || (eff.MAG * 3 + 10);
        SKILL_COOLDOWN[c.id] = {};
      }
    }
    function getCharMana(id) { return CHAR_MANA[id] || 0; }
    function spendMana(id, cost) { CHAR_MANA[id] = Math.max(0, (CHAR_MANA[id] || 0) - cost); }
    function tickCooldowns() {
      for (const id of Object.keys(SKILL_COOLDOWN)) {
        for (const sk of Object.keys(SKILL_COOLDOWN[id])) {
          if (SKILL_COOLDOWN[id][sk] > 0) SKILL_COOLDOWN[id][sk]--;
        }
      }
    }

      accessory: [{ k: 'SPD', base: 3 }, { k: 'DEF', base: 2 }]

    // --- 装備品生成 ---
    function generateEquipment(floor) {
      const slot = ['weapon', 'armor', 'accessory'][Math.floor(Math.random() * 3)];
      // レアリティ抽選
      let r = Math.random();
      let rarity = EQ_RARITY[0];
      for (const rv of EQ_RARITY) {
        r -= rv.rate;
        if (r <= 0) { rarity = rv; break; }
      }
      // フロア補正
      if (floor >= 16 && Math.random() < 0.2) rarity = EQ_RARITY[Math.floor(2 + Math.random() * 2)];
      else if (floor >= 6 && Math.random() < 0.15) rarity = EQ_RARITY[Math.min(1, EQ_RARITY.indexOf(rarity) + 1)];

      const prefix = EQ_PREFIX[slot][Math.floor(Math.random() * EQ_PREFIX[slot].length)];
      const base = EQ_BASE[slot][Math.floor(Math.random() * EQ_BASE[slot].length)];
      const suffixList = EQ_SUFFIX[rarity.id];
      const suffix = suffixList ? suffixList[Math.floor(Math.random() * suffixList.length)] : '';
      const name = prefix + base + (suffix || '');

      // ステータス計算
      const floorMul = floor >= 16 ? 2.5 : floor >= 6 ? 1.5 : 1.0;
      const stat = {};
      for (const t of EQ_STAT_TEMPLATE[slot]) {
        const v = Math.max(1, Math.round(t.base * rarity.mul * floorMul * (0.8 + Math.random() * 0.4)));
        if (Math.random() < 0.7) stat[t.k] = v; // 70%で第1ステータス付与
      }
      if (Object.keys(stat).length === 0) { // 最低1つ保証
        const t = EQ_STAT_TEMPLATE[slot][0];
        stat[t.k] = Math.max(1, Math.round(t.base * rarity.mul * floorMul));
      }

      // エンチャント（レア以上で確率付与）
      let enchant = null;
      if (rarity.id === 'legendary' && Math.random() < 0.9) {
        const avail = ENCHANTS.filter(e => e.slots.includes(slot));
        enchant = avail[Math.floor(Math.random() * avail.length)];
      } else if (rarity.id === 'rare' && Math.random() < 0.4) {
        const avail = ENCHANTS.filter(e => e.slots.includes(slot));
        enchant = avail[Math.floor(Math.random() * avail.length)];
      }

      const icon = slot === 'weapon' ? '⚔' : slot === 'armor' ? '🛡' : '💎';
      return {
        id: 'eq_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
        name, slot, rarity: rarity.id, rarityData: rarity, stat, enchant, floorDrop: floor, icon
      };
    }

    // --- 実効ステータス計算（装備込み）---
    function getEffectiveStats(char) {
      const base = { ...char.stats };
      const eq = EQUIPPED[char.id] || {};
      for (const item of Object.values(eq)) {
        if (!item) continue;
        for (const [k, v] of Object.entries(item.stat || {})) base[k] = (base[k] || 0) + v;
        // エンチャント: 迅雷 → SPD+5
        if (item.enchant && item.enchant.id === 'swift') base.SPD = (base.SPD || 0) + 5;
      }
      // スキルパスのパッシブボーナス
      const sp = getSkillPath(char.id);
      const applyPath = (pathId) => {
        if (pathId === 'offense') {
          base.ATK = Math.round((base.ATK || 0) * 1.2);
          base.MAG = Math.round((base.MAG || 0) * 1.2);
        } else if (pathId === 'defense') {
          base.DEF = (base.DEF || 0) + 6;
        } else if (pathId === 'support') {
          base.WIL = (base.WIL || 0) + 4;
        }
      };
      if (sp.slot1) applyPath(sp.slot1);
      if (sp.slot2) applyPath(sp.slot2);
      return base;
    }

    // --- 装備する ---
    function equipItem(eqId, charId) {
      const item = INVENTORY.find(e => e.id === eqId);
      const char = ALL_TRAVELERS.find(c => c.id === charId);
      if (!item || !char) return;
      // 重複装備チェック: 他のキャラが同じアイテムを装備していないか確認
      for (const [otherCharId, slots] of Object.entries(EQUIPPED)) {
        if (otherCharId === charId) continue;
        for (const equipped of Object.values(slots)) {
          if (equipped && equipped.id === item.id) {
            const otherChar = ALL_TRAVELERS.find(c => c.id === otherCharId);
            addBattleLog('⚠ ' + item.name + ' はすでに ' + (otherChar?.name || '別の仲間') + ' が装備している！', 'log-defeat');
            return;
          }
        }
      }
      if (!EQUIPPED[charId]) EQUIPPED[charId] = {};
      EQUIPPED[charId][item.slot] = item;
      saveEquippedToStorage();
      const statStr = Object.entries(item.stat).map(([k, v]) => k + '+' + v).join(' ');
      addBattleLog(char.icon + ' ' + char.name + ' が ' + item.name + ' を装備した！（' + statStr + '）', 'log-system');
      renderPartyPanel();
      renderInventoryPanel();
      document.getElementById('equip-modal').style.display = 'none';
    }

        + '<div class="equip-target-list">' + charButtons + '</div>';
      modal.style.display = 'flex';
    }

    // --- インベントリパネル描画 ---
    function renderInventoryPanel() {
      const el = document.getElementById('inventory-list');
      if (!el) return;
      document.getElementById('inv-count').textContent = INVENTORY.length + '/50';
      if (INVENTORY.length === 0) {
        el.innerHTML = '<div style="color:#706050;font-size:10px;text-align:center;padding:16px">ダンジョンで装備品を入手しよう</div>';
        return;
      }
      // 誰かに装備済みか判定するヘルパー
      function getEquippedBy(itemId) {
        for (const [charId, slots] of Object.entries(EQUIPPED)) {
          for (const eq of Object.values(slots)) {
            if (eq && eq.id === itemId) {
              const char = ALL_TRAVELERS.find(c => c.id === charId);
              return char ? char.name : '仲間';
            }
          }
        }
        return null;
      }
      // スロットでソート: weapon → armor → accessory
      const slotOrder = { weapon: 0, armor: 1, accessory: 2 };
      const sorted = [...INVENTORY].sort((a, b) => {
        const rar = { legendary: 0, rare: 1, uncommon: 2, common: 3 };
        return (rar[a.rarity] - rar[b.rarity]) || (slotOrder[a.slot] - slotOrder[b.slot]);
      });
      el.innerHTML = sorted.map(item => {
        const rd = item.rarityData || EQ_RARITY.find(r => r.id === item.rarity) || EQ_RARITY[0];
        const statStr = Object.entries(item.stat || {}).map(([k, v]) => '+' + k + ':' + v).join(' ');
        const enchStr = item.enchant ? '✨' + item.enchant.label : '';
        const slotLabel = item.slot === 'weapon' ? '⚔武器' : item.slot === 'armor' ? '🛡防具' : '💎アクセ';
        const equippedBy = getEquippedBy(item.id);
        const equippedBadge = equippedBy
          ? '<span style="background:#2a4020;border:1px solid #406030;color:#80c060;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:4px">📌 ' + equippedBy + '装備中</span>'
          : '';
        return '<div class="inv-card" style="' + (equippedBy ? 'background:rgba(40,60,20,0.3);border-color:rgba(80,120,40,0.4)' : '') + '">'
          + '<div class="inv-head">'
          + '<span style="color:' + rd.color + '">' + rd.icon + ' ' + item.name + '</span>'
          + equippedBadge
          + '<span class="inv-slot">' + slotLabel + '</span>'
          + '</div>'
          + '<div class="inv-stat">' + statStr + (enchStr ? ' ' + enchStr : '') + '</div>'
          + '<div class="inv-actions">'
          + '<button onclick="showEquipModal(\'' + item.id + '\')" class="inv-btn"' + (equippedBy ? ' style="opacity:0.5"' : '') + '>' + (equippedBy ? '再装備' : '装備') + '</button>'
          + '<button onclick="discardItem(\'' + item.id + '\')" class="inv-discard"' + (equippedBy ? ' disabled style="opacity:0.3"' : '') + '>解体</button>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    // --- インベントリ解体 ---
    function discardItem(id) {
      INVENTORY = INVENTORY.filter(e => e.id !== id);
      saveInventoryToStorage();
      gainCP(2, '装備品解体');
      renderInventoryPanel();
    }

    // キャラクターの全データをキャッシュとして保存・読み込みする仕組み
    function saveCharCache(char) {
      try {
        const cache = JSON.parse(localStorage.getItem('pomera_char_cache') || '{}');
        cache[char.id] = char;
        localStorage.setItem('pomera_char_cache', JSON.stringify(cache));
      } catch (e) { }
    }
    function loadCharCache() {
      try { return JSON.parse(localStorage.getItem('pomera_char_cache') || '{}'); }
      catch (e) { return {}; }
    }
    function findCharById(id) {
      return ALL_TRAVELERS.find(c => c.id === id) || loadCharCache()[id] || null;
    }

    function loadRecruitedFromStorage() {
      try {
        const saved = JSON.parse(localStorage.getItem('pomera_recruited') || '[]');
        RECRUITED = new Set(saved);
        // キャッシュにあるキャラをALL_TRAVELERSへ補完（テストデータ対応）
        const cache = loadCharCache();
        saved.forEach(id => {
          if (cache[id] && !ALL_TRAVELERS.find(c => c.id === id)) {
            ALL_TRAVELERS.push(cache[id]);
          }
        });
      } catch (e) { RECRUITED = new Set(); }
    }
    function saveRecruitedToStorage() {
      localStorage.setItem('pomera_recruited', JSON.stringify([...RECRUITED]));
    }
    function loadPartyFromStorage() {
      try {
        const ids = JSON.parse(localStorage.getItem('pomera_party') || '[]');
        PARTY = ids.map(id => findCharById(id)).filter(Boolean);
      } catch (e) { PARTY = []; }
    }
    function savePartyToStorage() {
      localStorage.setItem('pomera_party', JSON.stringify(PARTY.map(c => c.id)));
    }

            <span class="tstat" style="color:#d06040">攻撃:${char.stats.ATK}</span>

            </button>

          const canvas = createCharCanvas(char, 40);
          if (canvas) {
            iconEl.textContent = '';

    function recruitChar(id) {
      if (RECRUITED.has(id)) return;
      if (DEAD_CHARS.has(id)) { addBattleLog('そのキャラクターは永遠に倒れた...', 'log-defeat'); return; }
      const char = findCharById(id);
      if (!char) return;
      if (!spendCP(char.cost)) { addBattleLog('CPが足りない！', 'log-defeat'); return; }
      RECRUITED.add(id);
      saveRecruitedToStorage();
      saveCharCache(char); // フルデータをキャッシュ保存
      addBattleLog(char.icon + ' ' + char.name + ' が仲間になった！', 'log-victory');
      renderTravelerList();
      renderPartyPanel();
    }

    // ---------- クエストボード ----------
    let ALL_QUESTS = [];

    function renderQuestBoard() {
      const el = document.getElementById('quest-list');
      if (!el) return; // 要素がない場合は安全にスキップ
      if (!ALL_QUESTS.length) { el.innerHTML = '<div style="color:#708060;font-size:10px;text-align:center;padding:16px">進行中のタスクがクエストになります</div>'; return; }
      el.innerHTML = ALL_QUESTS.map(q => {
        const done = q.status === '完了';
        return `<div class="quest-card ${done ? 'done' : ''}">
          <div class="quest-title">${done ? '✓ ' : '⚔ '}${q.label}</div>
          <div class="quest-meta">${q.status || '進行中'} ${q.date ? '· ' + q.date : ''}</div>

    // ---------- パーティーパネル ----------
    function switchPartySubTab(tab) {
      document.getElementById('sub-party').style.display = tab === 'party' ? '' : 'none';
      document.getElementById('sub-inventory').style.display = tab === 'inventory' ? '' : 'none';
      document.getElementById('sub-party-btn').classList.toggle('active', tab === 'party');
      const invBtn = document.getElementById('inv-tab-btn');
      if (invBtn) {
        invBtn.classList.toggle('active', tab === 'inventory');
        if (tab === 'inventory') { invBtn.style.color = ''; invBtn.textContent = '📦 インベントリ'; }
      }
      if (tab === 'inventory') renderInventoryPanel();
    }

    function renderPartyPanel() {
      // 死亡キャラをパーティーから排除（二重チェック）
      const before = PARTY.length;
      PARTY = PARTY.filter(c => !DEAD_CHARS.has(c.id));
      if (PARTY.length !== before) savePartyToStorage();
      const el = document.getElementById('party-list');
      const slots = 4;
      let html = '';
      // フロア表示
      const floorLbl = document.getElementById('floor-label');
      if (floorLbl) floorLbl.textContent = 'F' + DUNGEON_FLOOR;

      for (let i = 0; i < slots; i++) {
        const member = PARTY[i];
        if (member) {
          const eff = getEffectiveStats(member);
          const eq = EQUIPPED[member.id] || {};
          const slotDefs = [
            { key: 'weapon', label: '⚔', short: '武器' },
            { key: 'armor', label: '🛡', short: '防具' },
            { key: 'accessory', label: '💎', short: 'アクセ' }
          ];
          const eqHtml = slotDefs.map(sd => {
            const item = eq[sd.key];
            if (item) {
              return '<span class="eq-slot-item equipped" title="' + item.name + '">' + sd.label + ' ' + item.name.substring(0, 6) + '...'
                + '<button class="eq-unequip-btn" onclick="unequipItem(\'' + member.id + '\',\'' + sd.key + '\')">✕</button></span>';
            }
            return '<span class="eq-slot-item" onclick="switchTab(\'inventory\')">' + sd.label + ' ' + sd.short + '：空</span>';
          }).join('');

          const sp = getSkillPath(member.id);
          const lv = getCharLv(member.id);
          const badge = sp.slot1 ? (' <span style="font-size:9px;color:#9060c0">' + (SKILL_PATH_DEF.find(p => p.id === sp.slot1)?.icon || '') + (sp.slot2 ? '+' + (SKILL_PATH_DEF.find(p => p.id === sp.slot2)?.icon || '') : '') + '</span>') : '';

          // Elinスタイルスプライト画像URL取得
          const spriteUrl = (typeof getCharSpriteUrl === 'function') ? getCharSpriteUrl(member) : 'sprites/characters/default_char.png';
          const palName = (typeof CHAR_PALETTE_MAP !== 'undefined' && CHAR_PALETTE_MAP[member.cls]) || 'default_char';
          // クラス別グロースタイル
          const glowStyle = palName === 'hero'
            ? 'drop-shadow(0 6px 12px rgba(0,0,0,0.9)) drop-shadow(0 0 8px rgba(240,200,40,0.5))'
            : (palName === 'mage' || palName === 'sage' || palName === 'alchemist')
              ? 'drop-shadow(0 6px 12px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(140,80,255,0.4))'
              : 'drop-shadow(0 5px 10px rgba(0,0,0,0.85))';
          const animName = palName === 'hero' ? 'charIdle 2.4s ease-in-out infinite'
            : (palName === 'mage' || palName === 'sage' || palName === 'alchemist') ? 'charIdle 3.2s ease-in-out infinite'
              : 'charIdleSlow ' + (2.8 + i * 0.3) + 's ease-in-out infinite';

          html += '<div class="party-slot filled" data-sprite-id="' + member.id + '" style="position:relative">'
            + '<button class="party-remove" style="position:absolute;top:6px;right:6px" onclick="removeFromParty(\'' + member.id + '\')">✕</button>'
            // Elinスタイル画像スプライトエリア
            + '<div class="party-sprite-area" id="psprite-' + member.id + '">'
            + '<img src="' + spriteUrl + '" alt="' + member.cls + '"'
            + ' style="width:80px;height:80px;object-fit:contain;animation:' + animName + ';filter:' + glowStyle + ';image-rendering:pixelated"'
            + ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"'
            + '>'
            + '<span style="display:none;font-size:48px;line-height:1">' + member.icon + '</span>'
            + '</div>'
            + '<div class="party-slot-name">' + member.name + ' <span class="lv-badge">Lv' + lv + '</span></div>'
            + '<div class="xp-bar-wrap"><div class="xp-bar-fill" style="width:' + Math.round(getCharXp(member.id) / getXpToNextLv(lv) * 100) + '%"></div></div>'
            + '<div class="party-slot-class">' + member.race + ' ' + member.cls + '</div>'
            + '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;justify-content:center">'
            + '<span class="tstat" title="ATK" style="color:#d06040">攻:' + eff.ATK + '</span>'
            + '<span class="tstat" title="DEF" style="color:#60a0d0">防:' + eff.DEF + '</span>'
            + '<span class="tstat" title="HP" style="color:#d09060">HP:' + eff.HP + '</span>'
            + '<span class="tstat" title="MANA" style="color:#6080d0">MP:' + (eff.MANA || '?') + '</span>'
            + '<span class="tstat" title="SPD" style="color:#9060c0">速:' + eff.SPD + '</span>'
            + '</div>'
            + '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;justify-content:center">'
            + '<span class="tstat" title="STR" style="font-size:9px">力:' + eff.STR + '</span>'
            + '<span class="tstat" title="CON" style="font-size:9px">耐:' + eff.CON + '</span>'
            + '<span class="tstat" title="DEX" style="font-size:9px">器:' + eff.DEX + '</span>'
            + '<span class="tstat" title="MAG" style="font-size:9px">魔:' + eff.MAG + '</span>'
            + '</div>'
            + '<div class="eq-slots" style="margin-top:5px">' + eqHtml + '</div>'
            + '<div style="margin-top:6px;text-align:center"><button onclick="openSkillTreeModal(\'' + member.id + '\')" style="background:linear-gradient(135deg,#3a1e6a,#5a2e9a);border:1px solid #8060c0;color:#c0a0f0;font-size:9px;padding:3px 8px;border-radius:6px;cursor:pointer;">✦ スキル' + badge + (lv < 3 ? ' <span style="color:#604080">(Lv3〜)</span>' : '') + '</button></div>'
            + '</div>';
        } else {
          const available = ALL_TRAVELERS.filter(c => RECRUITED.has(c.id) && !PARTY.find(p => p.id === c.id));
          if (available.length > 0) {
            html += '<div class="party-slot">'
              + '<div class="party-sprite-area" style="opacity:0.3"><span style="font-size:40px">＋</span></div>'
              + '<select onchange="addToParty(this.value)" style="flex:1;background:rgba(60,35,5,0.7);border:1px solid rgba(120,80,10,0.4);color:#c0a060;font-size:9px;padding:2px;border-radius:3px">'
              + '<option value="">空きスロット（仲間を選ぶ）</option>'
              + available.map(c => '<option value="' + c.id + '">' + c.icon + ' ' + c.name + ' [' + c.cls + ']</option>').join('')
              + '</select></div>';
          } else {
            html += '<div class="party-slot"><div class="party-sprite-area" style="opacity:0.2"><span style="font-size:36px">👤</span></div><div style="color:#504030;font-size:9px;width:100%;text-align:center">空きスロット</div></div>';
          }
        }
      }
      el.innerHTML = html;

      refreshDungeonBtn();
    }


    function refreshDungeonBtn() {
      const btn = document.getElementById('dungeon-btn');
      if (!btn) return;
      if (IS_BATTLE_ACTIVE) {
        btn.disabled = true;
        btn.textContent = '⚔ 戦闘中...';
      } else {
        btn.disabled = PARTY.length === 0;
        btn.textContent = '⚔ ダンジョンへ';
      }
    }

    function addToParty(id) {
      if (!id || PARTY.length >= 4) return;
      const char = ALL_TRAVELERS.find(c => c.id === id);
      if (!char || PARTY.find(p => p.id === id)) return;
      PARTY.push(char);
      savePartyToStorage();
      renderPartyPanel();
    }

    function removeFromParty(id) {
      PARTY = PARTY.filter(c => c.id !== id);
      savePartyToStorage();
      renderPartyPanel();
    }



    // ---------- バトルログ ----------
    let battleLogLines = [];


    // ========== バトルオーバーレイ制御 ==========
    let boLogQueue = [];
    let boLogTimer = null;

    function openBattleOverlay(floorLabel, monster, party) {
      const ov = document.getElementById('battle-overlay');
      ov.classList.add('active');
      // ボスフロアはクラス追加
      if (monster.isBoss) ov.classList.add('boss-floor');
      else ov.classList.remove('boss-floor');
      // 階層別バトル背景グラデーション
      const battleArea = document.getElementById('bo-battle-area') || ov;
      if (monster.isBoss) {
        battleArea.style.background = 'linear-gradient(180deg, #1a0008 0%, #3a0010 50%, #200008 100%)';
      } else if (DUNGEON_FLOOR >= 16) {
        battleArea.style.background = 'linear-gradient(180deg, #0d0010 0%, #1a0030 50%, #0a000d 100%)';
      } else if (DUNGEON_FLOOR >= 6) {
        battleArea.style.background = 'linear-gradient(180deg, #0f0800 0%, #1e1200 50%, #150a00 100%)';
      } else {
        battleArea.style.background = 'linear-gradient(180deg, #020e00 0%, #081500 50%, #050d00 100%)';
      }
      document.getElementById('bo-floor-label').textContent = '── ' + (monster.statusLabel || floorLabel) + ' ──';
      // モンスターアイコン: Canvasドット絵を優先表示
      const iconEl = document.getElementById('bo-mon-icon');
      iconEl.textContent = '';
      iconEl.style.fontSize = '0';
      const monSize = monster.isBoss ? 96 : 64;
      const monCanvas = (typeof createMonsterCanvas === 'function')
        ? createMonsterCanvas(monster, monSize)
        : null;
      if (monCanvas) {
        monCanvas.style.animation = 'monsterFloat 2s ease-in-out infinite';
        iconEl.appendChild(monCanvas);
      } else {
        iconEl.style.fontSize = '32px';
        iconEl.textContent = monster.icon;
      }
      document.getElementById('bo-mon-name').textContent = monster.name;
      document.getElementById('bo-mon-hp-bar').style.width = '100%';
      document.getElementById('bo-mon-hp-num').textContent = monster.hp + '/' + monster.hp;
      document.getElementById('bo-close-btn').style.display = 'none';
      document.getElementById('bo-log-area').innerHTML = '';
      // ボス登場演出
      if (monster.isBoss && typeof triggerBossEntrance === 'function') {
        triggerBossEntrance(monster);
      }
      // パーティーHPバー初期化（キャラアイコンもCanvas化）
      const pa = document.getElementById('bo-party-area');
      pa.innerHTML = party.map(c => {
        const eff = getEffectiveStats(c);
        const lv = getCharLv(c.id);
        return `<div class="bo-member" id="bo-member-${c.id}">
          <div class="bo-member-icon" id="bo-char-icon-${c.id}">${c.icon}</div>
          <div class="bo-member-name">${c.name} <span class="lv-badge">Lv${lv}</span></div>
          <div class="hp-bar-wrap">
            <div class="hp-bar-fill party" id="bo-hp-bar-${c.id}" data-char="${c.id}" style="width:100%"></div>
          </div>
          <div class="hp-num" id="bo-hp-num-${c.id}">${eff.HP}/${eff.HP}</div>
        </div>`;
      }).join('');
      // キャラアイコンをCanvasに差し替え
      if (typeof createCharCanvas === 'function') {
        party.forEach(c => {
          const iconSlot = document.getElementById('bo-char-icon-' + c.id);
          if (!iconSlot) return;
          const cv = createCharCanvas(c, 32);
          iconSlot.textContent = '';
          iconSlot.style.fontSize = '0';
          iconSlot.appendChild(cv);
        });
      }
      boLogQueue = [];
    }

    function updateMonsterHpBar(hp, maxHp) {
      const pct = Math.max(0, (hp / maxHp) * 100);
      const bar = document.getElementById('bo-mon-hp-bar');
      if (bar) bar.style.width = pct + '%';
      const num = document.getElementById('bo-mon-hp-num');
      if (num) num.textContent = Math.max(0, hp) + '/' + maxHp;
    }

    function updatePartyHpBar(charId, hp, maxHp) {
      const pct = Math.max(0, (hp / maxHp) * 100);
      const bar = document.getElementById('bo-hp-bar-' + charId);
      if (bar) {
        bar.style.width = pct + '%';
        bar.className = 'hp-bar-fill party' + (pct < 20 ? ' critical' : pct < 40 ? ' low' : '');
        // HP10%以下でパルス点滅
        if (typeof checkHPPulse === 'function') checkHPPulse(charId, hp, maxHp);
        // 被ダメ時shake（HPが大幅に下がったら）
        if (pct < 30 && typeof triggerShakeEffect === 'function') {
          triggerShakeEffect(pct < 10 ? 3 : pct < 20 ? 2 : 1);
        }
      }
      const num = document.getElementById('bo-hp-num-' + charId);
      if (num) num.textContent = Math.max(0, hp) + '/' + maxHp;
    }

    function setMemberActing(charId, acting) {
      const el = document.getElementById('bo-member-' + charId);
      if (el) { if (acting) el.classList.add('acting'); else el.classList.remove('acting'); }
    }

    function setMemberDead(charId) {
      const el = document.getElementById('bo-member-' + charId);
      if (el) el.classList.add('dead');
