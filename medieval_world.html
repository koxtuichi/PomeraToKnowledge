<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>異世界の自分 | POMERA WORLD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #080511;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Courier New', monospace
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #080511;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
      transition: opacity 0.8s
    }

    #loading.out {
      opacity: 0;
      pointer-events: none
    }

    .lt {
      font-size: 22px;
      color: #c8934a;
      letter-spacing: 5px;
      text-shadow: 0 0 20px rgba(200, 147, 74, 0.5)
    }

    .ls {
      font-size: 10px;
      color: #7a5830;
      letter-spacing: 3px
    }

    .lbw {
      width: 200px;
      height: 6px;
      background: #120e1c;
      border: 1px solid rgba(80, 60, 20, 0.5);
      border-radius: 3px;
      overflow: hidden
    }

    .lb {
      height: 100%;
      background: linear-gradient(90deg, #6a3c10, #c8934a, #ffe090);
      width: 0;
      transition: width 0.6s;
      border-radius: 3px
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      background: rgba(4, 3, 10, 0.95);
      border-bottom: 1px solid rgba(120, 90, 30, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      z-index: 10
    }

    .hback {
      font-size: 10px;
      color: #7a6030;
      padding: 3px 10px;
      border: 1px solid rgba(100, 75, 25, 0.4);
      border-radius: 2px;
      text-decoration: none;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s
    }

    .hback:hover {
      color: #c8934a;
      border-color: rgba(200, 147, 74, 0.5);
      background: rgba(200, 147, 74, 0.05)
    }

    .htitle {
      font-size: 13px;
      color: #c8934a;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(200, 147, 74, 0.35)
    }

    .hr {
      margin-left: auto;
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 10px
    }

    .hwx {
      font-size: 16px
    }

    .hmood,
    .hclock {
      color: #7a6030;
      letter-spacing: 1px
    }

    #panel {
      position: fixed;
      right: 0;
      top: 34px;
      bottom: 0;
      width: 200px;
      background: rgba(5, 4, 14, 0.96);
      border-left: 1px solid rgba(60, 45, 15, 0.5);
      padding: 12px 10px;
      overflow-y: auto;
      z-index: 5
    }

    .ph {
      font-size: 8px;
      color: #5a4018;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(60, 45, 15, 0.4);
      padding-bottom: 4px;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .pt {
      font-size: 10px;
      color: #80684a;
      line-height: 1.8
    }

    .er {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px
    }

    .ed {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .el {
      font-size: 9px;
      color: #6a5838;
      flex: 1
    }

    .ebg {
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1px;
      flex: 1
    }

    .ebf {
      height: 100%;
      border-radius: 1px
    }

    .pact {
      font-size: 10px;
      color: #80b050;
      padding: 7px 8px;
      line-height: 1.7;
      background: rgba(40, 80, 15, 0.1);
      border: 1px solid rgba(40, 80, 15, 0.2);
      border-radius: 2px
    }

    .psec {
      margin-bottom: 16px
    }

    #world {
      position: fixed;
      top: 34px;
      left: 0;
      right: 200px;
      bottom: 0;
      overflow: hidden;
      cursor: default
    }

    #cv {
      position: absolute;
      top: 0;
      left: 0
    }
  </style>
</head>

      <span class="hclock" id="hclock">--:--</span>
