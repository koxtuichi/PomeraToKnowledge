    function boLog(text, cls) {
      const area = document.getElementById('bo-log-area');
      if (!area) return;
      const el = document.createElement('div');
      // ダメージ数値を色分け
      let autoCls = cls || '';
      if (!cls) {
        if (/ダメージ/.test(text) || /ヒット/.test(text)) autoCls = 'log-damage';
        else if (/回復/.test(text) || /HP/.test(text)) autoCls = 'log-heal';
      }
      el.className = 'bo-log-entry' + (autoCls ? ' ' + autoCls : '');
      // 数値強調（「123」をスパンで包む）
      el.innerHTML = text.replace(/(\d+)/g, '<span class="dmg-num">$1</span>');
      area.appendChild(el);
      area.scrollTop = area.scrollHeight;
      // 戦闘エフェクト発火
      triggerBattleEffect(text, autoCls || cls);
    }

    // 戦闘エフェクト発火
    function triggerBattleEffect(text, cls) {
      // エフェクトを表示するターゲット要素を決定
      const isMon = /が現れた|の攻撃|ダメージ.*残/.test(text) && !/回復/.test(text);
      const targetSel = isMon ? '.bo-hp-card' : '#bo-monster-area';

      // テキストからエフェクト種別を決定
      let effectType = null;
      let dmgNum = null;
      const dmgMatch = text.match(/(\d+)\s*ダメージ/);
      if (dmgMatch) dmgNum = dmgMatch[1];

      if (/クリティカル/.test(text)) { effectType = 'crit'; }
      else if (/魔法|呪文|詠唱|魔弾|炎|氷|雷|水|光|闇/.test(text)) { effectType = 'magic'; }
      else if (/回復|ヒール/.test(text)) { effectType = 'heal'; }
      else if (/ダメージ|斬|突|打|射/.test(text)) { effectType = 'slash'; }

      if (!effectType) return;

      // エフェクトを各対象カードに表示
      const cards = isMon
        ? [document.getElementById('bo-monster-area')]
        : [...document.querySelectorAll('.bo-hp-card')].filter(c => {
          // ダメージを受けたキャラ名がテキストに含まれているか
          const nameEl = c.querySelector('.card-name');
          return nameEl && text.includes(nameEl.textContent.trim());
        });

      (cards.length ? cards : [isMon ? document.getElementById('bo-monster-area') : null]).forEach(card => {
        if (!card) return;
        card.style.position = 'relative';

        // カードシェイク
        card.classList.remove('shaking', 'hit');
        void card.offsetWidth; // reflow
        if (effectType === 'heal') { card.classList.add('shaking'); }
        else { card.classList.add('shaking', 'hit'); }

        // エフェクトレイヤー
        let layer = card.querySelector('.battle-effect-layer');
        if (!layer) {
          layer = document.createElement('div');
          layer.className = 'battle-effect-layer';
          card.appendChild(layer);
        }
        layer.innerHTML = '';

        const eff = document.createElement('div');
        if (effectType === 'crit') eff.className = 'effect-crit';
        if (effectType === 'magic') eff.className = 'effect-magic';
        if (effectType === 'slash') eff.className = 'effect-slash';
        if (effectType === 'heal') { eff.className = 'effect-heal'; eff.textContent = '✨'; }
        layer.appendChild(eff);

        // フロートダメージ数値
        if (dmgNum) {
          const floatEl = document.createElement('div');
          floatEl.className = 'float-dmg-num';
          floatEl.textContent = (effectType === 'crit' ? '💥 ' : '') + dmgNum;
          floatEl.style.left = (30 + Math.random() * 40) + '%';
          floatEl.style.top = (20 + Math.random() * 30) + '%';
          floatEl.style.color = effectType === 'crit' ? '#ff8c00' : effectType === 'heal' ? '#40ff80' : '#ffe0a0';
          layer.appendChild(floatEl);
        }

        // アニメーション終了後にクリア
        setTimeout(() => {
          layer.innerHTML = '';
          card.classList.remove('shaking', 'hit');
        }, 900);
      });
    }

    function loadDeadChars() {
      try { DEAD_CHARS = new Set(JSON.parse(localStorage.getItem('pomera_dead') || '[]')); } catch (e) { DEAD_CHARS = new Set(); }
    }
    function saveDeadChars() { localStorage.setItem('pomera_dead', JSON.stringify([...DEAD_CHARS])); }
    function loadXpLv() {
      try { CHAR_XP = JSON.parse(localStorage.getItem('pomera_xp') || '{}'); } catch (e) { CHAR_XP = {}; }
      try { CHAR_LV = JSON.parse(localStorage.getItem('pomera_lv') || '{}'); } catch (e) { CHAR_LV = {}; }
    }
    function saveXpLv() {
      localStorage.setItem('pomera_xp', JSON.stringify(CHAR_XP));
      localStorage.setItem('pomera_lv', JSON.stringify(CHAR_LV));
    }
    function getCharLv(id) { return CHAR_LV[id] || 1; }
    function getCharXp(id) { return CHAR_XP[id] || 0; }
    function getXpToNextLv(lv) { return lv * 100; }  // LVごとに必要XP増加
    function addXp(char, xp) {
      const id = char.id;
      CHAR_XP[id] = (CHAR_XP[id] || 0) + xp;
      const curLv = CHAR_LV[id] || 1;
      const needed = getXpToNextLv(curLv);
      if (CHAR_XP[id] >= needed) {
        CHAR_XP[id] -= needed;
        CHAR_LV[id] = curLv + 1;
        saveXpLv();
        return curLv + 1; // 新しいレベルを返す
      }
      saveXpLv();
      return null; // レベルアップなし
    }
    // パーマデス処理
    function markCharDead(char) {
      DEAD_CHARS.add(char.id);
      saveDeadChars();
      PARTY = PARTY.filter(c => c.id !== char.id);
      savePartyToStorage();
    }

    // 宝笱フロア判定（F3,F8,F13）
    function isTreasureFloor(floor) { return floor === 3 || floor === 8 || floor === 13; }
    // ボスフロア判定（中ボス: F7, F9 / 大ボス: F5, F10, F15）
    function isBossFloor(floor) { return floor === 5 || floor === 7 || floor === 9 || floor === 10 || floor === 15; }
    function getBossData(floor) {
      if (floor === 5) return MONSTER_MASTER.boss[0];
      if (floor === 7) return MONSTER_MASTER.boss[1];
      if (floor === 9) return MONSTER_MASTER.boss[2];
      if (floor === 10) return MONSTER_MASTER.boss[3];
      if (floor === 15) return MONSTER_MASTER.boss[4];
      return null;
    }

    // ---------- スキルツリー ----------
    // CHAR_SKILLPATH[charId] = { slot1: null|'offense'|'defense'|'support', slot2: null|... }
    let CHAR_SKILLPATH = {};
    const SKILL_PATH_DEF = [
      { id: 'offense', label: '⚔ 攻撃強化', desc: 'ATK・MAG 威力 +20%', color: '#d04030', icon: '⚔' },
      { id: 'defense', label: '🛡 防御特化', desc: 'DEF +6 / 被ダメ -15%', color: '#4080c0', icon: '🛡' },
      { id: 'support', label: '✨ 補助熟練', desc: '回復・デバフ効果 +30%', color: '#9060c0', icon: '✨' }
    ];
    function loadSkillPathFromStorage() {
      try { CHAR_SKILLPATH = JSON.parse(localStorage.getItem('pomera_skillpath') || '{}'); } catch (e) { CHAR_SKILLPATH = {}; }
    }
    function saveSkillPathToStorage() {
      localStorage.setItem('pomera_skillpath', JSON.stringify(CHAR_SKILLPATH));
    }
    function getSkillPath(charId) {
      return CHAR_SKILLPATH[charId] || { slot1: null, slot2: null };
    }

    function getMonsterPool(floor) {
      if (floor >= 16) return MONSTER_MASTER.deep;
      if (floor >= 6) return MONSTER_MASTER.mid;
      return MONSTER_MASTER.early;
    }

    function selectMonster(floor) {
      if (isBossFloor(floor)) return getBossData(floor);
      const pool = getMonsterPool(floor);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    let IS_BATTLE_ACTIVE = false; // バトル多重起動防止

    function startDungeon() {
      if (PARTY.length === 0) return;
      if (IS_BATTLE_ACTIVE) return;
      IS_BATTLE_ACTIVE = true;
      const btn = document.getElementById('dungeon-btn');
      if (btn) { btn.disabled = true; btn.textContent = '⚔ 戦闘中...'; }

      // エンチャント「記憶」でCP消費削減
      const hasMemory = PARTY.some(c =>
        Object.values(EQUIPPED[c.id] || {}).some(e => e && e.enchant && e.enchant.id === 'memory')
      );
      const cpCost = hasMemory ? 3 : 5;
      if (!spendCP(cpCost)) {
        IS_BATTLE_ACTIVE = false;
        refreshDungeonBtn();
        addBattleLog('CPが足りない！ダンジョンに入れない...', 'log-defeat');
        return;
      }

      DUNGEON_FLOOR++;
      saveFloorToStorage();

      const pool = getMonsterPool(DUNGEON_FLOOR);
      const monsterBase = isBossFloor(DUNGEON_FLOOR) ? getBossData(DUNGEON_FLOOR) : pool[Math.floor(Math.random() * pool.length)];
      const bossScale = monsterBase.isBoss ? 1.0 : 1.0; // ボスは固定スケール
      const scale = monsterBase.isBoss ? 1.0 : (DUNGEON_FLOOR >= 16 ? 1.8 : DUNGEON_FLOOR >= 6 ? 1.3 : 1.0);
      const monMaxHp = Math.round(monsterBase.hp * scale);
      const monAtk = Math.round(monsterBase.atk * scale);
      const monster = { ...monsterBase, hp: monMaxHp, atk: monAtk };
      window._currentBattleMonster = monster; // 称号カード用

      const floorLabel = (DUNGEON_FLOOR >= 16 ? '深層' : DUNGEON_FLOOR >= 6 ? '中層' : '浅層') + ' F' + DUNGEON_FLOOR;

      // 各キャラの現在HP管理（個別トラッキング）
      const charHp = {};
      const charDef = {}; // 防御中フラグ
      const charMaxHp = {};
      const monsterDebuffs = {}; // { atk: multiplier, duration }
      initBattleMana();

      const livingParty = () => PARTY.filter(c => (charHp[c.id] || 0) > 0 && !DEAD_CHARS.has(c.id));

      for (const c of PARTY) {
        const eff = getEffectiveStats(c);
        charHp[c.id] = eff.HP;
        charMaxHp[c.id] = eff.HP;
      }
      let monHp = monMaxHp;
      let comboUsed = new Set();
      let turn = 0;
      let delay = 0;
      const D = 600; // ターン間隔ms

      openBattleOverlay(floorLabel, monster, PARTY);

      const schedule = (fn, d) => { setTimeout(fn, d); };

      const doLog = (text, cls, d) => schedule(() => boLog(text, cls), d);
      const doMonHp = (hp, d) => schedule(() => updateMonsterHpBar(hp, monMaxHp), d);
      const doCharHp = (id, hp, d) => schedule(() => updatePartyHpBar(id, hp, charMaxHp[id]), d);
      const doAct = (id, state, d) => schedule(() => setMemberActing(id, state), d);

      doLog('── ' + floorLabel + ' 突入 ──', 'log-system', delay += 200);
      doLog(PARTY.map(c => c.icon + c.name).join('、') + ' が先頭に立った。', 'log-system', delay += 300);
      doLog(monster.icon + ' 【' + monster.name + '】が現れた！ HP:' + monHp, '', delay += 500);

      const MAX_TURNS = 30;

      const runTurn = () => {
        turn++;
        if (turn > MAX_TURNS || monHp <= 0 || livingParty().length === 0) {
          endBattle(monHp <= 0, delay);
          return;
        }

        tickCooldowns();

        // ── 合技チャレンジ ──
        const comboResult = chooseCombo(livingParty(), comboUsed, monHp);
        if (comboResult && monHp > 0) {
          const { combo, charA, charB } = comboResult;
          comboUsed.add(combo.id);
          const effA = getEffectiveStats(charA);
          const effB = getEffectiveStats(charB);
          spendMana(charA.id, combo.mpCost / 2);
          spendMana(charB.id, combo.mpCost / 2);
          doLog('【合技！】' + combo.icon + ' ' + combo.name + '  ' + charA.name + ' × ' + charB.name + ' 発動！', 'log-combo', delay += 500);
          if (combo.fortress) {
            // 鉄壁の盟約: 次のダメージ 0 + HP回復
            for (const c of livingParty()) { charDef[c.id] = true; }
            const healAmt = Math.round((effA.CON + effB.CON) * 1.5);
            for (const c of livingParty()) {
              charHp[c.id] = Math.min(charMaxHp[c.id], charHp[c.id] + healAmt);
              doCharHp(c.id, charHp[c.id], delay += 100);
            }
            doLog('   パーティー全体を守りながら ' + healAmt + ' HP 回復！', 'log-heal', delay += 300);
          } else if (combo.hits) {
            let totalDmg = 0;
            for (let h = 0; h < combo.hits; h++) {
              const baseDmg = (effA.ATK + effB.ATK) * combo.dmgMul;
              const dmg = Math.max(1, Math.round(baseDmg * (0.85 + Math.random() * 0.3)));
              monHp = Math.max(0, monHp - dmg);
              totalDmg += dmg;
              doMonHp(monHp, delay += 150);
            }
            doLog('   ' + combo.hits + '連撃 合計 ' + totalDmg + ' ダメージ！', 'log-combo', delay += 200);
          } else {
            const baseDmg = effA.ATK * combo.dmgMul + (combo.magBonus ? effB.MAG * combo.magBonus : 0) + effB.ATK * (combo.dmgMul || 1);
            const dmg = Math.max(1, Math.round(baseDmg * (0.9 + Math.random() * 0.2)));
            monHp = Math.max(0, monHp - dmg);
            doMonHp(monHp, delay += 300);
            doLog('   ' + monster.name + ' に ' + dmg + ' ダメージ！（残HP:' + monHp + '）', 'log-combo', delay += 200);
          }
          if (monHp <= 0) { schedule(runTurn, delay += 200); return; }
        }

        // ── 各キャラのターン ──
        for (const attacker of livingParty()) {
          if (monHp <= 0) break;
          const eff = getEffectiveStats(attacker);
          const { type, skill } = chooseSkill(attacker, livingParty().reduce((s, c) => s + charHp[c.id], 0),
            PARTY.reduce((s, c) => s + (charMaxHp[c.id] || 0), 0), monHp, comboUsed);

          doAct(attacker.id, true, delay += 200);
          delay += 300;

          if (skill.heal) {
            // 回復スキル
            const healAmt = Math.round(eff.WIL * 3 * (0.9 + Math.random() * 0.2));
            spendMana(attacker.id, skill.mpCost);
            for (const c of livingParty()) { charHp[c.id] = Math.min(charMaxHp[c.id], charHp[c.id] + healAmt); doCharHp(c.id, charHp[c.id], delay += 80); }
            doLog(attacker.icon + attacker.name + ' ' + skill.icon + '【' + skill.name + '】 → 全員 +' + healAmt + ' HP 回復！', 'log-heal', delay += 100);
          } else if (skill.defend) {
            // 防御姿勢
            charDef[attacker.id] = true;
            doLog(attacker.icon + attacker.name + ' ' + skill.icon + '【' + skill.name + '】 → 防御態勢！', 'log-heal', delay += 100);
          } else if (skill.debuff) {
            // 呪縛
            spendMana(attacker.id, skill.mpCost);
            monsterDebuffs.atk = { mul: skill.debuffVal, turns: skill.duration || 2 };
            doLog(attacker.icon + attacker.name + ' ' + skill.icon + '【' + skill.name + '】 → ' + monster.name + ' の攻撃力 -30%！', 'log-magic', delay += 100);
          } else {
            // 攻撃スキル
            const hasFire = Object.values(EQUIPPED[attacker.id] || {}).some(e => e && e.enchant && e.enchant.id === 'fire');
            const isCrit = Math.random() < (0.1 + (eff.LUC || 0) * 0.003);
            const critMul = isCrit ? (hasFire ? 2.2 : 1.6) : 1.0;
            let baseDmg;
            if (type === 'magic') {
              spendMana(attacker.id, skill.mpCost);
              baseDmg = eff.MAG * skill.dmgMul;
            } else {
              baseDmg = eff.ATK * skill.dmgMul;
              if (skill.pierce) baseDmg *= 1.3; // 防御無視
            }
            // エンチャントボーナス
            const hasScholar = Object.values(EQUIPPED[attacker.id] || {}).some(e => e && e.enchant && e.enchant.id === 'scholar');
            if (hasScholar) baseDmg += eff.MAG * 0.25;
            const hasObliv = Object.values(EQUIPPED[attacker.id] || {}).some(e => e && e.enchant && e.enchant.id === 'oblivion');
            const completedTasks = ALL_QUESTS.filter(q => q.status === '完了').length;
            if (hasObliv) baseDmg += completedTasks * 2;

            if (skill.hits) {
              // 複数ヒット
              let total = 0;
              for (let h = 0; h < skill.hits; h++) {
                const dmg = Math.max(1, Math.round(baseDmg * (0.8 + Math.random() * 0.4) * critMul));
                monHp = Math.max(0, monHp - dmg);
                total += dmg;
                doMonHp(monHp, delay += 120);
              }
              const critTxt = isCrit ? '【会心】' : '';
              doLog(attacker.icon + attacker.name + ' ' + skill.icon + '【' + skill.name + '】' + critTxt + ' → ' + skill.hits + '回ヒット 合計 ' + total + ' ダメージ！', skill.logCls, delay += 150);
            } else {
              const dmg = Math.max(1, Math.round(baseDmg * (0.85 + Math.random() * 0.3) * critMul));
              monHp = Math.max(0, monHp - dmg);
              doMonHp(monHp, delay += 200);
              const critTxt = isCrit ? '【会心】' : skill.elem ? '【' + skill.elem + '術】' : '';
              doLog(attacker.icon + attacker.name + ' ' + skill.icon + '【' + skill.name + '】' + critTxt + ' → ' + monster.name + ' に ' + dmg + ' ダメージ（残:' + monHp + '）', skill.logCls, delay += 150);
            }
            if (skill.cooldown) { SKILL_COOLDOWN[attacker.id][skill.id] = skill.cooldown; }
          }
          doAct(attacker.id, false, delay += 100);
          if (monHp <= 0) break;
        }

        // ── 敵のターン ──
        if (monHp > 0 && livingParty().length > 0) {
          const atkMul = monsterDebuffs.atk ? monsterDebuffs.atk.mul : 1.0;
          if (monsterDebuffs.atk) { monsterDebuffs.atk.turns--; if (monsterDebuffs.atk.turns <= 0) delete monsterDebuffs.atk; }
          const targets = livingParty();
          const target = targets[Math.floor(Math.random() * targets.length)];
          const rawDmg = Math.max(1, Math.round(monster.atk * atkMul * (0.85 + Math.random() * 0.3)));
          const isBlocked = charDef[target.id];
          const actualDmg = isBlocked ? 0 : rawDmg;
          // 守護エンチャント
          const guardHeal = PARTY.reduce((s, c) => {
            const hasG = Object.values(EQUIPPED[c.id] || {}).some(e => e && e.enchant && e.enchant.id === 'guard');
            return s + (hasG ? 3 : 0);
          }, 0);

          charHp[target.id] = Math.max(0, charHp[target.id] - actualDmg);
          if (guardHeal > 0) charHp[target.id] = Math.min(charMaxHp[target.id], charHp[target.id] + guardHeal);
          doCharHp(target.id, charHp[target.id], delay += 300);

          // 防御リセット
          for (const id of Object.keys(charDef)) delete charDef[id];

          let atkMsg = monster.icon + '【' + monster.name + '】 → ' + target.name + ' に ';
          if (isBlocked) {
            atkMsg += '攻撃！ → 防御！ 0ダメージ';
            doLog(atkMsg, 'log-enemy', delay += 200);
          } else {
            atkMsg += rawDmg + ' ダメージ！（HP:' + charHp[target.id] + '）';
            if (guardHeal > 0) atkMsg += '（守護 +' + guardHeal + '）';
            doLog(atkMsg, 'log-enemy', delay += 200);
          }

          // 死亡判定
          if (charHp[target.id] <= 0) {
            doLog('💀 ' + target.icon + target.name + ' が倒れた...！', 'log-death', delay += 300);
            schedule(() => {
              setMemberDead(target.id);
              markCharDead(target);
              // 死亡フラッシュ
              const flash = document.createElement('div');
              flash.className = 'death-flash';
              document.body.appendChild(flash);
              setTimeout(() => flash.remove(), 1000);
              addBattleLog('💀 ' + target.icon + target.name + ' は永遠に倒れた...', 'log-defeat');
            }, delay);
          }
        }

        // 次のターンへ
        schedule(runTurn, delay += 400);
      };

      const endBattle = (victory, d) => {
        if (victory) {
          doLog('', 'log-system', d += 300);
          doLog('━━━━━━━━━━━━━━━━━━━━━━━━━━', 'log-system', d += 100);
          doLog('⚔ ' + monster.name + ' を撃破！', 'log-victory', d += 300);
          const cpReward = Math.round((8 + Math.floor(Math.random() * 8)) * scale);
          schedule(() => gainCP(cpReward, 'ダンジョン報酬'), d + 100);
          doLog('報酬: CP +' + cpReward, 'log-system', d += 400);

          // 経験値付与（生存者のみ）
          const xpGain = Math.round((40 + DUNGEON_FLOOR * 20) * scale);
          const survivors = PARTY.filter(c => charHp[c.id] > 0);
          for (const c of survivors) {
            const newLv = addXp(c, xpGain);
            doLog('  ✦ ' + c.name + ' +' + xpGain + ' XP', 'log-system', d += 200);
            if (newLv) {
              // レベルアップ！
              doLog('  🎉 ' + c.name + ' → Lv' + newLv + ' ！ランダム能力上昇！', 'log-levelup', d += 200);
              schedule(() => {
                // ランダム基本属性 +1~2
                const attrKeys = ['STR', 'CON', 'DEX', 'PER', 'LER', 'WIL', 'MAG', 'CHR', 'LUC'];
                const key = attrKeys[Math.floor(Math.random() * attrKeys.length)];
                c.stats[key] = (c.stats[key] || 10) + 1 + Math.floor(Math.random() * 2);
                // 派生ステータス再計算
                c.stats.HP = c.stats.CON * 5 + c.stats.WIL * 2 + 20;
                c.stats.MANA = c.stats.MAG * 3 + c.stats.WIL * 2 + 10;
                c.stats.ATK = c.stats.STR * 2 + Math.floor(c.stats.DEX / 2);
                c.stats.DEF = c.stats.CON * 2 + Math.floor(c.stats.STR / 3);
                c.stats.SPD = c.stats.DEX + Math.floor(c.stats.PER / 2);
                // レベルアップフラッシュ
                const flash = document.createElement('div');
                flash.className = 'levelup-flash';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 1200);
              }, d);
            }
          }

          // ドロップ判定（55%）
          if (Math.random() < 0.55) {
            const eq = generateEquipment(DUNGEON_FLOOR);
            if (INVENTORY.length < 50) {
              INVENTORY.push(eq);
              saveInventoryToStorage();
              const rd = eq.rarityData;
              doLog('━━━━━━━━━━━━━━━━━━━━━━━━━━', 'log-system', d += 300);
              doLog('✨ ドロップ！  ' + rd.icon + ' ' + eq.name + '  [' + rd.label + ']', 'log-victory', d += 200);
              const statStr = Object.entries(eq.stat).map(([k, v]) => '+' + k + ':' + v).join(' ');
              doLog('   ' + statStr + (eq.enchant ? '  ✨ ' + eq.enchant.label : ''), 'log-system', d += 150);
              schedule(() => { renderInventoryPanel(); }, d + 200);
            } else {
              doLog('インベントリが満杯！', 'log-defeat', d += 300);
            }
          }
          doLog('── F' + DUNGEON_FLOOR + ' 踏破 ──', 'log-system', d += 500);
          schedule(() => {
            addBattleLog('⚔ F' + DUNGEON_FLOOR + ' 踏破！ ' + monster.name + ' を倒した！', 'log-victory');
            // 中ボス特別ボーナス
            if (monster.isMidBoss) {
              gainCP(10, '中ボス討伐ボーナス');
              addBattleLog('🏆 中ボス討伐！ボーナスCP+10獲得！', 'log-victory');
            }
            // 緊急クエスト完了チェック
            const eqIdx = ALL_QUESTS.findIndex(q => q.id === 'emergency_cp' && q.status === '未着手');
            if (eqIdx >= 0) {
              ALL_QUESTS[eqIdx].status = '完了';
              gainCP(ALL_QUESTS[eqIdx].reward, '緊急クエスト「困窮の旅」完了');
              addBattleLog('⛏ 緊急クエスト「困窮の旅」達成！ CP+' + ALL_QUESTS[eqIdx].reward + '！', 'log-victory');
              renderQuestBoard();
            }
            saveFloorToStorage(); // HUD更新を含む
          }, d);
        } else {
          doLog('', 'log-system', d += 300);
          doLog('── パーティーが全滅した... ──', 'log-defeat', d += 200);
          DUNGEON_FLOOR = Math.max(1, DUNGEON_FLOOR - 1);
          saveFloorToStorage();
          schedule(() => addBattleLog('── 全滅... F' + DUNGEON_FLOOR + ' に戻った', 'log-defeat'), d);
        }
        schedule(() => {
          document.getElementById('bo-close-btn').style.display = '';
          IS_BATTLE_ACTIVE = false; // バトルフラグリセット
          refreshDungeonBtn();
          renderPartyPanel();
        }, d + 800);
      };

      // バトル開始
      schedule(runTurn, delay += 800);
    }

    function buildGameFromGraph(data) {
      if (!data || !data.nodes) return;

      // CP計算（ノード種別ごとの重み）
      let newCp = 0;
      const prevNodes = JSON.parse(localStorage.getItem('pomera_prev_nodes') || '[]');
      const prevIds = new Set(prevNodes);
      let isFirstLoad = prevIds.size === 0;

      data.nodes.forEach(n => {
        if (prevIds.has(n.id)) return; // 既にカウント済みのノードはスキップ
        if (n.type === '日記') newCp += 10;
        else if (n.type === 'タスク') newCp += 5;
        else if (n.type === '知見') newCp += 8;
        else if (n.type === '出来事') newCp += 4;
      });

      if (!isFirstLoad && newCp > 0) {
        setTimeout(() => gainCP(newCp, '新しい日記を検出'), 2000);
      } else if (isFirstLoad) {
        // 初回: 全ノード分のCPを計算してストック
        let initCp = 0;
        data.nodes.forEach(n => {
          if (n.type === '日記') initCp += 10;
          else if (n.type === 'タスク') initCp += 5;
          else if (n.type === '知見') initCp += 8;
          else if (n.type === '出来事') initCp += 4;
        });
        if (loadCP() === 0) {
          saveCP(initCp);
          setTimeout(() => { refreshCPDisplay(false); addBattleLog('📜 初回起動: CP ' + initCp + ' を取得しました', 'log-system'); }, 2000);
        }
      }
      localStorage.setItem('pomera_prev_nodes', JSON.stringify(data.nodes.map(n => n.id)));

      // キャラクター生成（全ノードから）
      // node.spriteUrl がある場合は customSpriteUrl として付与（日記ノード→キャラ生成システム）
      ALL_TRAVELERS = data.nodes
        .filter(n => n.id) // IDがあるノードのみ
        .map(n => {
          const char = generateCharacter(n);
          if (n.spriteUrl) {
            char.customSpriteUrl = n.spriteUrl;
          }
          return char;
        });

      // クエスト生成（タスクノードから）
      ALL_QUESTS = data.nodes
        .filter(n => n.type === 'タスク')
        .sort((a, b) => (a.status === '完了') - (b.status === '完了')); // 未完了を上に

      // ストレージから採用・パーティー・装備・インベントリを復元
      loadRecruitedFromStorage();
      loadPartyFromStorage();
      loadInventoryFromStorage();
      loadDeadChars();
      loadXpLv();
      loadEquippedFromStorage();
      loadFloorFromStorage();
      loadSkillPathFromStorage();
      checkDailyCP();

      // 描画
      refreshCPDisplay(false);
      renderTravelerList();
      renderQuestBoard();
      renderPartyPanel();
      renderInventoryPanel();


      // 起動メッセージ
      setTimeout(() => {
        addBattleLog('✦ POMERA WORLD へようこそ ✦', 'log-victory');
        addBattleLog('日記から ' + ALL_TRAVELERS.length + ' 人の旅人が生まれました。', 'log-system');
        addBattleLog('進行中のクエスト: ' + ALL_QUESTS.filter(q => q.status !== '完了').length + ' 件', 'log-system');
      }, 2500);
    }

      sadness: ['ゆっくり歩いている', '焚き火の前に座っている', '川を眺めている'],
      disgust: ['ぼんやり歩いている', '何か考え込んでいる'],
      anger: ['早足で歩き回っている', '一人で剣の稽古をしている'],
      neutral: ['散歩をしている', '通りを歩いている', '空を見上げている']
    };

    const LOG_MESSAGES = [
      'イルヴァの風が草原を揺らす...',
      '遠くで狼の遠吠えが聞こえる。',
      '焚き火が夜風に揺れている。',
      '石畳の道に月明かりが注いでいる。',

      '魔法使いは杖を握り直した。',
      '古い井戸から水を汲む音がする。',
      'どこかで扉が軋む音がした。',
      '空に星が瞬き始めた。',
    ];

    let currentMood = 'neutral';
    let logIdx = 0;

    // タイルマップ生成
    const MAP = [];
    const GRASS_VAR = []; // 草バリエーション用マップ
    // シード固定の疑似乱数 (タイルが毎回変わらないように)
    const seededRng = (x, y) => {
      const n = Math.sin(x * 127.1 + y * 311.7 + 47.0) * 43758.5453;
      return n - Math.floor(n);
    };
    // 石畳の道: T字路ネットワーク
    // 縦幹線: x=8〜9、y=3〜15（村中央の南北メイン通り）
    // 横幹線: y=7〜8、x=3〜15（村中央の東西クロス道）
    // 北西支線: x=4〜5、y=3〜7（塔への道）
    const isStone = (x, y) => (
      (x >= 8 && x <= 9 && y >= 3 && y <= 15) ||
      (y >= 7 && y <= 8 && x >= 3 && x <= 15) ||
      (x >= 4 && x <= 5 && y >= 3 && y <= 7)
    );
    for (let y = 0; y < MAP_H; y++) {
      MAP[y] = [];
      GRASS_VAR[y] = [];
      for (let x = 0; x < MAP_W; x++) {
        MAP[y][x] = isStone(x, y) ? 'stone' : 'grass';
        // 草バリエーション: 0=標準草, 1=石混じり, 2=花バリ
        const r = seededRng(x, y);
        GRASS_VAR[y][x] = r < 0.50 ? 'grass' : r < 0.78 ? 'grass2' : 'grass3';
      }
    }

    // アイソメ座標変換
    function isoToScreen(tx, ty, cx, cy) {
      return {
        x: cx + (tx - ty) * TW,
        y: cy + (tx + ty) * TH / 2
      };
    }

    // NPC画像を前処理（左半分切り出し + フラッドフィルで背景透明化）
    function prepareNpcTexture(scene, key) {
      const tex = scene.textures.get(key);
      const src = tex.getSourceImage();
      const halfW = Math.floor(src.width / 2);
      const h = src.height;

      // 左半分だけ切り出す
      const canvas = document.createElement('canvas');
      canvas.width = halfW;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(src, 0, 0, halfW, h, 0, 0, halfW, h);

      const imgData = ctx.getImageData(0, 0, halfW, h);
      const d = imgData.data;
      const W = halfW, H = h;

      // --- フラッドフィル方式 ---
      // 四隅・四辺のピクセル色から背景色を判定し、類似色を透明化
      function colorDist(i1, i2) {
        return Math.abs(d[i1] - d[i2]) + Math.abs(d[i1 + 1] - d[i2 + 1]) + Math.abs(d[i1 + 2] - d[i2 + 2]);
      }
      const visited = new Uint8Array(W * H);
      const queue = [];
      // 四辺のピクセルをすべてキューに入れる
      for (let x = 0; x < W; x++) {
        queue.push(x, 0); queue.push(x, H - 1);
      }
      for (let y = 1; y < H - 1; y++) {
        queue.push(0, y); queue.push(W - 1, y);
      }
      let qi = 0;
      while (qi < queue.length) {
        const px = queue[qi++], py = queue[qi++];
        const idx = (py * W + px);
        if (visited[idx]) continue;
        visited[idx] = 1;
        const base = idx * 4;
        if (d[base + 3] < 10) continue; // 既に透明
        const r = d[base], g = d[base + 1], b = d[base + 2];
        const bright = (r + g + b) / 3;
        const contrast = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
        // 明るい・コントラストの低いピクセルを背景とみなす
        if (bright < 80 || contrast > 50) continue;
        d[base + 3] = 0;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const nx = px + dx, ny = py + dy;
          if (nx >= 0 && nx < W && ny >= 0 && ny < H && !visited[ny * W + nx]) {
            queue.push(nx, ny);
          }
        }
      }
      // 単純閾値でも追加透明化（チェッカー柄の孤立ピクセル）
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 10) continue;
        const bright = (d[i] + d[i + 1] + d[i + 2]) / 3;
        const contrast = Math.max(Math.abs(d[i] - d[i + 1]), Math.abs(d[i + 1] - d[i + 2]), Math.abs(d[i] - d[i + 2]));
        if (bright > 160 && contrast < 25) d[i + 3] = 0;
      }
      ctx.putImageData(imgData, 0, 0);

      // 新しいキーで登録（元キーを置き換え）
      scene.textures.remove(key);
      scene.textures.addCanvas(key, canvas);
    }

    // ===== Phaser シーン =====
    class MainScene extends Phaser.Scene {
      constructor() {
        super({ key: 'MainScene' });
        this.tileImages = [];
        this.objImages = [];
        this.charSprite = null;
        this.fireSprite = null;
        this.skyGfx = null;
        this.overlayGfx = null;
        this.charTx = 9;
        this.charTy = 8;
        this.charDir = 1;
        this.charTargetX = 9;
        this.charTargetY = 8;
        this.charMoving = false;
        this.tick = 0;
        this.cx = 0;
        this.cy = 0;
      }

        const lb = document.getElementById('lb');
        const lstat = document.getElementById('lstat');

        this.load.on('complete', () => { lstat.textContent = '完了!'; });
        // CORSエラーや読み込み失敗があっても続行するためにエラーを無視
        this.load.on('loaderror', (file) => {
          console.warn('Load error (ignored):', file.key, file.src);
        });

        const ts = Date.now();
        this.load.image('grass', `./sprites/grass.png?v=${ts}`);
        this.load.image('grass2', `./sprites/grass2.png?v=${ts}`);
        this.load.image('grass3', `./sprites/grass3.png?v=${ts}`);
        this.load.image('stone', `./sprites/stone.png?v=${ts}`);
        this.load.image('house', `./sprites/house.png?v=${ts}`);
        this.load.image('tower', `./sprites/tower.png?v=${ts}`);
        this.load.image('tree', `./sprites/tree.png?v=${ts}`);
        this.load.image('well', `./sprites/well.png?v=${ts}`);
        this.load.spritesheet('char', `./sprites/char.png?v=${ts}`,
          { frameWidth: Math.round(640 / 3), frameHeight: Math.round(640 / 2) });
        this.load.spritesheet('fire', `./sprites/fire.png?v=${ts}`,
          { frameWidth: Math.round(640 / 4), frameHeight: Math.round(640 / 2) });

        // NPCスプライト
        this.load.image('npc_luna', `./assets/npc_luna.png?v=${ts}`);
        this.load.image('npc_kronos', `./assets/npc_kronos.png?v=${ts}`);
        this.load.image('npc_lion', `./assets/npc_lion.png?v=${ts}`);
        this.load.image('npc_sou', `./assets/npc_sou.png?v=${ts}`);

        this.load.json('daily', './daily_graph.json');

        // ★ フォールバック: 5秒経ってもローディング画面が消えない場合は強制非表示
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading && loading.style.display !== 'none') {
            console.warn('Loading timeout - force hiding loading screen');
            loading.classList.add('out');
            setTimeout(() => { loading.style.display = 'none'; }, 1100);
          }
        }, 5000);
      }


      create() {
        const W = this.scale.width;
        const H = this.scale.height;
        this.cx = W / 2;
        // マップ全体が収まるようにcy調整
        // マップの高さ = (MAP_W+MAP_H) * TH/2 = 36*32 = 1152px → 画面に収める
        this.cy = H * 0.01;

        // NPC背景を除去（フラッドフィル方式）
        ['npc_luna', 'npc_kronos', 'npc_lion', 'npc_sou'].forEach(k => prepareNpcTexture(this, k));

        // 感情ロード
        const data = this.cache.json.get('daily');
        if (data) {
          const em = this.extractEmotion(data);
          if (em) currentMood = em;
        }
        this.updateHUD();

        // 背景グラフィクス
        this.bgGfx = this.add.graphics().setDepth(-200);
        this.skyGfx = this.add.graphics().setDepth(-100);
        this.hillGfx = this.add.graphics().setDepth(-99);
        this.starGfx = this.add.graphics().setDepth(-98);
        this.overlayGfx = this.add.graphics().setDepth(9000);
        // 噴水用グラフィクス（アニメーション）
        this.fountainGfx = this.add.graphics().setDepth(200);

        // タイル間の隙間を埋める地面グラフィック（depth -101: タイルの下）
        const groundGfx = this.add.graphics().setDepth(-101);
        groundGfx.fillStyle(0x2a4214, 1); // Elin風の深い暗緑
        // アイソメ全域の菱形を塗りつぶす
        const tl = isoToScreen(0, 0, this.cx, this.cy);
        const tr = isoToScreen(MAP_W, 0, this.cx, this.cy);
        const br = isoToScreen(MAP_W, MAP_H, this.cx, this.cy);
        const bl = isoToScreen(0, MAP_H, this.cx, this.cy);
        groundGfx.fillTriangle(tl.x, tl.y, tr.x, tr.y, br.x, br.y);
        groundGfx.fillTriangle(tl.x, tl.y, br.x, br.y, bl.x, bl.y);

        // タイル配置
        for (let ty = 0; ty < MAP_H; ty++) {
          for (let tx = 0; tx < MAP_W; tx++) {
            const p = isoToScreen(tx, ty, this.cx, this.cy);
            // 草タイルはバリエーションをランダムに使用
            const baseKey = MAP[ty][tx];
            const key = baseKey === 'grass' ? GRASS_VAR[ty][tx] : baseKey;
            const img = this.add.image(p.x, p.y, key);
            img.setDisplaySize(TW * 2, TW);
            img.setDepth(tx + ty - 100);
          }
        }


        // オブジェクト配置（建物・塔・木・井戸）
        // 家: 北エリアにクラスター（村の北区）+ 南区に1軒
        // 塔: 北西・北東の見張り台
        // 木: 北西コーナー群（森の入口）・南東コーナー群 + 道沿い点在
        // 井戸: 家の近くの生活感ある位置
        const OBJS = [
          { t: 'house', x: 7, y: 4, scale: 0.48, smoke: true },
          { t: 'house', x: 10, y: 4, scale: 0.48, smoke: true },
          { t: 'house', x: 11, y: 6, scale: 0.48, smoke: false },
          { t: 'house', x: 6, y: 12, scale: 0.48, smoke: true },
          { t: 'tower', x: 2, y: 2, scale: 0.38 },
          { t: 'tower', x: 15, y: 2, scale: 0.38 },
          // 北西の森クラスター
          { t: 'tree', x: 1, y: 4, scale: 0.42 },
          { t: 'tree', x: 2, y: 6, scale: 0.38 },
          { t: 'tree', x: 3, y: 5, scale: 0.40 },
          // 南東の森クラスター
          { t: 'tree', x: 14, y: 12, scale: 0.42 },
          { t: 'tree', x: 15, y: 14, scale: 0.38 },
          { t: 'tree', x: 13, y: 13, scale: 0.40 },
          // 道沿いの孤立した木
          { t: 'tree', x: 6, y: 9, scale: 0.36 },
          { t: 'tree', x: 11, y: 10, scale: 0.36 },
          // 井戸: 家クラスターの近く（北区の路地）
          { t: 'well', x: 7, y: 6, scale: 0.35 },
        ];
        this.smokeEmitters = [];
        OBJS.forEach(o => {
          const p = isoToScreen(o.x, o.y, this.cx, this.cy);
          const img = this.add.image(p.x, p.y + TH * 0.25, o.t);
          const tex = this.textures.get(o.t);
          const src = tex.getSourceImage();
          img.setDisplaySize(src.width * o.scale, src.height * o.scale);
          img.setOrigin(0.5, 1.0);
          img.setDepth(o.x + o.y);

          // 煙エフェクト（建物のみ）
          if (o.smoke) {
            const smokeData = {
              x: p.x - 4,
              y: p.y - src.height * o.scale * 0.85,
              particles: [],
              timer: Math.random() * 60
            };
            this.smokeEmitters.push(smokeData);
          }
        });

        // 小物: 岩・花・キノコ・草むらをランダム散布（80個）
        const rng = (n) => (Math.sin(n * 127.1 + 311.7) * 0.5 + 0.5);
        const FLOWER_COLORS = [0xff5555, 0xffcc33, 0xffffff, 0xff88cc, 0xcc88ff, 0x88ccff];
        for (let i = 0; i < 80; i++) {
          const rx = Math.floor(rng(i * 5 + 1) * MAP_W);
          const ry = Math.floor(rng(i * 5 + 2) * MAP_H);
          if (rx < 0 || rx >= MAP_W || ry < 0 || ry >= MAP_H) continue;
          if (MAP[ry][rx] !== 'grass') continue;
          const occupied = OBJS.some(o => Math.abs(o.x - rx) < 1.5 && Math.abs(o.y - ry) < 1.5);
          if (occupied) continue;
          const p = isoToScreen(rx, ry, this.cx, this.cy);
          const gfx = this.add.graphics();
          gfx.setDepth(rx + ry - 0.5);
          const kind = i % 8;
          if (kind === 0) {
            // 大岩群
            gfx.fillStyle(0x909080, 1); gfx.fillEllipse(p.x, p.y + 2, 24, 14);
            gfx.fillStyle(0x787868, 1); gfx.fillEllipse(p.x + 8, p.y - 1, 16, 11);
            gfx.fillStyle(0x606050, 1); gfx.fillEllipse(p.x - 6, p.y, 12, 9);
            gfx.fillStyle(0xb8b8a8, 0.6); gfx.fillEllipse(p.x - 2, p.y - 1, 6, 4);
          } else if (kind === 1) {
            // 小石
            gfx.fillStyle(0x7a7a6a, 1); gfx.fillEllipse(p.x, p.y + 1, 10, 7);
            gfx.fillStyle(0x9a9a8a, 0.7); gfx.fillEllipse(p.x - 2, p.y, 4, 3);
          } else if (kind === 2) {
            // 赤・黄・白・ピンク花
            const fc = FLOWER_COLORS[i % FLOWER_COLORS.length];
            gfx.fillStyle(0x2a6820, 1); gfx.fillRect(p.x - 1, p.y - 7, 2, 8);
            gfx.fillStyle(fc, 1);
            gfx.fillCircle(p.x - 3, p.y - 8, 3); gfx.fillCircle(p.x + 3, p.y - 8, 3);
            gfx.fillCircle(p.x, p.y - 11, 3); gfx.fillCircle(p.x, p.y - 5, 3);
            gfx.fillStyle(0xffee44, 1); gfx.fillCircle(p.x, p.y - 8, 2.5);
          } else if (kind === 3) {
            // 紫の野花（小さめ）
            gfx.fillStyle(0x2a6820, 1); gfx.fillRect(p.x, p.y - 5, 1, 6);
            gfx.fillStyle(0xcc88ff, 1); gfx.fillCircle(p.x, p.y - 6, 2.5);
            gfx.fillStyle(0xffffff, 0.8); gfx.fillCircle(p.x, p.y - 6, 1);
          } else if (kind === 4) {
            // 赤キノコ（白水玉）
            gfx.fillStyle(0xcc2020, 1); gfx.fillEllipse(p.x, p.y - 7, 14, 10);
            gfx.fillStyle(0xf8f8f8, 0.9); gfx.fillCircle(p.x - 3, p.y - 9, 2);
            gfx.fillStyle(0xf8f8f8, 0.9); gfx.fillCircle(p.x + 3, p.y - 7, 1.5);
            gfx.fillStyle(0xfff0c0, 1); gfx.fillRect(p.x - 2, p.y - 4, 4, 5);
          } else if (kind === 5) {
            // 茶キノコ
            gfx.fillStyle(0x885533, 1); gfx.fillEllipse(p.x, p.y - 6, 12, 8);
            gfx.fillStyle(0xc09060, 0.5); gfx.fillEllipse(p.x - 1, p.y - 7, 5, 3);
            gfx.fillStyle(0xd0b088, 1); gfx.fillRect(p.x - 2, p.y - 3, 4, 4);
          } else if (kind === 6) {
            // 草むら（たっぷり）
            gfx.fillStyle(0x1e6018, 0.85); gfx.fillEllipse(p.x, p.y + 2, 26, 10);
            gfx.fillStyle(0x2e8025, 1);
            gfx.fillTriangle(p.x - 6, p.y + 2, p.x - 10, p.y - 7, p.x - 3, p.y - 4);
            gfx.fillTriangle(p.x - 1, p.y, p.x - 2, p.y - 9, p.x + 3, p.y - 5);
            gfx.fillTriangle(p.x + 5, p.y + 1, p.x + 4, p.y - 8, p.x + 8, p.y - 4);
            gfx.fillStyle(0x48a838, 0.7);
            gfx.fillTriangle(p.x - 4, p.y - 1, p.x - 6, p.y - 8, p.x - 1, p.y - 5);
          } else {
            // 丸い低木
            gfx.fillStyle(0x1c5a14, 1); gfx.fillEllipse(p.x, p.y - 3, 22, 16);
            gfx.fillStyle(0x287820, 1); gfx.fillEllipse(p.x - 3, p.y - 5, 14, 11);
            gfx.fillStyle(0x38a030, 0.6); gfx.fillEllipse(p.x - 4, p.y - 7, 8, 6);
          }
        }

        // 噴水オブジェクト（東西交差点付近の広場中心）
        {
          const fx = 11, fy = 8;
          const fp = isoToScreen(fx, fy, this.cx, this.cy);
          this.fountainPos = { x: fp.x, y: fp.y };
          this.fountainBaseGfx = this.add.graphics().setDepth(fx + fy - 0.3);
          const pg = this.fountainBaseGfx;
          // 石の台座（アイソメ菱形風）
          pg.fillStyle(0xc0b898, 1);
          pg.fillEllipse(fp.x, fp.y + 4, 52, 22);
          pg.fillStyle(0xa09078, 1);
          pg.fillEllipse(fp.x, fp.y + 6, 44, 16);
          // 水盤
          pg.fillStyle(0x7098b8, 0.85);
          pg.fillEllipse(fp.x, fp.y + 2, 38, 14);
          pg.fillStyle(0x90bcd8, 0.5);
          pg.fillEllipse(fp.x - 3, fp.y, 16, 6);
          // 中央の柱
          pg.fillStyle(0xb0a888, 1);
          pg.fillRect(fp.x - 3, fp.y - 16, 6, 18);
          pg.fillStyle(0xd0c8a8, 1);
          pg.fillEllipse(fp.x, fp.y - 16, 10, 7);
        }

        // 煙パーティクルのGraphics
        this.smokeGfx = this.add.graphics().setDepth(5000);

        // 焚き火アニメーション
        this.anims.create({
          key: 'burn',
          frames: this.anims.generateFrameNumbers('fire', { start: 0, end: 7 }),
          frameRate: 8,
          repeat: -1
        });
        // 焚き火: 南区の集い場（NPCソウの近く、村の外れ）
        const fp = isoToScreen(12, 13, this.cx, this.cy);
        this.fireSprite = this.add.sprite(fp.x, fp.y + TH * 0.25, 'fire');
        this.fireSprite.setDisplaySize(72, 72);
        this.fireSprite.setOrigin(0.5, 1.0);
        this.fireSprite.setDepth(12 + 13 + 0.5);
        this.fireSprite.play('burn');

        // キャラクター
        this.anims.create({
          key: 'walk_right',
          frames: this.anims.generateFrameNumbers('char', { start: 0, end: 4 }),
          frameRate: 6,
          repeat: -1
        });
        this.anims.create({
          key: 'idle',
          frames: this.anims.generateFrameNumbers('char', { start: 0, end: 0 }),
          frameRate: 1,
          repeat: -1
        });
        const cp = isoToScreen(this.charTx, this.charTy, this.cx, this.cy);
        this.charSprite = this.add.sprite(cp.x, cp.y + TH * 0.25, 'char');
        this.charSprite.setDisplaySize(46, 58);
        this.charSprite.setOrigin(0.5, 1.0);
        this.charSprite.setDepth(this.charTx + this.charTy + 0.5);
        this.charSprite.play('idle');

        // 雨パーティクル
        this.rainGfx = this.add.graphics().setDepth(8000);

        // ローディング画面を消す
        const loading = document.getElementById('loading');
        this.time.delayedCall(300, () => {
          loading.classList.add('out');
          setTimeout(() => { loading.style.display = 'none'; }, 1100);
        });

        this.updatePanel(data);

        // NPC配置
        this.createNPCs();

        // キャラAIタイマー
        this.time.addEvent({ delay: 3000, loop: true, callback: this.pickNewTarget, callbackScope: this });

        // ログメッセージローテーション
        this.time.addEvent({ delay: 6000, loop: true, callback: this.rotateLog, callbackScope: this });

        // 初回描画
        this.drawSky();
        this.drawStars();
      }

      createNPCs() {
        NPCS.forEach(npc => {
          const p = isoToScreen(npc.tx, npc.ty, this.cx, this.cy);
          const depth = npc.tx + npc.ty + 0.6;
          const spriteKey = 'npc_' + npc.id;

          // 地面の影（楕円）
          const shadow = this.add.ellipse(p.x, p.y - 4, 34, 10, 0x000000, 0.22);
          shadow.setDepth(depth - 0.1);

          // prepareNpcTextureで左半分切り出し済みのテクスチャを使う
          const tex = this.textures.get(spriteKey);
          const src = tex.getSourceImage();
          const dispH = 60;
          const dispW = Math.round((src.width / src.height) * dispH);

          const npcImg = this.add.image(p.x, p.y, spriteKey);
          npcImg.setDisplaySize(dispW, dispH);
          npcImg.setOrigin(0.5, 1.0);
          npcImg.setDepth(depth);
          npcImg.setInteractive({ cursor: 'pointer' });
          npcImg.on('pointerover', () => { npcImg.setTint(0xffe080); });
          npcImg.on('pointerout', () => { npcImg.clearTint(); });
          npcImg.on('pointerdown', () => { showNpcDialog(npc); });

          // 名前ラベル
          const gameEl = document.getElementById('game-container');
          const lbl = document.createElement('div');
          lbl.className = 'npc-label';
          lbl.textContent = npc.icon + ' ' + npc.name;
          lbl.style.left = p.x + 'px';
          lbl.style.top = (p.y - dispH - 12) + 'px';
          gameEl.appendChild(lbl);
        });
      }

      extractEmotion(data) {
        const order = ['joy', 'trust', 'fear', 'surprise', 'sadness', 'disgust', 'anger', 'neutral'];
        if (!data || !data.nodes) return null;
        let best = null, bestScore = -1;
        data.nodes.forEach(n => {
          if (n.emotion) {
            const idx = order.indexOf(n.emotion);
            if (idx === -1) return;
            const score = (n.weight || 1) * (1 / (idx + 1));
            if (score > bestScore) { bestScore = score; best = n.emotion; }
          }
        });
        return best;
      }

      updateHUD() {
        const m = MOODS[currentMood];
        const hwx = document.getElementById('hwx');
        const hmood = document.getElementById('hmood');
        const hclock = document.getElementById('hclock');
        const pem = document.getElementById('pem');
        if (hwx) hwx.textContent = m.icon;
        if (hmood) hmood.textContent = m.label;
        const now = new Date();
        if (hclock) hclock.textContent =
          String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        if (pem) pem.innerHTML =
          '<div style="font-size:28px;text-align:center;margin:6px 0 4px;text-shadow:0 0 12px rgba(255,200,80,0.4)">' + m.icon + '</div>' +
          '<div style="font-size:11px;color:' + m.color + ';text-align:center;letter-spacing:3px;text-shadow:0 0 8px rgba(0,0,0,0.8)">' + m.label + '</div>';
      }

      updatePanel(data) {
        if (!data || !data.nodes || data.nodes.length === 0) {
          // daily_graph.jsonがない場合はデモモードで起動
          initDemoMode();
        } else {
          buildGameFromGraph(data);
          // 本番データがある場合もデモ旅人を補充（遊べるように）
          initDemoMode();
        }
      }


      rotateLog() {
        logIdx = (logIdx + 1) % LOG_MESSAGES.length;
        const logEl = document.getElementById('log-text');
        if (logEl) {
          logEl.style.opacity = '0';
          setTimeout(() => {
            logEl.textContent = LOG_MESSAGES[logIdx];
            logEl.style.opacity = '1';
            logEl.style.transition = 'opacity 0.8s';
          }, 400);
        }
      }

      pickNewTarget() {
        const acts = ACTIONS[currentMood] || ACTIONS.neutral;
        const act = acts[Math.floor(Math.random() * acts.length)];
        document.getElementById('pact').textContent = act;

        // ログに行動を追加
        const logEl = document.getElementById('log-text');
        if (logEl && Math.random() < 0.5) {
          logEl.style.opacity = '0';
          setTimeout(() => {
            logEl.textContent = '魔法使いが' + act + '。';
            logEl.style.opacity = '1';
            logEl.style.transition = 'opacity 0.8s';
          }, 300);
        }

        let nx, ny, tries = 0;
        do {
          const speed = currentMood === 'anger' ? 3 : currentMood === 'fear' ? 1 : 2;
          nx = Math.max(0, Math.min(MAP_W - 1, Math.round(this.charTx + (Math.random() - 0.5) * speed * 2)));
          ny = Math.max(0, Math.min(MAP_H - 1, Math.round(this.charTy + (Math.random() - 0.5) * speed * 2)));
          tries++;
        } while (MAP[ny][nx] === 'stone' && tries < 10);
        if (MAP[ny][nx] === 'stone') return;

        this.charTargetX = nx;
        this.charTargetY = ny;
        this.charDir = nx >= this.charTx ? 1 : -1;

        const duration = 2500 + Math.random() * 2000;
        const tp = isoToScreen(nx, ny, this.cx, this.cy);

        this.charSprite.setFlipX(this.charDir < 0);
        if (nx !== this.charTx || ny !== this.charTy) {
          this.charSprite.play('walk_right', true);
          this.tweens.add({
            targets: this.charSprite,
            x: tp.x,
            y: tp.y + TH * 0.25,
            duration: duration,
            ease: 'Linear',
            onUpdate: () => {
              this.charSprite.setDepth(this.charTx + this.charTy + 0.5);
            },
            onComplete: () => {
              this.charTx = nx;
              this.charTy = ny;
              this.charSprite.play('idle', true);
            }
          });
        }
      }

      drawSky() {
        const gfx = this.skyGfx;
        const W = this.scale.width;
        const H = this.scale.height;
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const w = MOODS[currentMood].w;

        // Elin風の空: 暖かみのあるアーストーン系
        let t1 = 0x0a0604, t2 = 0x12090c;
        if (h >= 5 && h < 7) {
          // 夜明け: 暗い藍から朝焼けオレンジへ
          const t = (h - 5) / 2;
          t1 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x0a0604), Phaser.Display.Color.IntegerToColor(0x5a2008), 100, t * 100).color;
          t2 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x12090c), Phaser.Display.Color.IntegerToColor(0xc05020), 100, t * 100).color;
        } else if (h >= 7 && h < 10) {
          // 朝: 朝焼けから昼空へ
          const t = (h - 7) / 3;
          t1 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x5a2008), Phaser.Display.Color.IntegerToColor(0x203050), 100, t * 100).color;
          t2 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0xc05020), Phaser.Display.Color.IntegerToColor(0x5888c0), 100, t * 100).color;
        } else if (h >= 10 && h < 17) {
          // 昼: 天気によって変化、Elin風の落ち着いた青空
          const c = {
            sunny: [0x1a2a40, 0x4070a8],
            clear: [0x1e2e48, 0x3860a0],
            cloudy: [0x202030, 0x383848],
            drizzle: [0x141820, 0x20282e],
            storm: [0x08080e, 0x10100e]
          };
          [t1, t2] = c[w] || c.clear;
        } else if (h >= 17 && h < 20) {
          // 夕焼け: Elin風の深いオレンジ
          const t = (h - 17) / 3;
          t1 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x203050), Phaser.Display.Color.IntegerToColor(0x12060e), 100, t * 100).color;
          t2 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x4070a8), Phaser.Display.Color.IntegerToColor(0xc04010), 100, t * 100).color;
        } else {
          // 夜: 少し明るめの藍・紫
          t1 = 0x0d0a14; t2 = 0x12102a;
        }

        gfx.clear();
        const steps = 24;
        for (let i = 0; i < steps; i++) {
          const frac = i / steps;
          const c = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(t1), Phaser.Display.Color.IntegerToColor(t2), 100, frac * 100);
          gfx.fillStyle(c.color, 1);
          gfx.fillRect(0, (H * 0.5 / steps) * i, W, H * 0.5 / steps + 1);
        }

        // 丘のシルエット (Elin風のなだらかな地平線)
        this.hillGfx.clear();
        this.hillGfx.fillStyle(0x0c0e0a, 0.7);
        this.hillGfx.beginPath();
        this.hillGfx.moveTo(0, H * 0.45);
        for (let hx = 0; hx <= W; hx += 6) {
          const hy = H * 0.36 + Math.sin(hx * 0.009 + 0.8) * H * 0.05
            + Math.sin(hx * 0.005 + 2.1) * H * 0.03
            + Math.cos(hx * 0.014 + 1.2) * H * 0.02;
          this.hillGfx.lineTo(hx, hy);
        }
        this.hillGfx.lineTo(W, H * 0.5);
        this.hillGfx.lineTo(0, H * 0.5);
        this.hillGfx.closePath();
        this.hillGfx.fillPath();

        // 手前の丘
        this.hillGfx.fillStyle(0x080a06, 0.5);
        this.hillGfx.beginPath();
        this.hillGfx.moveTo(0, H * 0.5);
        for (let hx = 0; hx <= W; hx += 6) {
          const hy = H * 0.42 + Math.sin(hx * 0.007 + 3.0) * H * 0.03
            + Math.cos(hx * 0.012 + 0.5) * H * 0.02;
          this.hillGfx.lineTo(hx, hy);
        }
        this.hillGfx.lineTo(W, H * 0.5);
        this.hillGfx.closePath();
        this.hillGfx.fillPath();
      }

      drawStars() {
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const W = this.scale.width;
        const H = this.scale.height;
        let ll = 1.0;
        if (h >= 7 && h < 17) ll = 1.0;
        else if (h >= 5 && h < 7) ll = 0.15 + (h - 5) * 0.425;
        else if (h >= 17 && h < 20) ll = 1.0 - (h - 17) * 0.35;
        else ll = 0.05;

        this.starGfx.clear();
        if (ll >= 0.7) return;
        const a = (1 - ll / 0.7) * 0.95;
        for (let i = 0; i < 140; i++) {
          const sx = (i * 173 + 11) % W;
          const sy = (i * 97 + 13) % (H * 0.38);
          const tw = 0.5 + 0.5 * Math.sin(this.tick * 0.006 + i * 0.7);
          const sz = i % 7 === 0 ? 2.0 : i % 3 === 0 ? 1.2 : 0.8;
          // Elin風: わずかに黄みがかった白
          this.starGfx.fillStyle(0xfff8e0, a * tw);
          this.starGfx.fillRect(sx, sy, sz, sz);
        }
      }

      // 噴水アニメーション更新
      updateFountain() {
        if (!this.fountainGfx || !this.fountainPos) return;
        const gfx = this.fountainGfx;
        gfx.clear();
        const { x, y } = this.fountainPos;
        const t = this.tick;
        // 水柱（上下にゆらゆら）
        const h1 = 18 + Math.sin(t * 0.08) * 5;
        const h2 = 14 + Math.sin(t * 0.08 + 1.2) * 4;
        const h3 = 10 + Math.sin(t * 0.08 + 2.4) * 3;
        // 外側の水流
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const spread = 8 + Math.sin(t * 0.05 + i) * 2;
          const wx = x + Math.cos(angle) * spread;
          const wy = y - h2 + Math.sin(angle) * spread * 0.4;
          gfx.fillStyle(0x88c8e8, 0.55);
          gfx.fillCircle(wx, wy, 2.5);
        }
        // 中央水柱
        gfx.fillStyle(0xb8e0f8, 0.75);
        gfx.fillEllipse(x, y - h1 * 0.5 - 16, 8, h1);
        gfx.fillStyle(0xd8f0ff, 0.9);
        gfx.fillEllipse(x, y - h1 - 17, 7, 10);
        // 水面リップル
        const rr = 14 + Math.sin(t * 0.06) * 2;
        gfx.lineStyle(1, 0x90c8e0, 0.5);
        gfx.strokeEllipse(x, y + 2, rr * 2.4, rr * 0.7);
        gfx.lineStyle(1, 0x90c8e0, 0.3);
        gfx.strokeEllipse(x, y + 2, (rr - 4) * 2.4, (rr - 4) * 0.7);
      }

      drawRain() {
        const w = MOODS[currentMood].w;
        const W = this.scale.width;
        const H = this.scale.height;
        this.rainGfx.clear();
        if (w !== 'drizzle' && w !== 'storm') return;
        const cnt = w === 'storm' ? 220 : 90;
        // Elin風の雨: わずかに青みがかった白
        this.rainGfx.lineStyle(0.7, 0xc8d8f0, 0.28);
        for (let i = 0; i < cnt; i++) {
          const rx = ((i * 173 + this.tick * 9) % W);
          const ry = ((i * 97 + this.tick * 7) % H);
          this.rainGfx.lineBetween(rx, ry, rx - 2, ry + 14);
        }
      }

      drawNight() {
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const W = this.scale.width;
        const H = this.scale.height;
        let ll = 1.0;
        if (h >= 7 && h < 17) ll = 1.0;
        else if (h >= 5 && h < 7) ll = 0.15 + (h - 5) * 0.425;
        else if (h >= 17 && h < 20) ll = 1.0 - (h - 17) * 0.35;
        else ll = 0.06;
        const wt = MOODS[currentMood].w;
        if (wt === 'storm') ll = Math.min(ll, 0.2);
        else if (wt === 'drizzle') ll = Math.min(ll, 0.45);
        else if (wt === 'cloudy') ll = Math.min(ll, 0.75);
        this.overlayGfx.clear();
        if (ll < 1.0) {
          // 夜オーバーレイ: 明るめに調整
          this.overlayGfx.fillStyle(0x020308, (1 - ll) * 0.45);
          this.overlayGfx.fillRect(0, 0, W, H);
        }
      }

      update() {
        this.tick++;
        if (this.tick % 60 === 0) this.updateHUD();

        const W = this.scale.width, H = this.scale.height;
        this.bgGfx.clear();
        // Elin風の深い背景色
        this.bgGfx.fillStyle(0x0e0904, 1);
        this.bgGfx.fillRect(0, 0, W, H);

        this.drawSky();
        this.drawStars();
        this.drawRain();
        this.drawNight();

        // 煙パーティクル更新
        this.updateSmoke();

        // 噴水アニメーション更新
        this.updateFountain();
      }

      updateSmoke() {
        if (!this.smokeEmitters || !this.smokeGfx) return;
        this.smokeGfx.clear();

        this.smokeEmitters.forEach(emitter => {
          emitter.timer++;

          // 3フレームごとに新しい煙粒子を追加
          if (emitter.timer % 3 === 0) {
            emitter.particles.push({
              x: emitter.x + (Math.random() - 0.5) * 4,
              y: emitter.y,
              vx: (Math.random() - 0.5) * 0.6,
              vy: -(0.6 + Math.random() * 0.6),
              life: 1.0,
              size: 4 + Math.random() * 5,
            });
          }

          // 粒子の更新と描画
          for (let i = emitter.particles.length - 1; i >= 0; i--) {
            const p = emitter.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.98;
            p.vy *= 0.99;
            p.life -= 0.018;
            p.size += 0.15;

            if (p.life <= 0) {
              emitter.particles.splice(i, 1);
              continue;
            }

            const alpha = p.life * 0.5;
            // 白〜薄いグレーで煙を表現
            const grey = Math.floor(180 + p.life * 60);
            const col = (grey << 16) | (grey << 8) | grey;
            this.smokeGfx.fillStyle(col, alpha);
            this.smokeGfx.fillCircle(p.x, p.y, p.size);
          }
        });
      }
    }

    // ピクセルマップからCanvasを生成する関数
    function drawPixelArt(paletteName, size) {
      const palette = PIXEL_PALETTES[paletteName];
      if (!palette) return null;
      const canvas = document.createElement('canvas');
      const GRID = 16;
      canvas.width = GRID;
      canvas.height = GRID;
      canvas.style.cssText = `width:${size}px;height:${size}px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;`;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(GRID, GRID);
      const colors = palette.colors;
      const map = palette.map;
      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          const ci = map[y] ? (map[y][x] || 0) : 0;
          const color = colors[ci];
          const idx = (y * GRID + x) * 4;
          if (color) {
            imgData.data[idx] = color[0];
            imgData.data[idx + 1] = color[1];
            imgData.data[idx + 2] = color[2];
            imgData.data[idx + 3] = 255;
          } else {
            imgData.data[idx + 3] = 0; // 透明
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    // ===== IndexedDB ラッパー（GameDB）=====
    // localStorageの同期制限・5MB制限を超えるためIndexedDBへ移行する
    const GameDB = {
      DB_NAME: 'pomeraGameDB',
      DB_VERSION: 1,
      STORE_NAME: 'gameData',
      _db: null,

      async open() {
        if (this._db) return this._db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.STORE_NAME)) {
              db.createObjectStore(this.STORE_NAME);
            }
          };
          req.onsuccess = (e) => { this._db = e.target.result; resolve(this._db); };
          req.onerror = (e) => reject(e.target.error);
        });
      },

      async get(key) {
        try {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(this.STORE_NAME, 'readonly');
            const req = tx.objectStore(this.STORE_NAME).get(key);
            req.onsuccess = (e) => resolve(e.target.result ?? null);
            req.onerror = (e) => reject(e.target.error);
          });
        } catch (e) {
          // フォールバック: localStorage
          return localStorage.getItem(key);
        }
      },

      async set(key, val) {
        try {
          const db = await this.open();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(this.STORE_NAME, 'readwrite');
            const req = tx.objectStore(this.STORE_NAME).put(val, key);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e.target.error);
          });
        } catch (e) {
          // フォールバック: localStorage
          try { localStorage.setItem(key, val); } catch (le) { }
        }
      },

      // localStorage → IndexedDB へのデータ移行
      async migrateFromLocalStorage() {
        const keys = [
          'pomera_cp', 'pomera_last_login', 'pomera_inventory', 'pomera_equipped',
          'pomera_floor', 'pomera_char_cache', 'pomera_recruited', 'pomera_party',
          'pomera_dead', 'pomera_xp', 'pomera_lv', 'pomera_skillpath',
          'pomera_prev_nodes', 'pomera_demo_mode', 'pomera_titles'
        ];
        for (const key of keys) {
          const val = localStorage.getItem(key);
          if (val !== null) {
            await this.set(key, val);
          }
        }
        await this.set('_migrated', '1');
        console.log('[GameDB] localStorage → IndexedDB 移行完了');
      }
    };

      // IndexedDB 初回移行
      try {
        const migrated = await GameDB.get('_migrated');
        if (!migrated) {
          await GameDB.migrateFromLocalStorage();
        }
        window._gameDB = GameDB;
        console.log('[GameDB] IndexedDB 準備完了');
      } catch (e) {
        console.warn('[GameDB] IndexedDB 初期化失敗、localStorageで継続:', e);
      }

      // 日記・ナレッジグラフデータの読み込み
      try {
        const res = await fetch('./daily_graph.json');
        if (!res.ok) throw new Error('daily_graph.json load failed');
        const data = await res.json();
        // Phaserがまだロード中でも、UIを先に初期化する
        buildGameFromGraph(data);
        // windowにdailyDataをキャッシュ（Phaserのcreate内でも使えるように）
        window._dailyData = data;
        console.log('[POMERA] 日記データ読み込み完了:', data.nodes?.length, 'ノード');
      } catch (e) {
        console.warn('daily_graph.json load failed:', e);
        // データなしでも空の初期化
        buildGameFromGraph(null);
      }
    })();



  </script>
</body>

</html>
