<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>異世界の自分 | POMERA WORLD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1208;
      overflow: hidden;
      height: 100vh;
      font-family: 'Noto Serif JP', 'Yu Mincho', serif;
    }

    /* ===== HUD ===== */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 38px;
      background: linear-gradient(180deg, #1c1005 0%, #231508 100%);
      border-bottom: 2px solid #7a5020;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(200, 140, 40, 0.15);
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      z-index: 10;
    }

    .hback {
      font-size: 10px;
      color: #c8a050;
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      text-decoration: none;
      letter-spacing: 1px;
      border-right: 1px solid #5a3a10;
      background: rgba(80, 40, 5, 0.3);
      transition: background 0.2s;
    }

    .hback:hover {
      background: rgba(120, 70, 15, 0.5);
    }

    .htitle {
      font-size: 13px;
      color: #e8c060;
      letter-spacing: 5px;
      flex: 1;
      text-align: center;
      text-shadow: 0 0 12px rgba(230, 180, 60, 0.5);
      font-weight: 700;
    }

    .hr {
      display: flex;
      align-items: center;
      gap: 0;
      border-left: 1px solid #5a3a10;
      height: 100%;
    }

    .hstat {
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 100%;
      border-right: 1px solid #5a3a10;
      gap: 5px;
    }

    .hwx {
      font-size: 14px;
    }

    .hmood {
      font-size: 10px;
      color: #d4a040;
      letter-spacing: 1px;
    }

    .hclock {
      font-size: 11px;
      color: #b89040;
      letter-spacing: 2px;
      padding: 0 12px;
      font-family: 'Courier New', monospace;
    }

    /* ===== サイドパネル ===== */
    #panel {
      position: fixed;
      top: 38px;
      right: 0;
      width: 210px;
      bottom: 0;
      background: linear-gradient(180deg, #180f04 0%, #1e1208 100%);
      border-left: 2px solid #7a5020;
      box-shadow: -3px 0 12px rgba(0, 0, 0, 0.6);
      padding: 0;
      overflow-y: auto;
      z-index: 10;
    }

    /* 木目テクスチャ風の装飾ライン */
    #panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 3px;
      right: 3px;
      height: 100%;
      background: repeating-linear-gradient(180deg,
          transparent 0px,
          transparent 22px,
          rgba(100, 60, 10, 0.04) 22px,
          rgba(100, 60, 10, 0.04) 23px);
      pointer-events: none;
    }

    .psec {
      margin-bottom: 0;
      border-bottom: 1px solid rgba(120, 80, 20, 0.3);
    }

    .ph {
      font-size: 9px;
      color: #c89040;
      letter-spacing: 3px;
      padding: 8px 12px 6px;
      background: linear-gradient(90deg, rgba(80, 45, 5, 0.6) 0%, transparent 100%);
      border-bottom: 1px solid rgba(120, 80, 20, 0.2);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ph::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #c89040;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .pt {
      font-size: 9px;
      color: #b09060;
      line-height: 1.7;
      padding: 8px 12px;
    }

    .pact {
      font-size: 10px;
      color: #90c860;
      padding: 8px 12px;
      line-height: 1.6;
      background: rgba(30, 60, 10, 0.15);
      border-left: 2px solid rgba(100, 180, 40, 0.3);
      margin: 0;
    }

    /* 感情アイコン表示 */
    #pem {
      padding: 8px 12px 10px;
    }

    /* ===== ゲームコンテナ ===== */
    #game-container {
      position: fixed;
      top: 38px;
      left: 0;
      right: 210px;
      bottom: 0;
    }

    /* ===== ローディング ===== */
    #loading {
      position: fixed;
      inset: 0;
      background: #0e0904;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 999;
      transition: opacity 1.0s;
    }

    #loading.out {
      opacity: 0;
      pointer-events: none;
    }

    .lt {
      font-size: 24px;
      color: #e8c060;
      letter-spacing: 6px;
      text-shadow: 0 0 24px rgba(230, 180, 60, 0.6), 0 0 60px rgba(180, 100, 20, 0.3);
      font-weight: 700;
    }

    .ls {
      font-size: 10px;
      color: #907040;
      letter-spacing: 3px;
    }

    .lbw {
      width: 220px;
      height: 8px;
      background: #0a0604;
      border: 1px solid #7a5020;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(120, 80, 20, 0.4);
    }

    .lb {
      height: 100%;
      background: linear-gradient(90deg, #5a2c08, #c87020, #f0b040);
      width: 0;
      transition: width 0.4s;
    }

    /* ===== ログウィンドウ (Elin風の下部テキストログ) ===== */
    #log-window {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 210px;
      height: 72px;
      background: linear-gradient(180deg, rgba(14, 9, 4, 0.0) 0%, rgba(14, 9, 4, 0.85) 30%, rgba(14, 9, 4, 0.95) 100%);
      border-top: 1px solid rgba(120, 80, 20, 0.3);
      padding: 8px 14px;
      z-index: 9;
      pointer-events: none;
    }

    #log-text {
      font-size: 9px;
      color: #b09060;
      line-height: 1.8;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 1);
    }

    /* ===== スクロールバー ===== */
    #panel::-webkit-scrollbar {
      width: 4px;
    }

    #panel::-webkit-scrollbar-track {
      background: #120a02;
    }

    #panel::-webkit-scrollbar-thumb {
      background: #7a5020;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="lt">⚔ 異世界の自分 ⚔</div>
    <div class="ls">感情が世界を紡ぐ...</div>
    <div class="lbw">
      <div class="lb" id="lb"></div>
    </div>
    <div class="ls" id="lstat">素材を読み込み中...</div>
  </div>

  <div id="hud">
    <a class="hback" href="./index.html">← 戻る</a>
    <div class="htitle">✦ POMERA WORLD ✦</div>
    <div class="hr">
      <div class="hstat">
        <span class="hwx" id="hwx">🌤</span>
        <span class="hmood" id="hmood">—</span>
      </div>
      <span class="hclock" id="hclock">--:--</span>
    </div>
  </div>

  <div id="panel">
    <div class="psec">
      <div class="ph">今日の感情</div>
      <div id="pem"></div>
    </div>
    <div class="psec">
      <div class="ph">行動</div>
      <div class="pact" id="pact">...</div>
    </div>
    <div class="psec">
      <div class="ph">日記</div>
      <div class="pt" id="pdi">読み込み中...</div>
    </div>
  </div>

  <div id="game-container"></div>

  <div id="log-window">
    <div id="log-text">イルヴァの風が草原を揺らす...</div>
  </div>

  <script>
    // ===== 定数 =====
    const TW = 96, TH = 96;
    const MAP_W = 18, MAP_H = 18;

    // ===== 世界状態 =====
    const MOODS = {
      joy: { label: '喜び', color: '#ffe090', w: 'sunny', icon: '☀' },
      trust: { label: '信頼', color: '#90d080', w: 'clear', icon: '🌤' },
      fear: { label: '恐れ', color: '#8070b0', w: 'storm', icon: '⛈' },
      surprise: { label: '驚き', color: '#f0a030', w: 'clear', icon: '✨' },
      sadness: { label: '悲しみ', color: '#7090c0', w: 'drizzle', icon: '🌧' },
      disgust: { label: '嫌悪', color: '#a0a060', w: 'cloudy', icon: '☁' },
      anger: { label: '怒り', color: '#e05030', w: 'storm', icon: '⛈' },
      neutral: { label: '平静', color: '#c8a870', w: 'clear', icon: '🌤' }
    };

    const ACTIONS = {
      joy: ['広場で踊っている', 'くるくる回っている', '鼻歌を歌っている'],
      trust: ['井戸で水を汲んでいる', '庭を手入れしている', '読書をしている'],
      fear: ['物陰に隠れている', '辺りをうかがっている', 'そろそろと移動している'],
      surprise: ['立ち止まって空を見上げている', '辺りを見渡している'],
      sadness: ['ゆっくり歩いている', '焚き火の前に座っている', '川を眺めている'],
      disgust: ['ぼんやり歩いている', '何か考え込んでいる'],
      anger: ['早足で歩き回っている', '一人で剣の稽古をしている'],
      neutral: ['散歩をしている', '通りを歩いている', '空を見上げている']
    };

    const LOG_MESSAGES = [
      'イルヴァの風が草原を揺らす...',
      '遠くで狼の遠吠えが聞こえる。',
      '焚き火が夜風に揺れている。',
      '石畳の道に月明かりが注いでいる。',
      '旅人が宿屋へと消えていく。',
      '魔法使いは杖を握り直した。',
      '古い井戸から水を汲む音がする。',
      'どこかで扉が軋む音がした。',
      '空に星が瞬き始めた。',
    ];

    let currentMood = 'neutral';
    let logIdx = 0;

    // タイルマップ生成
    const MAP = [];
    for (let y = 0; y < MAP_H; y++) {
      MAP[y] = [];
      for (let x = 0; x < MAP_W; x++) {
        if ((x === 4 || x === 5) && y > 3 && y < 14) MAP[y][x] = 'stone';
        else if (x > 7 && x < 11 && y > 7 && y < 11) MAP[y][x] = 'water';
        else if (Math.random() < 0.04) MAP[y][x] = 'water';
        else MAP[y][x] = 'grass';
      }
    }

    // アイソメ座標変換
    function isoToScreen(tx, ty, cx, cy) {
      return {
        x: cx + (tx - ty) * TW / 2,
        y: cy + (tx + ty) * TH / 2
      };
    }

    // ===== Phaser シーン =====
    class MainScene extends Phaser.Scene {
      constructor() {
        super({ key: 'MainScene' });
        this.tileImages = [];
        this.objImages = [];
        this.charSprite = null;
        this.fireSprite = null;
        this.skyGfx = null;
        this.overlayGfx = null;
        this.charTx = 9;
        this.charTy = 8;
        this.charDir = 1;
        this.charTargetX = 9;
        this.charTargetY = 8;
        this.charMoving = false;
        this.tick = 0;
        this.cx = 0;
        this.cy = 0;
      }

      preload() {
        const lb = document.getElementById('lb');
        const lstat = document.getElementById('lstat');
        this.load.on('progress', v => { lb.style.width = (v * 100) + '%'; });
        this.load.on('fileprogress', f => { lstat.textContent = f.key + ' 読み込み中...'; });
        this.load.on('complete', () => { lstat.textContent = '完了!'; });

        const ts = Date.now();
        this.load.image('grass', `./sprites/grass.png?v=${ts}`);
        this.load.image('stone', `./sprites/stone.png?v=${ts}`);
        this.load.image('water', `./sprites/water.png?v=${ts}`);
        this.load.image('house', `./sprites/house.png?v=${ts}`);
        this.load.image('tower', `./sprites/tower.png?v=${ts}`);
        this.load.image('tree', `./sprites/tree.png?v=${ts}`);
        this.load.image('well', `./sprites/well.png?v=${ts}`);
        this.load.spritesheet('char', `./sprites/char.png?v=${ts}`,
          { frameWidth: Math.round(640 / 3), frameHeight: Math.round(640 / 2) });
        this.load.spritesheet('fire', `./sprites/fire.png?v=${ts}`,
          { frameWidth: Math.round(640 / 4), frameHeight: Math.round(640 / 2) });

        this.load.json('daily', './daily_graph.json');
      }

      create() {
        const W = this.scale.width;
        const H = this.scale.height;
        this.cx = W / 2;
        this.cy = H * 0.05;

        // 感情ロード
        const data = this.cache.json.get('daily');
        if (data) {
          const em = this.extractEmotion(data);
          if (em) currentMood = em;
        }
        this.updateHUD();

        // 背景グラフィクス
        this.bgGfx = this.add.graphics().setDepth(-200);
        this.skyGfx = this.add.graphics().setDepth(-100);
        this.hillGfx = this.add.graphics().setDepth(-99);
        this.starGfx = this.add.graphics().setDepth(-98);
        this.sunGfx = this.add.graphics().setDepth(-97);
        this.cloudGfx = this.add.graphics().setDepth(-96);
        this.overlayGfx = this.add.graphics().setDepth(9000);

        // タイル配置
        for (let ty = 0; ty < MAP_H; ty++) {
          for (let tx = 0; tx < MAP_W; tx++) {
            const p = isoToScreen(tx, ty, this.cx, this.cy);
            const key = MAP[ty][tx];
            const img = this.add.image(p.x, p.y, key);
            img.setDisplaySize(TW * 2, TW);
            img.setDepth(tx + ty - 100);
          }
        }

        // オブジェクト配置
        const OBJS = [
          { t: 'house', x: 8, y: 4, scale: 0.38 },
          { t: 'house', x: 11, y: 5, scale: 0.38 },
          { t: 'tower', x: 2, y: 2, scale: 0.30 },
          { t: 'tower', x: 14, y: 2, scale: 0.30 },
          { t: 'tree', x: 6, y: 6, scale: 0.32 },
          { t: 'tree', x: 13, y: 8, scale: 0.32 },
          { t: 'tree', x: 7, y: 13, scale: 0.32 },
          { t: 'well', x: 9, y: 9, scale: 0.28 },
        ];
        OBJS.forEach(o => {
          const p = isoToScreen(o.x, o.y, this.cx, this.cy);
          const img = this.add.image(p.x, p.y + TH * 0.25, o.t);
          const tex = this.textures.get(o.t);
          const src = tex.getSourceImage();
          img.setDisplaySize(src.width * o.scale, src.height * o.scale);
          img.setOrigin(0.5, 1.0);
          img.setDepth(o.x + o.y);
        });

        // 焚き火アニメーション
        this.anims.create({
          key: 'burn',
          frames: this.anims.generateFrameNumbers('fire', { start: 0, end: 7 }),
          frameRate: 8,
          repeat: -1
        });
        const fp = isoToScreen(10, 10, this.cx, this.cy);
        this.fireSprite = this.add.sprite(fp.x, fp.y + TH * 0.25, 'fire');
        this.fireSprite.setDisplaySize(72, 72);
        this.fireSprite.setOrigin(0.5, 1.0);
        this.fireSprite.setDepth(10 + 10 + 0.5);
        this.fireSprite.play('burn');

        // キャラクター
        this.anims.create({
          key: 'walk_right',
          frames: this.anims.generateFrameNumbers('char', { start: 0, end: 4 }),
          frameRate: 6,
          repeat: -1
        });
        this.anims.create({
          key: 'idle',
          frames: this.anims.generateFrameNumbers('char', { start: 0, end: 0 }),
          frameRate: 1,
          repeat: -1
        });
        const cp = isoToScreen(this.charTx, this.charTy, this.cx, this.cy);
        this.charSprite = this.add.sprite(cp.x, cp.y + TH * 0.25, 'char');
        this.charSprite.setDisplaySize(64, 80);
        this.charSprite.setOrigin(0.5, 1.0);
        this.charSprite.setDepth(this.charTx + this.charTy + 0.5);
        this.charSprite.play('idle');

        // 雨パーティクル
        this.rainGfx = this.add.graphics().setDepth(8000);

        // ローディング画面を消す
        const loading = document.getElementById('loading');
        this.time.delayedCall(300, () => {
          loading.classList.add('out');
          setTimeout(() => { loading.style.display = 'none'; }, 1100);
        });

        this.updatePanel(data);

        // キャラAIタイマー
        this.time.addEvent({ delay: 3000, loop: true, callback: this.pickNewTarget, callbackScope: this });

        // ログメッセージローテーション
        this.time.addEvent({ delay: 6000, loop: true, callback: this.rotateLog, callbackScope: this });

        // 初回描画
        this.drawSky();
        this.drawStars();
        this.drawSunMoon();
        this.drawClouds();
      }

      extractEmotion(data) {
        const order = ['joy', 'trust', 'fear', 'surprise', 'sadness', 'disgust', 'anger', 'neutral'];
        if (!data || !data.nodes) return null;
        let best = null, bestScore = -1;
        data.nodes.forEach(n => {
          if (n.emotion) {
            const idx = order.indexOf(n.emotion);
            if (idx === -1) return;
            const score = (n.weight || 1) * (1 / (idx + 1));
            if (score > bestScore) { bestScore = score; best = n.emotion; }
          }
        });
        return best;
      }

      updateHUD() {
        const m = MOODS[currentMood];
        document.getElementById('hwx').textContent = m.icon;
        document.getElementById('hmood').textContent = m.label;
        const now = new Date();
        document.getElementById('hclock').textContent =
          String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        document.getElementById('pem').innerHTML =
          '<div style="font-size:28px;text-align:center;margin:6px 0 4px;text-shadow:0 0 12px rgba(255,200,80,0.4)">' + m.icon + '</div>' +
          '<div style="font-size:11px;color:' + m.color + ';text-align:center;letter-spacing:3px;text-shadow:0 0 8px rgba(0,0,0,0.8)">' + m.label + '</div>';
      }

      updatePanel(data) {
        const diEl = document.getElementById('pdi');
        if (data && data.nodes) {
          const recent = data.nodes
            .filter(n => n.date)
            .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
            .slice(0, 1);
          diEl.textContent = recent.length ? recent[0].label || '—' : '感情が世界を紡いでいる。';
        } else {
          diEl.textContent = '感情が世界を紡いでいる。';
        }
      }

      rotateLog() {
        logIdx = (logIdx + 1) % LOG_MESSAGES.length;
        const logEl = document.getElementById('log-text');
        if (logEl) {
          logEl.style.opacity = '0';
          setTimeout(() => {
            logEl.textContent = LOG_MESSAGES[logIdx];
            logEl.style.opacity = '1';
            logEl.style.transition = 'opacity 0.8s';
          }, 400);
        }
      }

      pickNewTarget() {
        const acts = ACTIONS[currentMood] || ACTIONS.neutral;
        const act = acts[Math.floor(Math.random() * acts.length)];
        document.getElementById('pact').textContent = act;

        // ログに行動を追加
        const logEl = document.getElementById('log-text');
        if (logEl && Math.random() < 0.5) {
          logEl.style.opacity = '0';
          setTimeout(() => {
            logEl.textContent = '魔法使いが' + act + '。';
            logEl.style.opacity = '1';
            logEl.style.transition = 'opacity 0.8s';
          }, 300);
        }

        let nx, ny, tries = 0;
        do {
          const speed = currentMood === 'anger' ? 3 : currentMood === 'fear' ? 1 : 2;
          nx = Math.max(0, Math.min(MAP_W - 1, Math.round(this.charTx + (Math.random() - 0.5) * speed * 2)));
          ny = Math.max(0, Math.min(MAP_H - 1, Math.round(this.charTy + (Math.random() - 0.5) * speed * 2)));
          tries++;
        } while (MAP[ny][nx] === 'water' && tries < 10);
        if (MAP[ny][nx] === 'water') return;

        this.charTargetX = nx;
        this.charTargetY = ny;
        this.charDir = nx >= this.charTx ? 1 : -1;

        const duration = 2500 + Math.random() * 2000;
        const tp = isoToScreen(nx, ny, this.cx, this.cy);

        this.charSprite.setFlipX(this.charDir < 0);
        if (nx !== this.charTx || ny !== this.charTy) {
          this.charSprite.play('walk_right', true);
          this.tweens.add({
            targets: this.charSprite,
            x: tp.x,
            y: tp.y + TH * 0.25,
            duration: duration,
            ease: 'Linear',
            onUpdate: () => {
              this.charSprite.setDepth(this.charTx + this.charTy + 0.5);
            },
            onComplete: () => {
              this.charTx = nx;
              this.charTy = ny;
              this.charSprite.play('idle', true);
            }
          });
        }
      }

      drawSky() {
        const gfx = this.skyGfx;
        const W = this.scale.width;
        const H = this.scale.height;
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const w = MOODS[currentMood].w;

        // Elin風の空: 暖かみのあるアーストーン系
        let t1 = 0x0a0604, t2 = 0x12090c;
        if (h >= 5 && h < 7) {
          // 夜明け: 暗い藍から朝焼けオレンジへ
          const t = (h - 5) / 2;
          t1 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x0a0604), Phaser.Display.Color.IntegerToColor(0x5a2008), 100, t * 100).color;
          t2 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x12090c), Phaser.Display.Color.IntegerToColor(0xc05020), 100, t * 100).color;
        } else if (h >= 7 && h < 10) {
          // 朝: 朝焼けから昼空へ
          const t = (h - 7) / 3;
          t1 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x5a2008), Phaser.Display.Color.IntegerToColor(0x203050), 100, t * 100).color;
          t2 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0xc05020), Phaser.Display.Color.IntegerToColor(0x5888c0), 100, t * 100).color;
        } else if (h >= 10 && h < 17) {
          // 昼: 天気によって変化、Elin風の落ち着いた青空
          const c = {
            sunny: [0x1a2a40, 0x4070a8],
            clear: [0x1e2e48, 0x3860a0],
            cloudy: [0x202030, 0x383848],
            drizzle: [0x141820, 0x20282e],
            storm: [0x08080e, 0x10100e]
          };
          [t1, t2] = c[w] || c.clear;
        } else if (h >= 17 && h < 20) {
          // 夕焼け: Elin風の深いオレンジ
          const t = (h - 17) / 3;
          t1 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x203050), Phaser.Display.Color.IntegerToColor(0x12060e), 100, t * 100).color;
          t2 = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(0x4070a8), Phaser.Display.Color.IntegerToColor(0xc04010), 100, t * 100).color;
        } else {
          // 夜: 深い藍・紫
          t1 = 0x060408; t2 = 0x080510;
        }

        gfx.clear();
        const steps = 24;
        for (let i = 0; i < steps; i++) {
          const frac = i / steps;
          const c = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.IntegerToColor(t1), Phaser.Display.Color.IntegerToColor(t2), 100, frac * 100);
          gfx.fillStyle(c.color, 1);
          gfx.fillRect(0, (H * 0.5 / steps) * i, W, H * 0.5 / steps + 1);
        }

        // 丘のシルエット (Elin風のなだらかな地平線)
        this.hillGfx.clear();
        this.hillGfx.fillStyle(0x0c0e0a, 0.7);
        this.hillGfx.beginPath();
        this.hillGfx.moveTo(0, H * 0.45);
        for (let hx = 0; hx <= W; hx += 6) {
          const hy = H * 0.36 + Math.sin(hx * 0.009 + 0.8) * H * 0.05
            + Math.sin(hx * 0.005 + 2.1) * H * 0.03
            + Math.cos(hx * 0.014 + 1.2) * H * 0.02;
          this.hillGfx.lineTo(hx, hy);
        }
        this.hillGfx.lineTo(W, H * 0.5);
        this.hillGfx.lineTo(0, H * 0.5);
        this.hillGfx.closePath();
        this.hillGfx.fillPath();

        // 手前の丘
        this.hillGfx.fillStyle(0x080a06, 0.5);
        this.hillGfx.beginPath();
        this.hillGfx.moveTo(0, H * 0.5);
        for (let hx = 0; hx <= W; hx += 6) {
          const hy = H * 0.42 + Math.sin(hx * 0.007 + 3.0) * H * 0.03
            + Math.cos(hx * 0.012 + 0.5) * H * 0.02;
          this.hillGfx.lineTo(hx, hy);
        }
        this.hillGfx.lineTo(W, H * 0.5);
        this.hillGfx.closePath();
        this.hillGfx.fillPath();
      }

      drawStars() {
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const W = this.scale.width;
        const H = this.scale.height;
        let ll = 1.0;
        if (h >= 7 && h < 17) ll = 1.0;
        else if (h >= 5 && h < 7) ll = 0.15 + (h - 5) * 0.425;
        else if (h >= 17 && h < 20) ll = 1.0 - (h - 17) * 0.35;
        else ll = 0.05;

        this.starGfx.clear();
        if (ll >= 0.7) return;
        const a = (1 - ll / 0.7) * 0.95;
        for (let i = 0; i < 140; i++) {
          const sx = (i * 173 + 11) % W;
          const sy = (i * 97 + 13) % (H * 0.38);
          const tw = 0.5 + 0.5 * Math.sin(this.tick * 0.006 + i * 0.7);
          const sz = i % 7 === 0 ? 2.0 : i % 3 === 0 ? 1.2 : 0.8;
          // Elin風: わずかに黄みがかった白
          this.starGfx.fillStyle(0xfff8e0, a * tw);
          this.starGfx.fillRect(sx, sy, sz, sz);
        }
      }

      drawSunMoon() {
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const W = this.scale.width;
        const H = this.scale.height;
        this.sunGfx.clear();
        if (h >= 6 && h < 18) {
          // 太陽: Elin風の温かいゴールド
          const a = ((h - 6) / 12) * Math.PI;
          const sx = W * 0.5 + Math.cos(Math.PI - a) * W * 0.38;
          const sy = H * 0.12 - Math.sin(a) * H * 0.09;
          // 光のコロナ
          this.sunGfx.fillStyle(0xf0a020, 0.12);
          this.sunGfx.fillCircle(sx, sy, 22);
          this.sunGfx.fillStyle(0xf8c040, 0.25);
          this.sunGfx.fillCircle(sx, sy, 16);
          this.sunGfx.fillStyle(0xffe060, 1);
          this.sunGfx.fillCircle(sx, sy, 10);
          this.sunGfx.fillStyle(0xfff090, 1);
          this.sunGfx.fillCircle(sx - 2, sy - 2, 5);
        } else {
          // 月: Elin風の青みがかった白
          const ah = h < 6 ? h + 12 : h - 18;
          const a = (ah / 12) * Math.PI;
          const mx = W * 0.5 + Math.cos(Math.PI - a) * W * 0.38;
          const my = H * 0.12 - Math.sin(a) * H * 0.09;
          this.sunGfx.fillStyle(0xd0d8c0, 0.15);
          this.sunGfx.fillCircle(mx, my, 16);
          this.sunGfx.fillStyle(0xd8e0c8, 1);
          this.sunGfx.fillCircle(mx, my, 9);
          // クレーター風の影
          this.sunGfx.fillStyle(0x04030a, 1);
          this.sunGfx.fillCircle(mx + 3, my - 2, 7);
        }
      }

      drawClouds() {
        const w = MOODS[currentMood].w;
        const W = this.scale.width;
        const H = this.scale.height;
        const cnt = { sunny: 3, clear: 6, cloudy: 14, drizzle: 20, storm: 26 }[w] || 3;
        const alp = { sunny: 0.18, clear: 0.32, cloudy: 0.65, drizzle: 0.82, storm: 0.92 }[w] || 0.18;
        this.cloudGfx.clear();
        for (let i = 0; i < cnt; i++) {
          const cx2 = ((i * 211 + this.tick * 1.2) % W);
          const cy2 = H * 0.03 + (i % 5) * H * 0.045;
          const cw = 50 + (i % 4) * 35;
          // Elin風: わずかに温かみのある雲
          const ccolor = MOODS[currentMood].w === 'storm' ? 0x606070 : 0xc8ccd8;
          this.cloudGfx.fillStyle(ccolor, alp);
          this.cloudGfx.fillEllipse(cx2, cy2, cw * 2.2, cw * 0.9);
          this.cloudGfx.fillEllipse(cx2 - cw * 0.4, cy2 + cw * 0.1, cw * 1.2, cw * 0.7);
          this.cloudGfx.fillEllipse(cx2 + cw * 0.4, cy2 + cw * 0.1, cw * 1.2, cw * 0.7);
        }
      }

      drawRain() {
        const w = MOODS[currentMood].w;
        const W = this.scale.width;
        const H = this.scale.height;
        this.rainGfx.clear();
        if (w !== 'drizzle' && w !== 'storm') return;
        const cnt = w === 'storm' ? 220 : 90;
        // Elin風の雨: わずかに青みがかった白
        this.rainGfx.lineStyle(0.7, 0xc8d8f0, 0.28);
        for (let i = 0; i < cnt; i++) {
          const rx = ((i * 173 + this.tick * 9) % W);
          const ry = ((i * 97 + this.tick * 7) % H);
          this.rainGfx.lineBetween(rx, ry, rx - 2, ry + 14);
        }
      }

      drawNight() {
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        const W = this.scale.width;
        const H = this.scale.height;
        let ll = 1.0;
        if (h >= 7 && h < 17) ll = 1.0;
        else if (h >= 5 && h < 7) ll = 0.15 + (h - 5) * 0.425;
        else if (h >= 17 && h < 20) ll = 1.0 - (h - 17) * 0.35;
        else ll = 0.06;
        const wt = MOODS[currentMood].w;
        if (wt === 'storm') ll = Math.min(ll, 0.2);
        else if (wt === 'drizzle') ll = Math.min(ll, 0.45);
        else if (wt === 'cloudy') ll = Math.min(ll, 0.75);
        this.overlayGfx.clear();
        if (ll < 1.0) {
          // Elin風: わずかに青みがかった夜オーバーレイ
          this.overlayGfx.fillStyle(0x020308, (1 - ll) * 0.62);
          this.overlayGfx.fillRect(0, 0, W, H);
        }
      }

      update() {
        this.tick++;
        if (this.tick % 60 === 0) this.updateHUD();

        const W = this.scale.width, H = this.scale.height;
        this.bgGfx.clear();
        // Elin風の深い背景色
        this.bgGfx.fillStyle(0x0e0904, 1);
        this.bgGfx.fillRect(0, 0, W, H);

        this.drawSky();
        this.drawStars();
        this.drawSunMoon();
        this.drawClouds();
        this.drawRain();
        this.drawNight();
      }
    }

    // ===== Phaser 起動 =====
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      backgroundColor: '#0e0904',
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: '100%',
        height: '100%'
      },
      scene: MainScene,
      pixelArt: true
    };
    const game = new Phaser.Game(config);
  </script>
</body>
