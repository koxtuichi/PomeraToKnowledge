<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>異世界の自分 | POMERA WORLD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #080511;
      overflow: hidden;
      height: 100vh;
      font-family: 'Courier New', monospace
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #080511;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
      transition: opacity 0.8s
    }

    #loading.out {
      opacity: 0;
      pointer-events: none
    }

    .lt {
      font-size: 22px;
      color: #c8934a;
      letter-spacing: 5px;
      text-shadow: 0 0 20px rgba(200, 147, 74, 0.5)
    }

    .ls {
      font-size: 10px;
      color: #7a5830;
      letter-spacing: 3px
    }

    .lbw {
      width: 200px;
      height: 6px;
      background: #120e1c;
      border: 1px solid rgba(80, 60, 20, 0.5);
      border-radius: 3px;
      overflow: hidden
    }

    .lb {
      height: 100%;
      background: linear-gradient(90deg, #6a3c10, #c8934a, #ffe090);
      width: 0;
      transition: width 0.6s;
      border-radius: 3px
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      background: rgba(4, 3, 10, 0.95);
      border-bottom: 1px solid rgba(120, 90, 30, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      z-index: 10
    }

    .hback {
      font-size: 10px;
      color: #7a6030;
      padding: 3px 10px;
      border: 1px solid rgba(100, 75, 25, 0.4);
      border-radius: 2px;
      text-decoration: none;
      letter-spacing: 1px
    }

    .htitle {
      font-size: 12px;
      color: #9a7040;
      letter-spacing: 4px;
      flex: 1;
      text-align: center
    }

    .hr {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .hwx,
    .hmood {
      font-size: 12px;
      color: #9a7040
    }

    .hclock {
      font-size: 11px;
      color: #7a6030;
      letter-spacing: 2px
    }

    #panel {
      position: fixed;
      top: 34px;
      right: 0;
      width: 200px;
      bottom: 0;
      background: rgba(4, 3, 10, 0.92);
      border-left: 1px solid rgba(80, 60, 20, 0.2);
      padding: 12px 10px;
      overflow-y: auto
    }

    .ph {
      font-size: 9px;
      color: #6a5030;
      letter-spacing: 3px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(80, 60, 20, 0.2);
      padding-bottom: 4px
    }

    .pt {
      font-size: 9px;
      color: #6a5838;
      flex: 1
    }

    .ebg {
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1px;
      flex: 1
    }

    .ebf {
      height: 100%;
      border-radius: 1px
    }

    .pact {
      font-size: 10px;
      color: #80b050;
      padding: 7px 8px;
      line-height: 1.7;
      background: rgba(40, 80, 15, 0.1);
      border: 1px solid rgba(40, 80, 15, 0.2);
      border-radius: 2px
    }

    .psec {
      margin-bottom: 16px
    }

    #world {
      position: fixed;
      top: 34px;
      left: 0;
      right: 200px;
      bottom: 0;
      overflow: hidden;
      cursor: default
    }

    #cv {
      position: absolute;
      top: 0;
      left: 0
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="lt">⚔ 異世界の自分 ⚔</div>
    <div class="ls">感情が世界を紡ぐ...</div>
    <div class="lbw">
      <div class="lb" id="lb"></div>
    </div>
    <div class="ls" id="lstat">素材を読み込み中...</div>
  </div>
  <div id="hud">
    <a class="hback" href="./index.html">← 戻る</a>
    <div class="htitle">✦ POMERA WORLD ✦</div>
    <div class="hr">
      <span class="hwx" id="hwx">☀</span>
      <span class="hmood" id="hmood">—</span>
      <span class="hclock" id="hclock">--:--</span>
    </div>
  </div>
  <div id="panel">
    <div class="psec">
      <div class="ph">◆ 今日の感情</div>
      <div id="pem"></div>
    </div>
    <div class="psec">
      <div class="ph">◆ 行動</div>
      <div class="pact" id="pact">...</div>
    </div>
    <div class="psec">
      <div class="ph">◆ 日記</div>
      <div class="pt" id="pdi">読み込み中...</div>
    </div>
  </div>
  <div id="world"><canvas id="cv"></canvas></div>

  <script>
    // ===== CONFIG =====
    const TW = 96, TH = 48;
    const MAP_W = 18, MAP_H = 18;

    // ===== WORLD STATE =====
    const MOODS = {
      joy: { label: '喜び', color: '#ffe090', sky: 'sunny', w: 'sunny', icon: '☀' },
      trust: { label: '信頼', color: '#90d080', sky: 'clear', w: 'clear', icon: '🌤' },
      fear: { label: '恐れ', color: '#8070b0', sky: 'cloudy', w: 'storm', icon: '⛈' },
      surprise: { label: '驚き', color: '#f0a030', sky: 'clear', w: 'clear', icon: '✨' },
      sadness: { label: '悲しみ', color: '#7090c0', sky: 'cloudy', w: 'drizzle', icon: '🌧' },
      disgust: { label: '嫌悪', color: '#a0a060', sky: 'cloudy', w: 'cloudy', icon: '☁' },
      anger: { label: '怒り', color: '#e05030', sky: 'storm', w: 'storm', icon: '⛈' },
      neutral: { label: '平静', color: '#c8a870', sky: 'clear', w: 'clear', icon: '🌤' }
    };

    const WS = {
      ek: 'neutral',
      tick: 0,
      ll: 1.0
    };

    // ===== TILE MAP =====
    const TILE = { GRASS: 0, STONE: 1, WATER: 2 };
    const MAP = [];
    for (let y = 0; y < MAP_H; y++) {
      MAP[y] = [];
      for (let x = 0; x < MAP_W; x++) {
        const r = Math.random();
        if ((x === 4 || x === 5) && y > 3 && y < 14) MAP[y][x] = TILE.STONE;
        else if (x > 7 && x < 11 && y > 7 && y < 11) MAP[y][x] = TILE.WATER;
        else if (r < 0.05) MAP[y][x] = TILE.WATER;
        else MAP[y][x] = TILE.GRASS;
      }
    }

    // ===== OBJECTS =====
    const OBJS = [
      { t: 'house', x: 8, y: 4 },
      { t: 'house', x: 11, y: 5 },
      { t: 'tower', x: 2, y: 2 },
      { t: 'tower', x: 14, y: 2 },
      { t: 'tree', x: 6, y: 6 },
      { t: 'tree', x: 13, y: 8 },
      { t: 'tree', x: 7, y: 13 },
      { t: 'well', x: 9, y: 9 },
      { t: 'fire', x: 10, y: 10 }
    ];

    const CHAR = { x: 9, y: 8, dx: 0, dy: 0, fr: 0, dir: 1, act: 'wandering', timer: 0 };

    // ===== CANVAS SETUP =====
    const world = document.getElementById('world');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    let CW, CH;
    function resize() {
      CW = world.offsetWidth;
      CH = world.offsetHeight;
      cv.width = CW;
      cv.height = CH;
    }
    resize();
    window.addEventListener('resize', resize);

    // ===== ISO PROJECTION =====
    function iso(tx, ty) {
      const ox = CW / 2;
      const oy = CH * 0.2;
      return {
        x: ox + (tx - ty) * TW / 2,
        y: oy + (tx + ty) * TH / 2
      };
    }

    // ===== IMAGE LOADING =====
    const IMG = {};
    const SPR_KEYS = ['grass', 'stone', 'water', 'house', 'tower', 'tree', 'fire', 'well', 'char'];
    const SPR_PATHS = {
      grass: './sprites/grass.png',
      stone: './sprites/stone.png',
      water: './sprites/water.png',
      house: './sprites/house.png',
      tower: './sprites/tower.png',
      tree: './sprites/tree.png',
      fire: './sprites/fire.png',
      well: './sprites/well.png',
      char: './sprites/char.png'
    };

    // 四隅からフラッドフィルで背景(白～明るいグレー)を透明化
    function removeWhiteBg(img, thres) {
      const oc = document.createElement('canvas');
      oc.width = img.width; oc.height = img.height;
      const ox = oc.getContext('2d');
      ox.drawImage(img, 0, 0);
      const d = ox.getImageData(0, 0, oc.width, oc.height);
      const px = d.data;
      const W = oc.width, H = oc.height;
      const visited = new Uint8Array(W * H);

      function isLight(i) {
        return px[i] > thres && px[i + 1] > thres && px[i + 2] > thres && px[i + 3] > 10;
      }
      function flood(sx, sy) {
        const stack = [sx + sy * W];
        while (stack.length) {
          const idx = stack.pop();
          if (idx < 0 || idx >= W * H || visited[idx]) continue;
          visited[idx] = 1;
          const pi = idx * 4;
          if (px[pi + 3] < 10) continue; // already transparent
          if (!isLight(pi)) continue;
          px[pi + 3] = 0;
          const x = idx % W, y = Math.floor(idx / W);
          if (x > 0) stack.push(idx - 1);
          if (x < W - 1) stack.push(idx + 1);
          if (y > 0) stack.push(idx - W);
          if (y < H - 1) stack.push(idx + W);
        }
      }
      // 四隅からフラッドフィル
      flood(0, 0);
      flood(W - 1, 0);
      flood(0, H - 1);
      flood(W - 1, H - 1);

      ox.putImageData(d, 0, 0);
      return oc;
    }

    const TILE_KEYS = new Set(['grass', 'stone', 'water']);

    function loadSprites(cb) {
      let done = 0;
      const total = SPR_KEYS.length;
      const lb = document.getElementById('lb');
      const lstat = document.getElementById('lstat');
      SPR_KEYS.forEach(function (key) {
        const img = new Image();
        img.onload = function () {
          if (TILE_KEYS.has(key)) {
            IMG[key] = img;
          } else {
            IMG[key] = removeWhiteBg(img, 220);
          }
          done++;
          lb.style.width = (done / total * 100) + '%';
          lstat.textContent = key + ' 読み込み完了 (' + done + '/' + total + ')';
          if (done === total) cb();
        };
        img.onerror = function () {
          done++;
          lb.style.width = (done / total * 100) + '%';
          lstat.textContent = key + ' 読み込み失敗 (' + done + '/' + total + ')';
          if (done === total) cb();
        };
        img.src = SPR_PATHS[key];
      });
    }

    // ===== DRAW TILE =====
    const OBJ_PX = {
      house: { w: 120, h: 130 },
      tower: { w: 90, h: 200 },
      tree: { w: 100, h: 110 },
      fire: { w: 48, h: 48 },
      well: { w: 80, h: 100 },
      char: { w: 56, h: 72 }
    };

    function drawTile(t, tx, ty) {
      const p = iso(tx, ty);
      const key = ['grass', 'stone', 'water'][t];
      const img = IMG[key];
      if (!img) return;
      // ダイヤモンド形にクリップして白背景を隠す
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - TH / 2);
      ctx.lineTo(p.x + TW / 2, p.y);
      ctx.lineTo(p.x, p.y + TH / 2);
      ctx.lineTo(p.x - TW / 2, p.y);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img, p.x - TW / 2, p.y - TH / 2, TW, TH);
      ctx.restore();
    }

    function drawObj(o) {
      if (!o) return;
      const p = iso(o.x, o.y);
      const sz = OBJ_PX[o.t] || { w: 80, h: 80 };
      const img = IMG[o.t];
      if (!img) return;

      if (o.t === 'char') {
        const cols = 3, rows = 2;
        const fw = img.width / cols, fh = img.height / rows;
        const fi = CHAR.fr % 5;
        const sx = (fi % cols) * fw, sy = Math.floor(fi / cols) * fh;
        ctx.save();
        if (CHAR.dir < 0) {
          ctx.translate(p.x, p.y - sz.h);
          ctx.scale(-1, 1);
          ctx.drawImage(img, sx, sy, fw, fh, -sz.w / 2, 0, sz.w, sz.h);
        } else {
          ctx.drawImage(img, sx, sy, fw, fh, p.x - sz.w / 2, p.y - sz.h, sz.w, sz.h);
        }
        ctx.restore();
        return;
      }

      if (o.t === 'fire') {
        const cols = 4, rows = 2;
        const fw = img.width / cols, fh = img.height / rows;
        const fi = Math.floor(WS.tick * 0.08) % (cols * rows);
        const sx = (fi % cols) * fw, sy = Math.floor(fi / cols) * fh;
        ctx.drawImage(img, sx, sy, fw, fh, p.x - sz.w / 2, p.y - sz.h, sz.w, sz.h);
        if (WS.ll < 0.88) {
          const rad = 80;
          const gf = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
          gf.addColorStop(0, 'rgba(255,130,20,' + (0.22 * (1 - WS.ll)) + ')');
          gf.addColorStop(1, 'rgba(255,60,0,0)');
          ctx.fillStyle = gf;
          ctx.fillRect(p.x - rad, p.y - rad, rad * 2, rad * 2);
        }
        return;
      }

      ctx.drawImage(img, p.x - sz.w / 2, p.y - sz.h + TH * 0.5, sz.w, sz.h);
    }

    // ===== SKY / STARS / SUN =====
    function lerp(a, b, t) {
      // hex color lerp
      const ah = parseInt(a.slice(1), 16);
      const bh = parseInt(b.slice(1), 16);
      const r = Math.round(((ah >> 16) & 0xff) * (1 - t) + ((bh >> 16) & 0xff) * t);
      const g = Math.round(((ah >> 8) & 0xff) * (1 - t) + ((bh >> 8) & 0xff) * t);
      const bl = Math.round((ah & 0xff) * (1 - t) + (bh & 0xff) * t);
      return '#' + ((r << 16) | (g << 8) | bl).toString(16).padStart(6, '0');
    }

    function drawSky() {
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      const w = MOODS[WS.ek].w;
      let c1, c2;
      if (h >= 6 && h < 8) { const t = (h - 6) / 2; c1 = lerp('#060508', '#401808', t); c2 = lerp('#0c0618', '#a03810', t); }
      else if (h >= 8 && h < 10) { const t = (h - 8) / 2; c1 = lerp('#401808', '#102040', t); c2 = lerp('#a03810', '#3060a0', t); }
      else if (h >= 10 && h < 17) {
        if (w === 'sunny') { c1 = '#102040'; c2 = '#3878c0'; }
        else if (w === 'clear') { c1 = '#182850'; c2 = '#2868b0'; }
        else if (w === 'cloudy') { c1 = '#1e2030'; c2 = '#303848'; }
        else if (w === 'drizzle') { c1 = '#141618'; c2 = '#20282e'; }
        else { c1 = '#08080e'; c2 = '#100810'; }
      }
      else if (h >= 17 && h < 20) { const t = (h - 17) / 3; c1 = lerp('#102040', '#14061a', t); c2 = lerp('#3878c0', '#b03010', t); }
      else { c1 = '#060208'; c2 = '#05030a'; }

      const g = ctx.createLinearGradient(0, 0, 0, CH * 0.5);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CW, CH);

      ctx.fillStyle = 'rgba(15,18,32,0.6)';
      ctx.beginPath();
      ctx.moveTo(0, CH * 0.42);
      for (let hx = 0; hx <= CW; hx += 6) {
        ctx.lineTo(hx, CH * 0.35 + Math.sin(hx * 0.011 + 1) * CH * 0.045 + Math.sin(hx * 0.006) * CH * 0.028);
      }
      ctx.lineTo(CW, CH * 0.5);
      ctx.lineTo(0, CH * 0.5);
      ctx.closePath();
      ctx.fill();
    }

    function drawStars() {
      if (WS.ll > 0.7) return;
      const a = (1 - WS.ll / 0.7) * 0.9;
      for (let i = 0; i < 120; i++) {
        const sx = (i * 173 + 11) % CW;
        const sy = (i * 97 + 13) % (CH * 0.42);
        const tw = 0.5 + 0.5 * Math.sin(WS.tick * 0.007 + i);
        ctx.fillStyle = 'rgba(255,252,230,' + (a * tw) + ')';
        ctx.fillRect(sx, sy, i % 5 === 0 ? 1.5 : 0.9, i % 5 === 0 ? 1.5 : 0.9);
      }
    }

    function drawSunMoon() {
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      if (h >= 6 && h < 18) {
        const a = ((h - 6) / 12) * Math.PI;
        const sx = CW * 0.5 + Math.cos(Math.PI - a) * CW * 0.38;
        const sy = CH * 0.13 - Math.sin(a) * CH * 0.08;
        const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 44);
        gr.addColorStop(0, 'rgba(255,235,100,0.5)');
        gr.addColorStop(1, 'rgba(255,200,50,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(sx, sy, 44, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe040';
        ctx.beginPath(); ctx.arc(sx, sy, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff080';
        ctx.beginPath(); ctx.arc(sx - 3, sy - 3, 5, 0, Math.PI * 2); ctx.fill();
      } else {
        const ah = h < 6 ? h + 12 : h - 18;
        const a = (ah / 12) * Math.PI;
        const mx = CW * 0.5 + Math.cos(Math.PI - a) * CW * 0.38;
        const my = CH * 0.13 - Math.sin(a) * CH * 0.08;
        ctx.fillStyle = '#b8b090';
        ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#040308';
        ctx.beginPath(); ctx.arc(mx + 3, my - 2, 7, 0, Math.PI * 2); ctx.fill();
        const gm = ctx.createRadialGradient(mx, my, 0, mx, my, 30);
        gm.addColorStop(0, 'rgba(200,210,255,0.14)');
        gm.addColorStop(1, 'rgba(180,190,255,0)');
        ctx.fillStyle = gm;
        ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawClouds() {
      const w = MOODS[WS.ek].w;
      const cnt = { sunny: 3, clear: 6, cloudy: 12, drizzle: 18, storm: 24 }[w] || 3;
      const alp = { sunny: 0.28, clear: 0.45, cloudy: 0.78, drizzle: 0.9, storm: 0.98 }[w] || 0.28;
      for (let i = 0; i < cnt; i++) {
        const cx = ((i * 211 + WS.tick * 1.5) % CW);
        const cy = CH * 0.03 + (i % 4) * CH * 0.05;
        const cw = 60 + (i % 3) * 30;
        const gc = ctx.createRadialGradient(cx, cy, 0, cx, cy, cw);
        gc.addColorStop(0, 'rgba(200,210,230,' + alp + ')');
        gc.addColorStop(1, 'rgba(180,190,220,0)');
        ctx.fillStyle = gc;
        ctx.beginPath(); ctx.ellipse(cx, cy, cw, cw * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawRain() {
      const w = MOODS[WS.ek].w;
      if (w !== 'drizzle' && w !== 'storm') return;
      const cnt = w === 'storm' ? 200 : 80;
      ctx.strokeStyle = 'rgba(180,200,255,0.3)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (let i = 0; i < cnt; i++) {
        const rx = ((i * 173 + WS.tick * 8) % CW);
        const ry = ((i * 97 + WS.tick * 6) % CH);
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx - 2, ry + 12);
      }
      ctx.stroke();
    }

    // ===== LIGHTING =====
    function applyNight() {
      if (WS.ll >= 1.0) return;
      ctx.fillStyle = 'rgba(0,0,8,' + (1 - WS.ll) * 0.82 + ')';
      ctx.fillRect(0, 0, CW, CH);
    }

    // ===== RENDER =====
    let ltm = 0;
    function render(ts) {
      if (!ltm) ltm = ts;
      const dt = Math.min((ts - ltm) / 1000, 0.1);
      ltm = ts;
      WS.tick++;

      // light level
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      if (h >= 7 && h < 17) WS.ll = 1.0;
      else if (h >= 5 && h < 7) WS.ll = 0.15 + (h - 5) * 0.425;
      else if (h >= 17 && h < 20) WS.ll = 1.0 - (h - 17) * 0.35;
      else WS.ll = 0.08;
      const wt = MOODS[WS.ek].w;
      if (wt === 'storm') WS.ll = Math.min(WS.ll, 0.22);
      else if (wt === 'drizzle') WS.ll = Math.min(WS.ll, 0.5);
      else if (wt === 'cloudy') WS.ll = Math.min(WS.ll, 0.78);

      ctx.fillStyle = '#080511';
      ctx.fillRect(0, 0, CW, CH);
      drawSky(); drawStars(); drawSunMoon(); drawClouds();

      // tiles
      for (let ty = 0; ty < MAP_H; ty++) {
        for (let tx = 0; tx < MAP_W; tx++) {
          drawTile(MAP[ty][tx], tx, ty);
        }
      }

      // objects + char (painter's order)
      const all = OBJS.map(function (o) { return { obj: o }; });
      all.push({ obj: { t: 'char', x: CHAR.x, y: CHAR.y }, isChar: true });
      all.sort(function (a, b) { return (a.obj.x + a.obj.y) - (b.obj.x + b.obj.y); });
      all.forEach(function (item) {
        if (item.isChar) drawObj({ t: 'char', x: CHAR.x, y: CHAR.y });
        else drawObj(item.obj);
      });

      drawRain();
      applyNight();

      // character AI
      updateChar(dt);
      updateHUD();
      requestAnimationFrame(render);
    }

    // ===== CHARACTER AI =====
    const ACTIONS = {
      joy: ['広場で踊っている', 'くるくる回っている', '鼻歌を歌っている'],
      trust: ['井戸で水を汲んでいる', '庭を手入れしている', '読書をしている'],
      fear: ['物陰に隠れている', '辺りをうかがっている', 'そろそろと移動している'],
      surprise: ['立ち止まって空を見上げている', '辺りを見渡している'],
      sadness: ['ゆっくり歩いている', '焚き火の前に座っている', '川を眺めている'],
      disgust: ['ぼんやり歩いている', '何か考え込んでいる'],
      anger: ['早足で歩き回っている', '一人で剣の稽古をしている'],
      neutral: ['散歩をしている', 'か通りを歩いている', '空を見上げている']
    };

    function updateChar(dt) {
      CHAR.timer -= dt;
      if (CHAR.timer <= 0) {
        CHAR.timer = 2 + Math.random() * 4;
        const speed = WS.ek === 'anger' ? 1.5 : WS.ek === 'fear' ? 0.4 : 0.8;
        CHAR.dx = (Math.random() - 0.5) * speed;
        CHAR.dy = (Math.random() - 0.5) * speed;
        if (CHAR.dx !== 0) CHAR.dir = CHAR.dx > 0 ? 1 : -1;
        const acts = ACTIONS[WS.ek] || ACTIONS.neutral;
        document.getElementById('pact').textContent = acts[Math.floor(Math.random() * acts.length)];
      }

      const nx = CHAR.x + CHAR.dx * dt;
      const ny = CHAR.y + CHAR.dy * dt;
      if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H) {
        if (MAP[Math.floor(ny)][Math.floor(nx)] !== TILE.WATER) {
          CHAR.x = nx; CHAR.y = ny;
        } else {
          CHAR.dx = -CHAR.dx; CHAR.dy = -CHAR.dy;
        }
      } else {
        CHAR.dx = -CHAR.dx; CHAR.dy = -CHAR.dy;
      }

      if (Math.abs(CHAR.dx) > 0.05 || Math.abs(CHAR.dy) > 0.05) {
        if (WS.tick % 8 === 0) CHAR.fr = (CHAR.fr + 1) % 5;
      }
    }

    // ===== HUD =====
    function updateHUD() {
      const m = MOODS[WS.ek];
      document.getElementById('hwx').textContent = m.icon;
      document.getElementById('hmood').textContent = m.label;
      const now = new Date();
      document.getElementById('hclock').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      document.getElementById('pem').innerHTML =
        '<div style="font-size:24px;text-align:center;margin:8px 0">' + m.icon + '</div>' +
        '<div style="font-size:11px;color:' + m.color + ';text-align:center;letter-spacing:2px">' + m.label + '</div>';
    }

    // ===== PANEL =====
    function updatePanel() {
      const diEl = document.getElementById('pdi');
      diEl.textContent = '今日も自分らしく生きる一日。感情が世界を動かしている。';
    }

    // ===== START =====
    loadSprites(function () {
      const loading = document.getElementById('loading');
      loading.classList.add('out');
      setTimeout(function () { loading.style.display = 'none'; }, 900);
      updatePanel();
      requestAnimationFrame(render);
    });
  </script>
</body>
